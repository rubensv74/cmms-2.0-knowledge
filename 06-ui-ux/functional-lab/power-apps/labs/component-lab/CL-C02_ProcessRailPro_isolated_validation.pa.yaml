# BLOCK CL-C02 — ProcessRailPro isolated validation harness
# TYPE: C — Component validation harness
# ACTION: REPLACE PLACEHOLDER CONTENT BLOCKS
# TARGET: scr_ComponentLab / ph_ComponentUnderTest + ph_TestControls
# DEPENDS ON: CL-S01 STRUCTURE FROZEN + COLOR FOUNDATION APPROVED + cmp_FL_ProcessRailPro definition accepted in Studio
# TOUCHES: ph_ComponentUnderTest content + ph_TestControls content only
# DO NOT MODIFY: scr_ComponentLab geometry, scr_DesignSystemLab, cmp_FL_TreePro, Functional Lab screens, ProcessRailPro public contract
# PURPOSE: validate a real cmp_FL_ProcessRailPro instance with phase headers, statuses, responsibility semantics, inaccessible stage, selection outputs and density switching
# COLOR: UseHostTheme=false; safe fallback only; no Theme redesign
# VALIDATION: load fixture; render; select accessible stage without changing formal active stage; blocked stage remains inaccessible; phase headers; status/responsibility semantics; compact toggle; outputs; no black surfaces; no clipping
# EXPECTED STATUS AFTER PASS: cmp_FL_ProcessRailPro -> READY_FOR_INTEGRATION candidate
#
# PRECONDITION — COMPONENT DEFINITION
# Update the EXISTING cmp_FL_ProcessRailPro definition in situ from:
# power-apps/components/cmp_FL_ProcessRailPro.pa.yaml
# Do NOT add a second component identity.
# Save and confirm Studio accepts the definition before pasting this harness.
#
# PASTE INSTRUCTION
# Inside conComponentLabBody.Children replace ONLY:
# 1) ph_ComponentUnderTest
# 2) ph_TestControls

- ph_ComponentUnderTest:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =ColorValue("#CBD5E1")
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =ColorValue("#FFFFFF")
      Height: =Parent.Height
      RadiusBottomLeft: =14
      RadiusBottomRight: =14
      RadiusTopLeft: =14
      RadiusTopRight: =14
      Width: =Max(700,Parent.Width-324)
      X: =0
      Y: =0

    Children:
      - lblCLRailTitle:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#0F172A")
            FontWeight: =FontWeight.Semibold
            Size: =16
            Text: ="cmp_FL_ProcessRailPro · isolated validation"
            Width: =Parent.Width-32
            Wrap: =false
            X: =16
            Y: =14

      - lblCLRailHint:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#64748B")
            Size: =12
            Text: ="Recorrido AMEF + RCM · fases, estados, responsabilidad, accesibilidad y selección"
            Width: =Parent.Width-32
            Wrap: =true
            X: =16
            Y: =44

      - cmpCLRail:
          Control: CanvasComponent
          ComponentName: cmp_FL_ProcessRailPro
          Properties:
            ActiveStageId: =Coalesce(varCLRailActiveStage,"FL-09")
            CompactMode: =Coalesce(varCLRailCompact,false)
            Height: =Min(640,Parent.Height-104)
            Items: =colCLRailStages
            OnSelectStage: |-
              =
              Set(varCLRailSelectedStage,cmpCLRail.SelectedStageIdOut);
              Set(varCLRailSelectedScreen,cmpCLRail.SelectedScreenKeyOut)
            ShowPhaseHeaders: =Coalesce(varCLRailShowPhases,true)
            UseHostTheme: =false
            Width: =300
            X: =16
            Y: =88

      - lblCLRailReading:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#475569")
            Size: =12
            Text: ="El rail debe conservar 300 px y usar scroll antes que reducir la tipografía."
            Width: =Parent.Width-cmpCLRail.Width-64
            Wrap: =true
            X: =cmpCLRail.X+cmpCLRail.Width+24
            Y: =96

      - lblCLRailLegendTitle:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#0F172A")
            FontWeight: =FontWeight.Semibold
            Size: =13
            Text: ="Semántica esperada"
            Width: =Parent.Width-cmpCLRail.Width-64
            X: =cmpCLRail.X+cmpCLRail.Width+24
            Y: =150

      - lblCLRailLegend:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#475569")
            Size: =12
            Text: |-
              ="H · decisión humana" & Char(10) &
              "R · recomendación del sistema" & Char(10) &
              "C · cálculo del sistema" & Char(10) &
              "G · control de avance"
            Width: =Parent.Width-cmpCLRail.Width-64
            Wrap: =true
            X: =cmpCLRail.X+cmpCLRail.Width+24
            Y: =180

      - lblCLRailBlockedHint:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#B45309")
            FontWeight: =FontWeight.Semibold
            Size: =12
            Text: ="FL-12 está bloqueada y no debe activar OnSelectStage."
            Width: =Parent.Width-cmpCLRail.Width-64
            Wrap: =true
            X: =cmpCLRail.X+cmpCLRail.Width+24
            Y: =300

- ph_TestControls:
    Control: GroupContainer@1.5.0
