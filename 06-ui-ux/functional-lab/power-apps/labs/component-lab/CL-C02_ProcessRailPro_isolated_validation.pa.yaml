      BorderColor: =ColorValue("#CBD5E1")
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =ColorValue("#FFFFFF")
      Height: =Parent.Height
      RadiusBottomLeft: =14
      RadiusBottomRight: =14
      RadiusTopLeft: =14
      RadiusTopRight: =14
      Width: =300
      X: =Parent.Width-Self.Width
      Y: =0

    Children:
      - lblCLRailTestTitle:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#0F172A")
            FontWeight: =FontWeight.Semibold
            Size: =16
            Text: ="Process Rail · smoke test"
            Width: =Parent.Width-28
            X: =14
            Y: =14

      - lblCLRailTestPurpose:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#64748B")
            Size: =12
            Text: ="Fixture controlado con AMEF, RCM y un gate bloqueado."
            Width: =Parent.Width-28
            Wrap: =true
            X: =14
            Y: =44

      - btnCLRailLoad:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0284C7")
            BorderThickness: =1
            Color: =Color.White
            Fill: =ColorValue("#0284C7")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =42
            HoverFill: =ColorValue("#0369A1")
            OnSelect: |-
              =
              ClearCollect(
                  colCLRailStages,
                  {StageOrder:7,StageId:"FL-07",PhaseId:"P3",PhaseLabel:"AMEF",StageLabel:"Definir efectos del fallo",Status:"confirmed",ResponsibilityType:"human",ResponsibleRole:"Ingeniería de Fiabilidad",ScreenKey:"AMEF",IsCurrent:false,IsAccessible:true,HasWarning:false},
                  {StageOrder:8,StageId:"FL-08",PhaseId:"P3",PhaseLabel:"AMEF",StageLabel:"Valorar severidad",Status:"confirmed",ResponsibilityType:"human",ResponsibleRole:"Ingeniería de Fiabilidad",ScreenKey:"AMEF",IsCurrent:false,IsAccessible:true,HasWarning:false},
                  {StageOrder:9,StageId:"FL-09",PhaseId:"P3",PhaseLabel:"AMEF",StageLabel:"Valorar ocurrencia",Status:"draft",ResponsibilityType:"human",ResponsibleRole:"Ingeniería de Fiabilidad",ScreenKey:"AMEF",IsCurrent:true,IsAccessible:true,HasWarning:false},
                  {StageOrder:10,StageId:"FL-10",PhaseId:"P3",PhaseLabel:"AMEF",StageLabel:"Calcular riesgo AMEF",Status:"draft",ResponsibilityType:"calculation",ResponsibleRole:"Sistema",ScreenKey:"AMEF",IsCurrent:false,IsAccessible:true,HasWarning:false},
                  {StageOrder:11,StageId:"FL-11",PhaseId:"P3",PhaseLabel:"AMEF",StageLabel:"Revisar prioridad de riesgo",Status:"warning",ResponsibilityType:"human",ResponsibleRole:"Ingeniería de Fiabilidad",ScreenKey:"AMEF",IsCurrent:false,IsAccessible:true,HasWarning:true},
                  {StageOrder:12,StageId:"FL-12",PhaseId:"P4",PhaseLabel:"RCM",StageLabel:"Validar prerrequisitos RCM",Status:"blocked",ResponsibilityType:"gate",ResponsibleRole:"Control de avance",ScreenKey:"RCM",IsCurrent:false,IsAccessible:false,HasWarning:true},
                  {StageOrder:13,StageId:"FL-13",PhaseId:"P4",PhaseLabel:"RCM",StageLabel:"Aplicar lógica RCM",Status:"not_started",ResponsibilityType:"recommendation",ResponsibleRole:"Sistema",ScreenKey:"RCM",IsCurrent:false,IsAccessible:true,HasWarning:false},
                  {StageOrder:14,StageId:"FL-14",PhaseId:"P4",PhaseLabel:"RCM",StageLabel:"Confirmar estrategia",Status:"not_started",ResponsibilityType:"human",ResponsibleRole:"Ingeniería de Fiabilidad",ScreenKey:"RCM",IsCurrent:false,IsAccessible:true,HasWarning:false},
                  {StageOrder:15,StageId:"FL-15",PhaseId:"P4",PhaseLabel:"RCM",StageLabel:"Registrar justificación",Status:"not_started",ResponsibilityType:"human",ResponsibleRole:"Ingeniería de Fiabilidad",ScreenKey:"RCM",IsCurrent:false,IsAccessible:true,HasWarning:false},
                  {StageOrder:16,StageId:"FL-16",PhaseId:"P4",PhaseLabel:"RCM",StageLabel:"Cerrar decisión RCM",Status:"not_started",ResponsibilityType:"gate",ResponsibleRole:"Control de avance",ScreenKey:"RCM",IsCurrent:false,IsAccessible:true,HasWarning:false}
              );
              Set(varCLRailActiveStage,"FL-09");
              Set(varCLRailSelectedStage,"FL-09");
              Set(varCLRailSelectedScreen,"AMEF");
              Set(varCLRailCompact,false);
              Set(varCLRailShowPhases,true)
            PressedFill: =ColorValue("#075985")
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
            RadiusTopLeft: =9
            RadiusTopRight: =9
            Size: =12
            Text: ="Cargar fixture"
            Width: =Parent.Width-28
            X: =14
            Y: =94

      - btnCLRailDensity:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#CBD5E1")
            BorderThickness: =1
            Color: =ColorValue("#0F172A")
            Fill: =ColorValue("#FFFFFF")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverFill: =ColorValue("#F8FAFC")
            OnSelect: =Set(varCLRailCompact,!Coalesce(varCLRailCompact,false))
            PressedFill: =ColorValue("#F1F5F9")
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
            RadiusTopLeft: =9
            RadiusTopRight: =9
            Size: =12
            Text: =If(Coalesce(varCLRailCompact,false),"Usar Comfortable","Usar Compact")
            Width: =Parent.Width-28
            X: =14
            Y: =144

      - btnCLRailPhases:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#CBD5E1")
            BorderThickness: =1
            Color: =ColorValue("#0F172A")
            Fill: =ColorValue("#FFFFFF")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
