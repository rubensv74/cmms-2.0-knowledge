              "3 · Cambia D a 4 → NPR 100" & Char(10) &
              "4 · La celda debe seguir en S5/O5" & Char(10) &
              "5 · Recarga → vuelve a S4/O3/D3"
            Width: =Parent.Width-28
            Wrap: =true
            X: =14
            Y: =244

      - lblCLRiskOutputsTitle:
