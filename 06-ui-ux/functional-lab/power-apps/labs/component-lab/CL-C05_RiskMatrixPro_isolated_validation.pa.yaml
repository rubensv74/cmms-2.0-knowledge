            AutoHeight: =true
            Color: =ColorValue("#475569")
            Size: =12
            Text: ="S / O · " & Text(cmpCLRisk.SelectedSeverityOut) & " / " & Text(cmpCLRisk.SelectedOccurrenceOut)
            Width: =Parent.Width-28
            Wrap: =true
            X: =14
            Y: =390

      - lblCLRiskSO:
