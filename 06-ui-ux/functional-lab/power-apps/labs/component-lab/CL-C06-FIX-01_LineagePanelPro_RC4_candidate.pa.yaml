                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#0284C7")
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="→"
                  Visible: =Parent.Width>=780
                  Width: =28
                  X: =18+(Parent.Width-120)*0.26
                  Y: =57

