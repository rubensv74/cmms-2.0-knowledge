            BorderColor: =ColorValue("#CBD5E1")
            BorderThickness: =1
            Color: =ColorValue("#0F172A")
            Fill: =ColorValue("#FFFFFF")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverFill: =ColorValue("#F8FAFC")
            OnSelect: |-
              =
              Set(varCLRiskDimension,"4x6");
              Set(varCLRiskS,4);
              Set(varCLRiskO,6);
              Set(varCLRiskD,2);
              Set(varCLRiskLastEvent,"DIM_4x6")
            PressedFill: =ColorValue("#F1F5F9")
            RadiusBottomLeft: =9
