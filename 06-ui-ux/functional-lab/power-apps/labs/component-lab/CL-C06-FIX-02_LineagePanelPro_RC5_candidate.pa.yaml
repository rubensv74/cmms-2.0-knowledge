# CMMS 2.0 FUNCTIONAL LAB — LINEAGE PANEL PRO — RESPONSIVE FLOW RC5 CANDIDATE
# Base: RC4.
# Fix scope: CL-C06-FIX-02 only.
# Preserves component identity and public custom-property contract.
# Typography is preserved; compact mode uses one full-width vertical flow.
#
# Responsive envelope:
# - Width >= 780 px: four-stage horizontal lineage, host Height = 160
# - Width < 780 px: four-stage vertical lineage, host Height = 400
#
# Do not promote to canonical component until Studio validation passes.

ComponentDefinitions:
  cmp_FL_LineagePanelPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      LibraryCode:
        PropertyKind: Input
        DisplayName: LibraryCode
        Description: Código de la definición AMEF de origen.
        DataType: Text
        Default: ="AMEF-BOMBA-CENTRIFUGA"
      RevisionCode:
        PropertyKind: Input
        DisplayName: RevisionCode
        Description: Revisión AMEF aplicada.
        DataType: Text
        Default: ="R01"
      AssetCode:
        PropertyKind: Input
        DisplayName: AssetCode
        Description: Código del activo contextual.
        DataType: Text
        Default: ="P-101"
      ApplicationCode:
        PropertyKind: Input
        DisplayName: ApplicationCode
        Description: Código de aplicación de la revisión al activo.
        DataType: Text
        Default: ="APP-P101-R01"
      CriticalityLabel:
        PropertyKind: Input
        DisplayName: CriticalityLabel
        Description: Criticidad contextual del activo.
        DataType: Text
        Default: ="Alta"
      ExecutionLabel:
        PropertyKind: Input
        DisplayName: ExecutionLabel
        Description: Estado resumido del handoff hacia ejecución.
        DataType: Text
        Default: ="Plan en preparación"
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título del componente.
        DataType: Text
        Default: ="Origen y trazabilidad"
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color de acento conservado por compatibilidad de contrato.
        DataType: Color
        Default: =ColorValue("#0284C7")
      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Fondo conservado por compatibilidad de contrato.
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color de borde conservado por compatibilidad de contrato.
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color principal conservado por compatibilidad de contrato.
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color secundario conservado por compatibilidad de contrato.
        DataType: Color
        Default: =ColorValue("#64748B")

    Properties:
      Fill: =Color.Transparent
      Height: =160
      Width: =900

    Children:
      - conFLLineageRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorValue("#E2E8F0")
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#FFFFFF")
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width

          Children:
            - lblFLLineageTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =15
                  Text: =cmp_FL_LineagePanelPro.Title
                  Width: =Parent.Width-36
                  Wrap: =true
                  X: =18
                  Y: =9

            - lblFLLineageLibraryEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="BIBLIOTECA / REVISIÓN"
                  Width: =If(Parent.Width<780,Parent.Width-36,(Parent.Width-120)*0.26)
                  Wrap: =true
                  X: =18
                  Y: =38

            - lblFLLineageLibraryValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.LibraryCode & " · " & cmp_FL_LineagePanelPro.RevisionCode
                  Width: =If(Parent.Width<780,Parent.Width-36,(Parent.Width-120)*0.26)
                  Wrap: =true
                  X: =18
                  Y: =58

            - lblFLLineageArrow1:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#0284C7")
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: =If(Parent.Width<780,"↓","→")
                  Width: =If(Parent.Width<780,Parent.Width-36,28)
                  X: =If(Parent.Width<780,18,18+(Parent.Width-120)*0.26)
                  Y: =If(Parent.Width<780,lblFLLineageLibraryValue.Y+lblFLLineageLibraryValue.Height+8,57)

            - lblFLLineageApplicationEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="APLICACIÓN"
                  Width: =If(Parent.Width<780,Parent.Width-36,(Parent.Width-120)*0.20)
                  Wrap: =true
                  X: =If(Parent.Width<780,18,46+(Parent.Width-120)*0.26)
                  Y: =If(Parent.Width<780,lblFLLineageArrow1.Y+lblFLLineageArrow1.Height+8,38)

            - lblFLLineageApplicationValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.ApplicationCode
                  Width: =If(Parent.Width<780,Parent.Width-36,(Parent.Width-120)*0.20)
                  Wrap: =true
                  X: =If(Parent.Width<780,18,46+(Parent.Width-120)*0.26)
                  Y: =If(Parent.Width<780,lblFLLineageApplicationEyebrow.Y+20,58)

            - lblFLLineageArrow2:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#0284C7")
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: =If(Parent.Width<780,"↓","→")
                  Width: =If(Parent.Width<780,Parent.Width-36,28)
                  X: =If(Parent.Width<780,18,46+(Parent.Width-120)*0.46)
                  Y: =If(Parent.Width<780,lblFLLineageApplicationValue.Y+lblFLLineageApplicationValue.Height+8,57)

            - lblFLLineageAssetEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="ACTIVO / CONTEXTO"
                  Width: =If(Parent.Width<780,Parent.Width-36,(Parent.Width-120)*0.27)
                  Wrap: =true
                  X: =If(Parent.Width<780,18,74+(Parent.Width-120)*0.46)
                  Y: =If(Parent.Width<780,lblFLLineageArrow2.Y+lblFLLineageArrow2.Height+8,38)

            - lblFLLineageAssetValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.AssetCode & " · Criticidad " & cmp_FL_LineagePanelPro.CriticalityLabel
                  Width: =If(Parent.Width<780,Parent.Width-36,(Parent.Width-120)*0.27)
                  Wrap: =true
                  X: =If(Parent.Width<780,18,74+(Parent.Width-120)*0.46)
                  Y: =If(Parent.Width<780,lblFLLineageAssetEyebrow.Y+20,58)

            - lblFLLineageArrow3:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#0284C7")
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: =If(Parent.Width<780,"↓","→")
                  Width: =If(Parent.Width<780,Parent.Width-36,28)
                  X: =If(Parent.Width<780,18,74+(Parent.Width-120)*0.73)
                  Y: =If(Parent.Width<780,lblFLLineageAssetValue.Y+lblFLLineageAssetValue.Height+8,57)

            - lblFLLineageExecutionEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="HANDOFF"
                  Width: =If(Parent.Width<780,Parent.Width-36,Parent.Width-(102+(Parent.Width-120)*0.73)-18)
                  Wrap: =true
                  X: =If(Parent.Width<780,18,102+(Parent.Width-120)*0.73)
                  Y: =If(Parent.Width<780,lblFLLineageArrow3.Y+lblFLLineageArrow3.Height+8,38)

            - lblFLLineageExecutionValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.ExecutionLabel
                  Width: =If(Parent.Width<780,Parent.Width-36,Parent.Width-(102+(Parent.Width-120)*0.73)-18)
                  Wrap: =true
                  X: =If(Parent.Width<780,18,102+(Parent.Width-120)*0.73)
                  Y: =If(Parent.Width<780,lblFLLineageExecutionEyebrow.Y+20,58)

            - lblFLLineageHint:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Size: =11
                  Text: ="La ingeniería se hereda; los ajustes del activo quedan registrados en la aplicación y no modifican silenciosamente la biblioteca."
                  Width: =Parent.Width-36
                  Wrap: =true
                  X: =18
                  Y: =If(Parent.Width<780,lblFLLineageExecutionValue.Y+lblFLLineageExecutionValue.Height+18,126)
