      DropShadow: =DropShadow.None
      Fill: =ColorValue("#FFFFFF")
      Height: =Parent.Height
      RadiusBottomLeft: =14
      RadiusBottomRight: =14
      RadiusTopLeft: =14
      RadiusTopRight: =14
      Width: =300
      X: =Parent.Width-Self.Width
      Y: =0

    Children:
      - lblCLLineageTestTitle:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#0F172A")
            FontWeight: =FontWeight.Semibold
            Size: =16
            Text: ="Lineage Panel RC5 · smoke"
            Width: =Parent.Width-28
            X: =14
            Y: =14

      - lblCLLineageTestPurpose:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#64748B")
            Size: =12
            Text: ="Valida escritorio horizontal y flujo vertical compacto sin pérdida de trazabilidad."
            Width: =Parent.Width-28
            Wrap: =true
            X: =14
            Y: =44

      - btnCLLineageNormal:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0284C7")
            BorderThickness: =1
            Color: =Color.White
            Fill: =ColorValue("#0284C7")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverFill: =ColorValue("#0369A1")
            OnSelect: |-
              =
              Set(varCLLineageStress,false);
              Set(varCLLineageWidth,900)
            PressedFill: =ColorValue("#075985")
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
            RadiusTopLeft: =9
            RadiusTopRight: =9
            Size: =12
            Text: ="Normal · 900 px"
            Width: =Parent.Width-28
            X: =14
            Y: =118

      - btnCLLineageStress:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#CBD5E1")
            BorderThickness: =1
            Color: =ColorValue("#0F172A")
            Fill: =ColorValue("#FFFFFF")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =40
            HoverFill: =ColorValue("#F8FAFC")
            OnSelect: |-
              =
              Set(varCLLineageStress,true);
              Set(varCLLineageWidth,700)
            PressedFill: =ColorValue("#F1F5F9")
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
            RadiusTopLeft: =9
            RadiusTopRight: =9
            Size: =12
            Text: ="Stress · 700 px"
            Width: =Parent.Width-28
            X: =14
            Y: =166

      - lblCLLineageStateTitle:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#0F172A")
            FontWeight: =FontWeight.Semibold
            Size: =13
            Text: ="Estado del harness"
            Width: =Parent.Width-28
            X: =14
            Y: =230

      - lblCLLineageMode:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#475569")
            Size: =12
            Text: ="Modo · " & If(Coalesce(varCLLineageStress,false),"STRESS","NORMAL")
            Width: =Parent.Width-28
            Wrap: =true
            X: =14
