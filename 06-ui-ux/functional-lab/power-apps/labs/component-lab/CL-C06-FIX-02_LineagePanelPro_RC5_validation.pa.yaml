      - lblCLLineageGate:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#64748B")
            Size: =11
            Text: ="Gate · RC5 definition → Normal 900 → Stress 700 → Visual QA → Save/Reopen"
            Width: =Parent.Width-28
            Wrap: =true
            X: =14
            Y: =566
