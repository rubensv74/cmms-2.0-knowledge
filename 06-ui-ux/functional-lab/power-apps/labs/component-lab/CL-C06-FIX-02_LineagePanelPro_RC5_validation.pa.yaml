      - lblCLLineageWidth:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#475569")
            Size: =12
            Text: ="Ancho solicitado · " & Text(Coalesce(varCLLineageWidth,900)) & " px"
            Width: =Parent.Width-28
            Wrap: =true
            X: =14
            Y: =294

      - lblCLLineageHeight:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#475569")
            Size: =12
            Text: ="Altura host · " & Text(If(Coalesce(varCLLineageWidth,900)<780,400,160)) & " px"
            Width: =Parent.Width-28
            Wrap: =true
            X: =14
            Y: =328

      - lblCLLineageChecklist:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#475569")
            Size: =12
            Text: |-
              ="Comprueba:" & Char(10) &
              "1 · normal: 4 columnas" & Char(10) &
              "2 · stress: 4 etapas verticales" & Char(10) &
              "3 · valores íntegros, sin elipsis" & Char(10) &
              "4 · sin overlap ni clipping" & Char(10) &
              "5 · hint inferior completo" & Char(10) &
              "6 · tipografía sin reducción" & Char(10) &
              "7 · sin superficies negras"
