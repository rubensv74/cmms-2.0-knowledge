                  - conFLRiskBand:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: |-
                          =
                          With(
                              {
                                  _score:cmp_FL_RiskMatrixPro.MatrixScoreOut,
                                  _low:Coalesce(cmp_FL_RiskMatrixPro.LowMax,5),
                                  _moderate:Coalesce(cmp_FL_RiskMatrixPro.ModerateMax,10),
                                  _high:Coalesce(cmp_FL_RiskMatrixPro.HighMax,20)
                              },
                              If(
                                  _score<=_low,ColorValue("#86EFAC"),
                                  If(_score<=_moderate,ColorValue("#FDE68A"),If(_score<=_high,ColorValue("#FDBA74"),ColorValue("#FCA5A5")))
                              )
                          )
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =
                          With(
                              {
                                  _score:cmp_FL_RiskMatrixPro.MatrixScoreOut,
                                  _low:Coalesce(cmp_FL_RiskMatrixPro.LowMax,5),
                                  _moderate:Coalesce(cmp_FL_RiskMatrixPro.ModerateMax,10),
                                  _high:Coalesce(cmp_FL_RiskMatrixPro.HighMax,20)
                              },
                              If(
                                  _score<=_low,ColorValue("#F0FDF4"),
                                  If(_score<=_moderate,ColorValue("#FFFBEB"),If(_score<=_high,ColorValue("#FFF7ED"),ColorValue("#FEF2F2")))
                              )
                          )
