                  {RowNodeId:"CL-ROOT",RowParentNodeId:"",RowLevel:1,RowLabel:"Planta DEMO",RowDescription:"Raíz del fixture",RowSortPath:"001",RowPath:"Planta DEMO",RowNodeType:"plant",RowIconKey:"home",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
                  {RowNodeId:"CL-AREA",RowParentNodeId:"CL-ROOT",RowLevel:2,RowLabel:"Área de servicios",RowDescription:"",RowSortPath:"001/001",RowPath:"Planta DEMO > Área de servicios",RowNodeType:"area",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
                  {RowNodeId:"CL-SYS",RowParentNodeId:"CL-AREA",RowLevel:3,RowLabel:"Sistema de refrigeración",RowDescription:"",RowSortPath:"001/001/001",RowPath:"Planta DEMO > Área de servicios > Sistema de refrigeración",RowNodeType:"system",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
                  {RowNodeId:"CL-TRAIN",RowParentNodeId:"CL-SYS",RowLevel:4,RowLabel:"Tren de bombeo P-100",RowDescription:"",RowSortPath:"001/001/001/001",RowPath:"... > Sistema de refrigeración > Tren de bombeo P-100",RowNodeType:"equipment",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
                  {RowNodeId:"CL-SET",RowParentNodeId:"CL-TRAIN",RowLevel:5,RowLabel:"Conjunto bomba-motor",RowDescription:"",RowSortPath:"001/001/001/001/001",RowPath:"... > Tren de bombeo P-100 > Conjunto bomba-motor",RowNodeType:"equipment",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
                  {RowNodeId:"CL-P101",RowParentNodeId:"CL-SET",RowLevel:6,RowLabel:"P-101 · Bomba centrífuga",RowDescription:"Activo principal",RowSortPath:"001/001/001/001/001/001",RowPath:"... > Conjunto bomba-motor > P-101",RowNodeType:"tag",RowIconKey:"flag",RowHasChildren:false,RowIsExpanded:false,RowIsVisible:true},
                  {RowNodeId:"CL-P102",RowParentNodeId:"CL-SET",RowLevel:6,RowLabel:"P-102 · Bomba de reserva",RowDescription:"Reserva",RowSortPath:"001/001/001/001/001/002",RowPath:"... > Conjunto bomba-motor > P-102",RowNodeType:"tag",RowIconKey:"document",RowHasChildren:false,RowIsExpanded:false,RowIsVisible:true}
              );
              Set(varCLTreeSelectedNode,"CL-P101")
            PressedFill: =ColorValue("#075985")
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
            RadiusTopLeft: =9
            RadiusTopRight: =9
            Size: =12
            Text: ="Cargar fixture"
            Width: =Parent.Width-28
            X: =14
            Y: =94

      - btnCLTreeReset:
