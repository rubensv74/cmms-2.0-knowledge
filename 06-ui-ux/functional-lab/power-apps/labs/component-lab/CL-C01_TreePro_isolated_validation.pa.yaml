# BLOCK CL-C01 — TreePro isolated validation harness
# TYPE: C — Component validation harness
# OPERATION: REPLACE PLACEHOLDER CONTENT BLOCKS
# TARGET: scr_ComponentLab / ph_ComponentUnderTest + ph_TestControls
# DEPENDS ON: CL-S01 STRUCTURE FROZEN + cmp_FL_TreePro RC3 definition accepted in Studio
# TOUCHES: ph_ComponentUnderTest content + ph_TestControls content only
# DO NOT MODIFY: scr_ComponentLab geometry, scr_DesignSystemLab, FLH, Taxonomy, ADR, any other Functional Lab screen, TreePro public contract
# PURPOSE: validate one real cmp_FL_TreePro instance, its search/selection/toggle outputs and visual QA before revalidating frozen Asset screens
# COLOR: use component current safe fallback; no Theme redesign in this block
# VALIDATION: load fixture; render; search; select; expand/collapse; outputs; save/reopen; no black surfaces; no clipping
# EXPECTED STATUS AFTER PASS: cmp_FL_TreePro -> READY_FOR_INTEGRATION candidate
#
# PRECONDITION A — COMPONENT DEFINITION
# Update the EXISTING cmp_FL_TreePro definition in situ from the canonical RC3 source:
# power-apps/components/cmp_FL_TreePro.pa.yaml
# Do NOT add a second component copy.
# Save and confirm Studio accepts the definition before pasting this harness.
#
# PASTE INSTRUCTION
# Inside conComponentLabBody.Children:
# 1) replace ONLY the complete ph_ComponentUnderTest block with the block below;
# 2) replace ONLY the complete ph_TestControls block with the block below.

- ph_ComponentUnderTest:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      BorderColor: =ColorValue("#CBD5E1")
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =ColorValue("#FFFFFF")
      Height: =Parent.Height
      RadiusBottomLeft: =14
      RadiusBottomRight: =14
      RadiusTopLeft: =14
      RadiusTopRight: =14
      Width: =Max(700,Parent.Width-324)
      X: =0
      Y: =0

    Children:
      - lblCLTreeTitle:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#0F172A")
            FontWeight: =FontWeight.Semibold
            Size: =16
            Text: ="cmp_FL_TreePro · isolated validation"
            Width: =Parent.Width-32
            Wrap: =false
            X: =16
            Y: =14

      - lblCLTreeHint:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#64748B")
            Size: =12
            Text: ="Carga el fixture, prueba búsqueda, selección y expand/collapse. P-101 debe permanecer resaltado."
            Width: =Parent.Width-32
            Wrap: =true
            X: =16
            Y: =44

      - cmpCLTree:
          Control: CanvasComponent
          ComponentName: cmp_FL_TreePro
          Properties:
            AllowSearch: =true
            CompactMode: =true
            DeepIndentSize: =9
            DepthCompressionStart: =6
            Height: =Min(560,Parent.Height-104)
            HighlightBadgeText: ="ACTIVO"
            HighlightNodeId: ="CL-P101"
            IndentSize: =16
            Items: =colCLTreeNodes
            MaxVisualDepth: =8
            OnSelectNode: =Set(varCLTreeSelectedNode,cmpCLTree.SelectedNodeIdOut)
            OnToggleNode: |-
              =
              With(
                  {
                      _nodeId:cmpCLTree.ToggleNodeIdOut,
                      _target:cmpCLTree.ToggleTargetExpandedOut,
                      _sortPath:LookUp(colCLTreeNodes,RowNodeId=cmpCLTree.ToggleNodeIdOut,RowSortPath)
                  },
                  Patch(
                      colCLTreeNodes,
                      LookUp(colCLTreeNodes,RowNodeId=_nodeId),
                      {RowIsExpanded:_target}
                  );
                  If(
                      _target,
                      UpdateIf(colCLTreeNodes,RowParentNodeId=_nodeId,{RowIsVisible:true}),
                      UpdateIf(
                          colCLTreeNodes,
                          StartsWith(RowSortPath,_sortPath & "/"),
                          {RowIsVisible:false,RowIsExpanded:false}
                      )
                  )
              )
            SearchText: =""
            SelectedNodeId: =Coalesce(varCLTreeSelectedNode,"CL-P101")
            ShowBreadcrumb: =true
            ShowDescriptions: =false
            ShowHighlightBadge: =true
            ShowIcons: =true
            ShowLines: =true
            Width: =Min(620,Parent.Width-32)
            X: =16
            Y: =88

