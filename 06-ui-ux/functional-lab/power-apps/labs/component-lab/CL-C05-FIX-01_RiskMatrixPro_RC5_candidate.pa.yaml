                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ColorValue("#EAB308")
                              Height: =8
                              Width: =8
                              X: =10
                              Y: =10
                        - lblFLRiskLegendModerate:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#475569")
                              Size: =11
                              Text: =cmp_FL_RiskMatrixPro.ModerateLabel
                              Width: =86
                              X: =26
                              Y: =7

                  - conFLRiskLegendHigh:
