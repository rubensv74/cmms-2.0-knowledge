                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =410/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                        Width: =410
                        X: =110
                        Y: =68
                      Children:
                        - lblFLRiskColumn:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =12
                              Text: =Text(ThisItem.ScaleLabel)
                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =5

                  - galFLRiskRows:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =Color.Transparent
                        Height: =280
                        Items: =SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending)
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =56
                        Width: =42
                        X: =64
                        Y: =102
                      Children:
                        - lblFLRiskRow:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =12
                              Text: =Text(ThisItem.ScaleLabel)
                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =18

                  - galFLRiskMatrix:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =Color.Transparent
                        Default: =LookUp(Sequence(25),Value=(5-Min(5,Max(1,cmp_FL_RiskMatrixPro.SeverityValue)))*5+Min(5,Max(1,cmp_FL_RiskMatrixPro.OccurrenceValue)))
                        Height: =280
                        Items: =Sequence(25)
                        OnSelect: =cmp_FL_RiskMatrixPro.OnSelectCell()
                        ShowScrollbar: =false
                        TemplateFill: =Color.Transparent
                        TemplatePadding: =0
                        TemplateSize: =56
                        Width: =410
                        WrapCount: =5
                        X: =110
                        Y: =102
                      Children:
                        - btnFLRiskCell:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =If(ThisItem.IsSelected,ColorValue("#2563EB"),RGBA(0,0,0,0))
                              BorderThickness: =If(ThisItem.IsSelected,3,0)
                              Color: =ColorValue("#0F172A")
                              Fill: |-
                                =
                                With(
                                    {_rowPos:RoundUp(Value(ThisItem.Value)/5,0),_colPos:Mod(Value(ThisItem.Value)-1,5)+1},
                                    With(
                                        {_score:(6-_rowPos)*_colPos},
                                        If(
                                            _score<=cmp_FL_RiskMatrixPro.LowMax,
                                            If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.LowColor,ColorValue("#DCFCE7")),
                                            If(
                                                _score<=cmp_FL_RiskMatrixPro.ModerateMax,
                                                If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.ModerateColor,ColorValue("#FEF3C7")),
                                                If(
                                                    _score<=cmp_FL_RiskMatrixPro.HighMax,
                                                    If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.HighColor,ColorValue("#FED7AA")),
                                                    If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.CriticalColor,ColorValue("#FECACA"))
                                                )
                                            )
                                        )
                                    )
                                )
                              FontWeight: =If(ThisItem.IsSelected,FontWeight.Bold,FontWeight.Semibold)
                              Height: =48
                              HoverFill: =Self.Fill
                              OnSelect: =Select(Parent)
                              PressedFill: =Self.Fill
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =15
                              Text: |-
                                =
                                With(
                                    {_rowPos:RoundUp(Value(ThisItem.Value)/5,0),_colPos:Mod(Value(ThisItem.Value)-1,5)+1},
                                    Text((6-_rowPos)*_colPos)
                                )
                              Width: =Parent.TemplateWidth-8
                              X: =4
                              Y: =4

                  - conFLRiskLegendLow:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =28
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =116
                        X: =24
                        Y: =392
                      Children:
