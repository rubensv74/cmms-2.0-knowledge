                        Text: =cmp_FL_RiskMatrixPro.ColumnAxisTitle
                        Width: =410
                        X: =110
                        Y: =45

                  - lblFLRiskRowAxis:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#475569")
                        FontWeight: =FontWeight.Semibold
                        Size: =11
                        Text: =cmp_FL_RiskMatrixPro.RowAxisTitle
                        Width: =84
                        Wrap: =false
                        X: =18
                        Y: =73

