# BLOCK CL-C05-FIX-01 — RiskMatrixPro RC5 visual redesign candidate
# TYPE: FIX — visual QA repair
# ACTION: UPDATE EXISTING COMPONENT DEFINITION IN SITU
# TARGET: cmp_FL_RiskMatrixPro existing identity
# DEPENDS ON: CL-C05 visual QA failure + COLOR FOUNDATION APPROVED
# TOUCHES: RiskMatrixPro internal visual composition only
# DO NOT MODIFY: public contract, S/O/D semantics, NPR formula, ComponentLab geometry, other components, functional screens
# PURPOSE: convert the RC4 technical demo layout into a premium operational AMEF risk decision component
# VALIDATION: S4/O3/D3 -> 12/36; S5/O5 -> 25/75; D4 -> NPR100 without moving matrix selection; no clipping; no black surfaces; strong hierarchy
# EXPECTED STATUS AFTER PASS: CL-C05 RISKMATRIX PASS / READY_FOR_INTEGRATION
#
# IMPORTANT
# Apply this definition to the EXISTING cmp_FL_RiskMatrixPro identity.
# Do not add a second component copy.

ComponentDefinitions:
  cmp_FL_RiskMatrixPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título visible del componente.
        DataType: Text
        Default: ="Matriz de riesgo AMEF"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Explicación breve de la matriz.
        DataType: Text
        Default: ="Valoración contextual del modo de fallo"
      ContextLabel:
        PropertyKind: Input
        DisplayName: ContextLabel
        Description: Código contextual mostrado en la cabecera.
        DataType: Text
        Default: ="P-101"
      RowAxisTitle:
        PropertyKind: Input
        DisplayName: RowAxisTitle
        Description: Título semántico del eje vertical.
        DataType: Text
        Default: ="SEVERIDAD"
      ColumnAxisTitle:
        PropertyKind: Input
        DisplayName: ColumnAxisTitle
        Description: Título semántico del eje horizontal.
        DataType: Text
        Default: ="OCURRENCIA"
      RowScale:
        PropertyKind: Input
        DisplayName: RowScale
        Description: Escala vertical AMEF 1–5.
        DataType: Table
        Default: =ForAll(Sequence(5),{ScaleIndex:Value,ScaleLabel:Text(Value),ScaleScore:Value})
      ColumnScale:
        PropertyKind: Input
        DisplayName: ColumnScale
        Description: Escala horizontal AMEF 1–5.
        DataType: Table
        Default: =ForAll(Sequence(5),{ScaleIndex:Value,ScaleLabel:Text(Value),ScaleScore:Value})
      MatrixMode:
        PropertyKind: Input
        DisplayName: MatrixMode
        Description: PRODUCT calcula S×O y CONFIGURED queda reservado.
        DataType: Text
        Default: ="PRODUCT"
      MatrixCells:
        PropertyKind: Input
        DisplayName: MatrixCells
        Description: Tabla opcional para futuras matrices configuradas.
        DataType: Table
        Default: =Table({RowIndex:0,ColumnIndex:0,CellScore:-1,BandKey:""})
      SeverityValue:
        PropertyKind: Input
        DisplayName: SeverityValue
        Description: Severidad actual AMEF.
        DataType: Number
        Default: =4
      OccurrenceValue:
        PropertyKind: Input
        DisplayName: OccurrenceValue
        Description: Ocurrencia actual AMEF.
        DataType: Number
        Default: =3
      DetectionValue:
        PropertyKind: Input
        DisplayName: DetectionValue
        Description: Detección AMEF que no altera la posición S×O.
        DataType: Number
        Default: =3
      DetectionLabel:
        PropertyKind: Input
        DisplayName: DetectionLabel
        Description: Etiqueta visible de detección.
        DataType: Text
        Default: ="Detección"
      ShowDetection:
        PropertyKind: Input
        DisplayName: ShowDetection
        Description: Muestra u oculta detección.
        DataType: Boolean
        Default: =true
      RiskScore:
        PropertyKind: Input
        DisplayName: RiskScore
        Description: NPR del host; con cero se calcula S×O×D.
        DataType: Number
        Default: =0
      RiskScoreLabel:
        PropertyKind: Input
        DisplayName: RiskScoreLabel
        Description: Etiqueta visible del NPR.
        DataType: Text
        Default: ="NPR"
      ShowRiskScore:
        PropertyKind: Input
        DisplayName: ShowRiskScore
        Description: Muestra u oculta NPR.
        DataType: Boolean
        Default: =true
      CriticalOverride:
        PropertyKind: Input
        DisplayName: CriticalOverride
        Description: Texto reservado para sobreclasificación o excepción.
        DataType: Text
        Default: ="No"
      LowMax:
        PropertyKind: Input
        DisplayName: LowMax
        Description: Umbral máximo de banda baja.
        DataType: Number
        Default: =5
      ModerateMax:
        PropertyKind: Input
        DisplayName: ModerateMax
        Description: Umbral máximo de banda moderada.
        DataType: Number
        Default: =10
      HighMax:
        PropertyKind: Input
        DisplayName: HighMax
        Description: Umbral máximo de banda alta.
        DataType: Number
        Default: =20
      LowLabel:
        PropertyKind: Input
        DisplayName: LowLabel
        Description: Etiqueta de banda baja.
        DataType: Text
        Default: ="Bajo"
      ModerateLabel:
        PropertyKind: Input
        DisplayName: ModerateLabel
        Description: Etiqueta de banda moderada.
        DataType: Text
        Default: ="Moderado"
      HighLabel:
        PropertyKind: Input
        DisplayName: HighLabel
        Description: Etiqueta de banda alta.
        DataType: Text
        Default: ="Alto"
      CriticalLabel:
        PropertyKind: Input
        DisplayName: CriticalLabel
        Description: Etiqueta de banda crítica.
        DataType: Text
        Default: ="Crítico"
      LowColor:
        PropertyKind: Input
        DisplayName: LowColor
        Description: Color de banda baja.
        DataType: Color
        Default: =ColorValue("#DCFCE7")
      ModerateColor:
        PropertyKind: Input
        DisplayName: ModerateColor
        Description: Color de banda moderada.
        DataType: Color
        Default: =ColorValue("#FEF3C7")
      HighColor:
        PropertyKind: Input
        DisplayName: HighColor
        Description: Color de banda alta.
        DataType: Color
        Default: =ColorValue("#FED7AA")
      CriticalColor:
        PropertyKind: Input
        DisplayName: CriticalColor
        Description: Color de banda crítica.
        DataType: Color
        Default: =ColorValue("#FECACA")
      UseHostTheme:
        PropertyKind: Input
        DisplayName: UseHostTheme
        Description: Usa colores del host cuando se habilita.
        DataType: Boolean
        Default: =false
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color principal de selección.
        DataType: Color
        Default: =ColorValue("#2563EB")
      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Color de superficie.
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color de borde.
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color de texto principal.
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color de texto secundario.
        DataType: Color
        Default: =ColorValue("#64748B")
      ScaleNote:
        PropertyKind: Input
        DisplayName: ScaleNote
        Description: Nota sobre procedencia de escalas y umbrales.
        DataType: Text
        Default: ="Matriz AMEF 5×5 · escalas y umbrales definidos por el host"
      OnSelectCell:
        PropertyKind: Event
        DisplayName: OnSelectCell
        Description: Se ejecuta al seleccionar una celda.
        ReturnType: None
        Default: =false
      SelectedSeverityOut:
        PropertyKind: Output
        DisplayName: SelectedSeverityOut
        Description: Severidad seleccionada.
        DataType: Number
      SelectedOccurrenceOut:
        PropertyKind: Output
        DisplayName: SelectedOccurrenceOut
        Description: Ocurrencia seleccionada.
        DataType: Number
      SelectedRowLabelOut:
        PropertyKind: Output
        DisplayName: SelectedRowLabelOut
        Description: Etiqueta de severidad seleccionada.
        DataType: Text
      SelectedColumnLabelOut:
        PropertyKind: Output
        DisplayName: SelectedColumnLabelOut
        Description: Etiqueta de ocurrencia seleccionada.
        DataType: Text
      MatrixScoreOut:
        PropertyKind: Output
        DisplayName: MatrixScoreOut
        Description: S×O de la celda seleccionada.
        DataType: Number
      MatrixBandOut:
        PropertyKind: Output
        DisplayName: MatrixBandOut
        Description: Banda cualitativa de la celda seleccionada.
        DataType: Text

    Properties:
      Fill: =Color.Transparent
      Height: =650
      Width: =900
      SelectedSeverityOut: |-
        =
        With(
            {_v:Coalesce(galFLRiskMatrix.Selected.Value,(5-Min(5,Max(1,cmp_FL_RiskMatrixPro.SeverityValue)))*5+Min(5,Max(1,cmp_FL_RiskMatrixPro.OccurrenceValue)))},
            6-RoundUp(Value(_v)/5,0)
        )
      SelectedOccurrenceOut: |-
        =
        With(
            {_v:Coalesce(galFLRiskMatrix.Selected.Value,(5-Min(5,Max(1,cmp_FL_RiskMatrixPro.SeverityValue)))*5+Min(5,Max(1,cmp_FL_RiskMatrixPro.OccurrenceValue)))},
            Mod(Value(_v)-1,5)+1
        )
      SelectedRowLabelOut: =Coalesce(LookUp(cmp_FL_RiskMatrixPro.RowScale,ScaleScore=cmp_FL_RiskMatrixPro.SelectedSeverityOut,ScaleLabel),Text(cmp_FL_RiskMatrixPro.SelectedSeverityOut))
      SelectedColumnLabelOut: =Coalesce(LookUp(cmp_FL_RiskMatrixPro.ColumnScale,ScaleScore=cmp_FL_RiskMatrixPro.SelectedOccurrenceOut,ScaleLabel),Text(cmp_FL_RiskMatrixPro.SelectedOccurrenceOut))
      MatrixScoreOut: =cmp_FL_RiskMatrixPro.SelectedSeverityOut*cmp_FL_RiskMatrixPro.SelectedOccurrenceOut
      MatrixBandOut: |-
        =
        With(
            {_score:cmp_FL_RiskMatrixPro.MatrixScoreOut},
            If(
                _score<=cmp_FL_RiskMatrixPro.LowMax,
                cmp_FL_RiskMatrixPro.LowLabel,
                If(
                    _score<=cmp_FL_RiskMatrixPro.ModerateMax,
                    cmp_FL_RiskMatrixPro.ModerateLabel,
                    If(_score<=cmp_FL_RiskMatrixPro.HighMax,cmp_FL_RiskMatrixPro.HighLabel,cmp_FL_RiskMatrixPro.CriticalLabel)
                )
            )
        )

    Children:
      - conFLRiskRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.BorderColor,ColorValue("#E2E8F0"))
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.SurfaceColor,ColorValue("#FFFFFF"))
            Height: =Parent.Height
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Width: =Parent.Width

          Children:
            - lblFLRiskEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.AccentColor,ColorValue("#2563EB"))
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="AMEF · VALORACIÓN DEL MODO DE FALLO"
                  Width: =620
                  Wrap: =false
                  X: =24
                  Y: =16

            - lblFLRiskTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.TextColor,ColorValue("#0F172A"))
                  FontWeight: =FontWeight.Bold
                  Size: =23
                  Text: =cmp_FL_RiskMatrixPro.Title
                  Width: =620
                  Wrap: =false
                  X: =24
                  Y: =34

            - lblFLRiskSubtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.MutedTextColor,ColorValue("#64748B"))
                  Size: =12
                  Text: =cmp_FL_RiskMatrixPro.Subtitle
                  Width: =620
                  Wrap: =false
                  X: =24
                  Y: =65

            - conFLRiskContext:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#C7D2FE")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#EEF2FF")
                  Height: =40
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  Width: =104
                  X: =Parent.Width-Self.Width-24
                  Y: =24
                Children:
                  - lblFLRiskContext:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#4338CA")
                        FontWeight: =FontWeight.Bold
                        Size: =12
                        Text: =cmp_FL_RiskMatrixPro.ContextLabel
                        Width: =Parent.Width
                        X: =0
                        Y: =11

            - conFLRiskMatrixPanel:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#E2E8F0")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
