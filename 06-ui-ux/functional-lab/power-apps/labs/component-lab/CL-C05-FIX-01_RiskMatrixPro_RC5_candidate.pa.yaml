                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0F172A")
                        FontWeight: =FontWeight.Semibold
                        Size: =13
                        Text: ="Matriz S × O"
                        Width: =160
                        X: =18
                        Y: =14

                  - lblFLRiskMatrixHint:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Right
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        Size: =11
                        Text: ="Selecciona una celda para valorar el riesgo"
                        Width: =300
