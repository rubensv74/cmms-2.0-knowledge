                        Width: =116
                        X: =272
                        Y: =392
                      Children:
                        - recFLRiskLegendHigh:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ColorValue("#F97316")
                              Height: =8
                              Width: =8
                              X: =10
                              Y: =10
                        - lblFLRiskLegendHigh:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#475569")
                              Size: =11
