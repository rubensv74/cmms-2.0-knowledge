                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =116
                        X: =396
                        Y: =392
                      Children:
                        - recFLRiskLegendCritical:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ColorValue("#DC2626")
                              Height: =8
                              Width: =8
                              X: =10
                              Y: =10
                        - lblFLRiskLegendCritical:
                            Control: ModernText@1.0.0
