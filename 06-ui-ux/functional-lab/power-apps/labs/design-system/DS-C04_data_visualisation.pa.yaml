# BLOCK DS-C04 — Data visualisation roles
# TYPE: C — Component/content
# OPERATION: REPLACE PLACEHOLDER CONTENT BLOCK
# TARGET: ph_DataViz
# PARENT/ANCHOR: conDSLabBody
# DEPENDS ON: DS-S01 STRUCTURE FROZEN + DS-C01 PASS/FIX + DS-C02 PASS + DS-C03 PASS
# TOUCHES: ph_DataViz only
# DO NOT MODIFY: ph_TokenRoles, ph_Text, ph_ClassicControls, ph_ModernControls, ph_InteractionStates, ph_Status, conDSLabBody geometry, header, any Functional Lab screen/component
# PURPOSE: validate a six-role categorical data palette in Studio and keep data-series color semantically separate from selection/status color
# GEOMETRY: placeholder X/Y/Width/Height contract preserved exactly
# COLOR STATUS BEFORE: PENDING
# VALIDATION: Chart01…Chart06 render distinctly; labels legible; no unexpected black surfaces; selected example preserves its series color; geometry unchanged
# EXPECTED STATUS AFTER PASS: DS-C04 VISUAL_APPROVED / candidate COLOR FOUNDATION APPROVED after full DesignSystemLab smoke
#
# PASTE INSTRUCTION:
# Inside conDSLabBody.Children, replace ONLY the complete block beginning at
# '- ph_DataViz:' and ending immediately before '- ph_Status:'.

