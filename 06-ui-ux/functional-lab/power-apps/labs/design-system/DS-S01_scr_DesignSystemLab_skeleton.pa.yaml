# BLOCK DS-S01 — Design System Lab skeleton
# TYPE: S — Structural
# OPERATION: CREATE / REPLACE SCREEN STRUCTURE
# TARGET: scr_DesignSystemLab
# DEPENDS ON: none
# TOUCHES: scr_DesignSystemLab only
# DO NOT MODIFY: Functional Lab screens, reusable components, bootstrap, navigation
# VALIDATION: render + geometry + no overlap + no blocking App Checker regression
# EXPECTED STATUS AFTER STUDIO VALIDATION: STRUCTURE FROZEN / COLOR PENDING

Screens:
  scr_DesignSystemLab:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")

    Children:
      - conDSLabRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
            X: =0
            Y: =0

          Children:
            - conDSLabHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#E2E8F0")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#FFFFFF")
                  Height: =96
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                  X: =0
                  Y: =0

                Children:
                  - lblDSLabEyebrow:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0284C7")
                        FontWeight: =FontWeight.Semibold
                        Size: =11
                        Text: ="DESIGN SYSTEM LAB · DS-S01"
                        Width: =Parent.Width-260
                        Wrap: =false
                        X: =24
                        Y: =14

                  - lblDSLabTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0F172A")
                        FontWeight: =FontWeight.Semibold
                        Size: =26
                        Text: ="Laboratorio visual CMMS 2.0"
                        Width: =Parent.Width-260
                        Wrap: =false
                        X: =24
                        Y: =34

                  - lblDSLabSubtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        Size: =13
                        Text: ="Skeleton estructural · sin componentes funcionales · color todavía no aprobado"
                        Width: =Parent.Width-260
                        Wrap: =false
                        X: =24
                        Y: =70

