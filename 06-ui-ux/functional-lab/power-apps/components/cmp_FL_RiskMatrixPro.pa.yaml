                              Size: =20
                              Text: ="×"
                              Width: =Parent.Width
                              X: =0
                              Y: =14
                  - lblFLRiskSOLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#556987")
                        FontWeight: =FontWeight.Semibold
                        Size: =12
                        Text: ="S × O"
                        Width: =112
                        X: =70
                        Y: =16
                  - lblFLRiskSOValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#6D28D9")
                        FontWeight: =FontWeight.Bold
                        Size: =24
                        Text: =Text(cmp_FL_RiskMatrixPro.MatrixScoreOut)
                        Width: =90
                        X: =70
                        Y: =39
            - conFLRiskNPR:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#C9D8F3")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F9FBFF")
                  Height: =76
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =328
                  X: =Parent.Width-Self.Width-42
                  Y: =504
                Children:
                  - conFLRiskNPRIcon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E5E7EB")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =54
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =54
                        X: =12
                        Y: =11
                      Children:
                        - lblFLRiskNPRIcon:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =ColorValue("#1E40AF")
                              FontWeight: =FontWeight.Bold
                              Size: =18
                              Text: ="N"
                              Width: =Parent.Width
                              X: =0
                              Y: =16
                  - lblFLRiskNPRLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#556987")
                        FontWeight: =FontWeight.Semibold
                        Size: =12
                        Text: =Upper(cmp_FL_RiskMatrixPro.RiskScoreLabel) & " (S × O × D)"
                        Width: =220
                        X: =82
                        Y: =14
                  - lblFLRiskNPRValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#1D4ED8")
                        FontWeight: =FontWeight.Bold
                        Size: =27
                        Text: =Text(cmp_FL_RiskMatrixPro.RiskScore)
                        Width: =130
                        X: =82
                        Y: =35
            - recFLRiskFooterDivider:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#E5EBF4")
                  Height: =1
                  Width: =Parent.Width
                  X: =0
                  Y: =598
            - lblFLRiskFooterInfo:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#7A8CA8")
                  FontWeight: =FontWeight.Bold
                  Size: =12
                  Text: ="i"
                  Width: =24
                  X: =30
                  Y: =617
            - lblFLRiskScaleNote:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Size: =12
                  Text: =cmp_FL_RiskMatrixPro.ScaleNote
                  Width: =Parent.Width-92
                  Wrap: =false
                  X: =64
                  Y: =614
