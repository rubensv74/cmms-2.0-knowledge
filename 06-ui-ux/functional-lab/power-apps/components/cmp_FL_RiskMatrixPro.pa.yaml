                  X: =286
                  Y: =501
                Children:
                  - conFLRiskSOIcon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#F4EFFF")
                        Height: =54
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =54
                        X: =0
                        Y: =14
                      Children:
