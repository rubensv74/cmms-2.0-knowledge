                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_RiskMatrixPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =10
                        Text: |-
                          =
                          "S×O " &
                          Text(cmp_FL_RiskMatrixPro.SeverityValue*cmp_FL_RiskMatrixPro.OccurrenceValue) &
                          " · " &
                          cmp_FL_RiskMatrixPro.MatrixBandOut
                        Width: =145
                        X: =12
                        Y: =8
                  - lblFLRiskMatrixNPR:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_RiskMatrixPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =10
                        Text: ="NPR " & Text(cmp_FL_RiskMatrixPro.RiskScore)
                        Width: =90
                        X: =160
                        Y: =8
                  - lblFLRiskMatrixDetection:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                        Size: =8
                        Text: ="Detección " & Text(cmp_FL_RiskMatrixPro.DetectionValue)
                        Width: =100
                        X: =252
                        Y: =10
                  - lblFLRiskMatrixOverride:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                        Size: =8
                        Text: |-
                          =
                          "Sobreclasificación: " & cmp_FL_RiskMatrixPro.CriticalOverride
                        Width: =Parent.Width-366
                        X: =354
                        Y: =10
                  - lblFLRiskMatrixNote:
