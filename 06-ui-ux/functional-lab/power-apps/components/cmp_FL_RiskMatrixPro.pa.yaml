                  FontWeight: =FontWeight.Semibold
                  Size: =8
                  Text: ="OCURRENCIA →"
                  Width: =Parent.Width-92
                  Wrap: =false
                  X: =72
                  Y: =63
            - lblFLRiskAxisSeverity:
