# CMMS 2.0 FUNCTIONAL LAB — RISK MATRIX PRO — PREMIUM 5x5 RC3
#
# Visual source of truth: Premium AMEF 5×5 reference approved in conversation.
# Preserves the canonical AMEF host contract and component identity.
# Default geometry is intentionally 900×650. Host screens should not compress it.

ComponentDefinitions:
  cmp_FL_RiskMatrixPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título visible del componente.
        DataType: Text
        Default: ="Matriz de riesgo AMEF"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Explicación breve de la matriz.
        DataType: Text
        Default: ="Valoración contextual del modo de fallo"
      ContextLabel:
        PropertyKind: Input
        DisplayName: ContextLabel
        Description: Código contextual mostrado en la cabecera, normalmente el activo analizado.
        DataType: Text
        Default: ="P-101"
      RowAxisTitle:
        PropertyKind: Input
        DisplayName: RowAxisTitle
        Description: Título semántico del eje vertical.
        DataType: Text
        Default: ="SEVERIDAD"
      ColumnAxisTitle:
        PropertyKind: Input
        DisplayName: ColumnAxisTitle
        Description: Título semántico del eje horizontal.
        DataType: Text
        Default: ="OCURRENCIA"
      RowScale:
        PropertyKind: Input
        DisplayName: RowScale
        Description: Escala del eje vertical. Campos ScaleIndex, ScaleLabel y ScaleScore.
        DataType: Table
        Default: =ForAll(Sequence(5),{ScaleIndex:Value,ScaleLabel:Text(Value),ScaleScore:Value})
      ColumnScale:
        PropertyKind: Input
        DisplayName: ColumnScale
        Description: Escala del eje horizontal. Campos ScaleIndex, ScaleLabel y ScaleScore.
        DataType: Table
        Default: =ForAll(Sequence(5),{ScaleIndex:Value,ScaleLabel:Text(Value),ScaleScore:Value})
      MatrixMode:
        PropertyKind: Input
        DisplayName: MatrixMode
        Description: PRODUCT calcula RowScore×ColumnScore; CONFIGURED utiliza MatrixCells.
        DataType: Text
        Default: ="PRODUCT"
      MatrixCells:
        PropertyKind: Input
        DisplayName: MatrixCells
        Description: Tabla opcional para matrices configuradas. Campos RowIndex, ColumnIndex, CellScore y BandKey.
        DataType: Table
        Default: =Table({RowIndex:0,ColumnIndex:0,CellScore:-1,BandKey:""})
      SeverityValue:
        PropertyKind: Input
        DisplayName: SeverityValue
        Description: Score actual del eje vertical; en AMEF representa Severidad.
        DataType: Number
        Default: =4
      OccurrenceValue:
        PropertyKind: Input
        DisplayName: OccurrenceValue
        Description: Score actual del eje horizontal; en AMEF representa Ocurrencia.
        DataType: Number
        Default: =3
      DetectionValue:
        PropertyKind: Input
        DisplayName: DetectionValue
        Description: Métrica auxiliar de Detección para uso AMEF.
        DataType: Number
        Default: =3
      DetectionLabel:
        PropertyKind: Input
        DisplayName: DetectionLabel
        Description: Etiqueta visible para la métrica auxiliar de detección.
        DataType: Text
        Default: ="Detección"
      ShowDetection:
        PropertyKind: Input
        DisplayName: ShowDetection
        Description: Muestra u oculta la métrica auxiliar de Detección.
        DataType: Boolean
        Default: =true
      RiskScore:
        PropertyKind: Input
        DisplayName: RiskScore
        Description: Indicador global calculado por el host; en AMEF representa NPR.
        DataType: Number
        Default: =36
      RiskScoreLabel:
        PropertyKind: Input
        DisplayName: RiskScoreLabel
        Description: Etiqueta visible del indicador global.
        DataType: Text
        Default: ="NPR"
      ShowRiskScore:
        PropertyKind: Input
        DisplayName: ShowRiskScore
        Description: Muestra u oculta el indicador global del host.
        DataType: Boolean
        Default: =true
      CriticalOverride:
        PropertyKind: Input
        DisplayName: CriticalOverride
        Description: Texto de sobreclasificación o excepción crítica.
        DataType: Text
        Default: ="No"
      LowMax:
        PropertyKind: Input
        DisplayName: LowMax
        Description: Máximo del score de matriz para banda baja.
        DataType: Number
        Default: =5
      ModerateMax:
        PropertyKind: Input
        DisplayName: ModerateMax
        Description: Máximo del score de matriz para banda moderada.
        DataType: Number
        Default: =10
      HighMax:
        PropertyKind: Input
        DisplayName: HighMax
        Description: Máximo del score de matriz para banda alta.
        DataType: Number
        Default: =20
      LowLabel:
        PropertyKind: Input
        DisplayName: LowLabel
        Description: Etiqueta de banda baja.
        DataType: Text
        Default: ="Bajo"
      ModerateLabel:
        PropertyKind: Input
        DisplayName: ModerateLabel
        Description: Etiqueta de banda moderada.
        DataType: Text
        Default: ="Moderado"
      HighLabel:
        PropertyKind: Input
        DisplayName: HighLabel
        Description: Etiqueta de banda alta.
        DataType: Text
        Default: ="Alto"
      CriticalLabel:
        PropertyKind: Input
        DisplayName: CriticalLabel
        Description: Etiqueta de banda crítica.
        DataType: Text
        Default: ="Crítico"
      LowColor:
        PropertyKind: Input
        DisplayName: LowColor
        Description: Color de banda baja.
        DataType: Color
        Default: =ColorValue("#D6F2D7")
      ModerateColor:
        PropertyKind: Input
        DisplayName: ModerateColor
        Description: Color de banda moderada.
        DataType: Color
        Default: =ColorValue("#F2EDB4")
      HighColor:
        PropertyKind: Input
        DisplayName: HighColor
        Description: Color de banda alta.
        DataType: Color
        Default: =ColorValue("#F8D697")
      CriticalColor:
        PropertyKind: Input
        DisplayName: CriticalColor
        Description: Color de banda crítica.
        DataType: Color
        Default: =ColorValue("#F3A0A7")
      UseHostTheme:
        PropertyKind: Input
        DisplayName: UseHostTheme
        Description: Usa colores del host. Desactivado por defecto por compatibilidad Studio.
        DataType: Boolean
        Default: =false
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color principal de acento.
        DataType: Color
        Default: =ColorValue("#2563EB")
      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Color de superficie.
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color de borde.
        DataType: Color
        Default: =ColorValue("#DCE4F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color de texto principal.
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color de texto secundario.
        DataType: Color
        Default: =ColorValue("#64748B")
      ScaleNote:
        PropertyKind: Input
        DisplayName: ScaleNote
        Description: Nota sobre procedencia o validación de escalas y umbrales.
        DataType: Text
        Default: ="Matriz AMEF 5×5 · escalas y umbrales definidos por el host"
      OnSelectCell:
        PropertyKind: Event
        DisplayName: OnSelectCell
        Description: Se ejecuta al seleccionar una celda.
        ReturnType: None
        Default: =false
      SelectedSeverityOut:
        PropertyKind: Output
        DisplayName: SelectedSeverityOut
        Description: Score seleccionado del eje vertical.
        DataType: Number
      SelectedOccurrenceOut:
        PropertyKind: Output
        DisplayName: SelectedOccurrenceOut
        Description: Score seleccionado del eje horizontal.
        DataType: Number
      SelectedRowLabelOut:
        PropertyKind: Output
        DisplayName: SelectedRowLabelOut
        Description: Etiqueta seleccionada del eje vertical.
        DataType: Text
      SelectedColumnLabelOut:
        PropertyKind: Output
        DisplayName: SelectedColumnLabelOut
        Description: Etiqueta seleccionada del eje horizontal.
        DataType: Text
      MatrixScoreOut:
        PropertyKind: Output
        DisplayName: MatrixScoreOut
        Description: Score de la celda actual.
        DataType: Number
      MatrixBandOut:
        PropertyKind: Output
        DisplayName: MatrixBandOut
        Description: Banda cualitativa de la celda actual.
        DataType: Text

    Properties:
      Fill: =Color.Transparent
      Height: =650
      Width: =900
      SelectedSeverityOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            cmp_FL_RiskMatrixPro.SeverityValue,
            With({_rowPos:RoundUp(Value(galFLRiskMatrix.Selected.Value)/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),0)},Last(FirstN(SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),_rowPos)).ScaleScore)
        )
      SelectedOccurrenceOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            cmp_FL_RiskMatrixPro.OccurrenceValue,
            With({_colPos:Mod(Value(galFLRiskMatrix.Selected.Value)-1,Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))+1},Last(FirstN(SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),_colPos)).ScaleScore)
        )
      SelectedRowLabelOut: =Coalesce(LookUp(cmp_FL_RiskMatrixPro.RowScale,ScaleScore=cmp_FL_RiskMatrixPro.SelectedSeverityOut,ScaleLabel),Text(cmp_FL_RiskMatrixPro.SelectedSeverityOut))
      SelectedColumnLabelOut: =Coalesce(LookUp(cmp_FL_RiskMatrixPro.ColumnScale,ScaleScore=cmp_FL_RiskMatrixPro.SelectedOccurrenceOut,ScaleLabel),Text(cmp_FL_RiskMatrixPro.SelectedOccurrenceOut))
      MatrixScoreOut: |-
        =
        With(
            {_rowRec:LookUp(cmp_FL_RiskMatrixPro.RowScale,ScaleScore=cmp_FL_RiskMatrixPro.SelectedSeverityOut),_colRec:LookUp(cmp_FL_RiskMatrixPro.ColumnScale,ScaleScore=cmp_FL_RiskMatrixPro.SelectedOccurrenceOut)},
            With({_configuredScore:LookUp(cmp_FL_RiskMatrixPro.MatrixCells,RowIndex=_rowRec.ScaleIndex && ColumnIndex=_colRec.ScaleIndex,CellScore)},If(Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" && !IsBlank(_configuredScore) && _configuredScore>=0,_configuredScore,cmp_FL_RiskMatrixPro.SelectedSeverityOut*cmp_FL_RiskMatrixPro.SelectedOccurrenceOut))
        )
      MatrixBandOut: |-
        =
        With({_score:cmp_FL_RiskMatrixPro.MatrixScoreOut},If(_score<=cmp_FL_RiskMatrixPro.LowMax,cmp_FL_RiskMatrixPro.LowLabel,If(_score<=cmp_FL_RiskMatrixPro.ModerateMax,cmp_FL_RiskMatrixPro.ModerateLabel,If(_score<=cmp_FL_RiskMatrixPro.HighMax,cmp_FL_RiskMatrixPro.HighLabel,cmp_FL_RiskMatrixPro.CriticalLabel))))

    Children:
      - conFLRiskRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.BorderColor,ColorValue("#DCE4F0"))
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.SurfaceColor,ColorValue("#FFFFFF"))
            Height: =Parent.Height
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            RadiusTopLeft: =22
            RadiusTopRight: =22
            Width: =Parent.Width
          Children:
            - conFLRiskMark:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#D8D4FE")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F5F3FF")
                  Height: =48
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =48
                  X: =30
                  Y: =24
                Children:
                  - lblFLRiskMark:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#5B5CEB")
                        FontWeight: =FontWeight.Bold
                        Size: =16
                        Text: ="▦"
                        Width: =Parent.Width
                        X: =0
                        Y: =13
            - lblFLRiskTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Bold
                  Size: =24
                  Text: =cmp_FL_RiskMatrixPro.Title
                  Width: =560
                  Wrap: =false
                  X: =96
                  Y: =23
            - lblFLRiskSubtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Size: =13
                  Text: =cmp_FL_RiskMatrixPro.Subtitle
                  Width: =590
                  Wrap: =false
                  X: =96
                  Y: =56
            - conFLRiskContext:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#D8D4FE")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F7F5FF")
                  Height: =46
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  Width: =112
                  X: =Parent.Width-142
                  Y: =25
                Children:
                  - lblFLRiskContext:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#4F46E5")
                        FontWeight: =FontWeight.Bold
                        Size: =13
                        Text: =cmp_FL_RiskMatrixPro.ContextLabel
                        Width: =Parent.Width
                        X: =0
                        Y: =13
            - lblFLRiskColAxis:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#556987")
                  FontWeight: =FontWeight.Bold
                  Size: =14
                  Text: =cmp_FL_RiskMatrixPro.ColumnAxisTitle
                  Width: =600
                  X: =180
                  Y: =103
            - galFLRiskColumnHeaders:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =32
                  Items: =SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending)
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =600/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                  Width: =600
                  X: =180
                  Y: =132
                Children:
                  - lblFLRiskColumn:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#0F172A")
                        FontWeight: =FontWeight.Semibold
                        Size: =13
                        Text: =Text(ThisItem.ScaleLabel)
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =7
            - lblFLRiskRowAxis:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#556987")
                  FontWeight: =FontWeight.Bold
                  Size: =13
                  Text: =cmp_FL_RiskMatrixPro.RowAxisTitle
                  Width: =118
                  Wrap: =false
                  X: =28
                  Y: =165
            - galFLRiskRows:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =300
                  Items: =SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending)
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =60
                  Width: =46
                  X: =128
                  Y: =171
                Children:
                  - lblFLRiskRow:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#0F172A")
                        FontWeight: =FontWeight.Semibold
                        Size: =13
                        Text: =Text(ThisItem.ScaleLabel)
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =20
            - galFLRiskMatrix:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =300
                  Items: =Sequence(25)
                  OnSelect: =cmp_FL_RiskMatrixPro.OnSelectCell()
                  ShowScrollbar: =false
                  TemplateFill: =Color.Transparent
                  TemplatePadding: =4
                  TemplateSize: =60
                  Width: =600
                  WrapCount: =5
                  X: =180
                  Y: =171
                Children:
                  - btnFLRiskCell:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: |-
                          =
                          With({_rowPos:RoundUp(Value(ThisItem.Value)/5,0),_colPos:Mod(Value(ThisItem.Value)-1,5)+1},With({_rowScore:6-_rowPos,_colScore:_colPos},If(_rowScore=cmp_FL_RiskMatrixPro.SeverityValue && _colScore=cmp_FL_RiskMatrixPro.OccurrenceValue,ColorValue("#2563EB"),RGBA(0,0,0,0))))
                        BorderThickness: |-
                          =
                          With({_rowPos:RoundUp(Value(ThisItem.Value)/5,0),_colPos:Mod(Value(ThisItem.Value)-1,5)+1},With({_rowScore:6-_rowPos,_colScore:_colPos},If(_rowScore=cmp_FL_RiskMatrixPro.SeverityValue && _colScore=cmp_FL_RiskMatrixPro.OccurrenceValue,3,0)))
                        Color: =ColorValue("#0F172A")
                        Fill: |-
                          =
                          With({_rowPos:RoundUp(Value(ThisItem.Value)/5,0),_colPos:Mod(Value(ThisItem.Value)-1,5)+1},With({_score:(6-_rowPos)*_colPos},If(_score<=5,ColorValue("#D6F2D7"),If(_score<=10,ColorValue("#F2EDB4"),If(_score<=20,ColorValue("#F8D697"),ColorValue("#F3A0A7"))))))
                        FontWeight: =FontWeight.Semibold
                        Height: =50
                        HoverFill: =Self.Fill
                        OnSelect: =Select(Parent)
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =16
                        Text: |-
                          =
                          With({_rowPos:RoundUp(Value(ThisItem.Value)/5,0),_colPos:Mod(Value(ThisItem.Value)-1,5)+1},Text((6-_rowPos)*_colPos))
                        Width: =110
                        X: =5
                        Y: =5
            - recFLRiskDivider:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ColorValue("#E5EBF4")
                  Height: =1
                  Width: =Parent.Width-60
                  X: =30
                  Y: =486
            - conFLRiskDetection:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
