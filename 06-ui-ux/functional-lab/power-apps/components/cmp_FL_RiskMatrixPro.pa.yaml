                  Text: ="1"
                  Width: =26
                  X: =42
                  Y: =105+9*((Parent.Height-142)/10)
            - galFLRiskMatrix:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =Parent.Height-142
                  Items: =Sequence(100)
                  OnSelect: =cmp_FL_RiskMatrixPro.OnSelectCell()
                  ShowScrollbar: =false
                  TemplatePadding: =1
                  TemplateSize: =(Self.Height/10)
                  Width: =Parent.Width-100
                  WrapCount: =10
                  X: =72
                  Y: =103
                Children:
                  - btnFLRiskCell:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: |-
                          =
                          If(
                              10-RoundDown((Value(ThisItem.Value)-1)/10,0)=cmp_FL_RiskMatrixPro.SeverityValue &&
                              Mod(Value(ThisItem.Value)-1,10)+1=cmp_FL_RiskMatrixPro.OccurrenceValue,
                              ColorValue("#0F172A"),
                              ColorValue("#FFFFFF")
                          )
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: |-
                          =
                          If(
                              10-RoundDown((Value(ThisItem.Value)-1)/10,0)=cmp_FL_RiskMatrixPro.SeverityValue &&
                              Mod(Value(ThisItem.Value)-1,10)+1=cmp_FL_RiskMatrixPro.OccurrenceValue,
                              3,
                              1
                          )
                        Color: =ColorValue("#0F172A")
                        Fill: |-
                          =
                          With(
                              {
                                  s:10-RoundDown((Value(ThisItem.Value)-1)/10,0),
                                  o:Mod(Value(ThisItem.Value)-1,10)+1
                              },
                              If(
                                  s*o<=cmp_FL_RiskMatrixPro.LowMax,
                                  cmp_FL_RiskMatrixPro.LowColor,
                                  If(
                                      s*o<=cmp_FL_RiskMatrixPro.ModerateMax,
                                      cmp_FL_RiskMatrixPro.ModerateColor,
                                      If(s*o<=cmp_FL_RiskMatrixPro.HighMax,cmp_FL_RiskMatrixPro.HighColor,cmp_FL_RiskMatrixPro.CriticalColor)
                                  )
                              )
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight
                        HoverFill: =Self.Fill
                        OnSelect: =Select(Parent)
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =8
                        Text: |-
                          =
                          If(
                              10-RoundDown((Value(ThisItem.Value)-1)/10,0)=cmp_FL_RiskMatrixPro.SeverityValue &&
                              Mod(Value(ThisItem.Value)-1,10)+1=cmp_FL_RiskMatrixPro.OccurrenceValue,
                              "●",
                              ""
                          )
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
            - conFLRiskMatrixSummary:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FL_RiskMatrixPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F8FAFC")
                  Height: =54
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Parent.Width-32
                  X: =16
                  Y: =Parent.Height-62
