                        AutoHeight: =true
                        Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                        Size: =7
                        Text: =cmp_FL_RiskMatrixPro.ScaleNote
                        Width: =Parent.Width-24
                        X: =12
                        Y: =31
