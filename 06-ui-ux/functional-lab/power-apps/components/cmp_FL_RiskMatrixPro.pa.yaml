ComponentDefinitions:
  cmp_FL_RiskMatrixPro:
    DefinitionType: CanvasComponent
    CustomProperties:
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título del componente
        DataType: Text
        Default: ="Matriz de riesgo AMEF"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Subtítulo descriptivo
        DataType: Text
        Default: ="Valoración contextual del modo de fallo"
      AssetTag:
        PropertyKind: Input
        DisplayName: AssetTag
        Description: Etiqueta del activo
        DataType: Text
        Default: ="P-101"
      DetectionScore:
        PropertyKind: Input
        DisplayName: DetectionScore
        Description: Valor de detección D
        DataType: Number
        Default: =3
      SelectedSeverityIn:
        PropertyKind: Input
        DisplayName: SelectedSeverityIn
        Description: Severidad inicial
        DataType: Number
        Default: =4
      SelectedOccurrenceIn:
        PropertyKind: Input
        DisplayName: SelectedOccurrenceIn
        Description: Ocurrencia inicial
        DataType: Number
        Default: =3
      FooterNote:
        PropertyKind: Input
        DisplayName: FooterNote
        Description: Nota inferior
        DataType: Text
        Default: ="Matriz AMEF 5×5 configurada para el activo P-101 en CMMS Functional Lab."
      ShowFooterNote:
        PropertyKind: Input
        DisplayName: ShowFooterNote
        Description: Muestra la nota inferior
        DataType: Boolean
        Default: =true
      OnCellSelect:
        PropertyKind: Event
        ReturnType: None
        Default: =
      SelectedSeverityOut:
        PropertyKind: Output
        DataType: Number
      SelectedOccurrenceOut:
        PropertyKind: Output
        DataType: Number
      MatrixScoreOut:
        PropertyKind: Output
        DataType: Number
      RpnOut:
        PropertyKind: Output
        DataType: Number
      SelectedBandOut:
        PropertyKind: Output
        DataType: Text
    Properties:
      Width: =1220
      Height: =860
      SelectedSeverityOut: =Min(5, Max(1, Coalesce(varRM_SelectedSeverity, cmp_FL_RiskMatrixPro.SelectedSeverityIn, 4)))
      SelectedOccurrenceOut: =Min(5, Max(1, Coalesce(varRM_SelectedOccurrence, cmp_FL_RiskMatrixPro.SelectedOccurrenceIn, 3)))
      MatrixScoreOut: =cmp_FL_RiskMatrixPro.SelectedSeverityOut * cmp_FL_RiskMatrixPro.SelectedOccurrenceOut
      RpnOut: =cmp_FL_RiskMatrixPro.MatrixScoreOut * Min(5, Max(1, cmp_FL_RiskMatrixPro.DetectionScore))
      SelectedBandOut: |-
        =With(
            { _score: cmp_FL_RiskMatrixPro.MatrixScoreOut },
            If(
                _score <= 5,
                "BAJO",
                If(
                    _score <= 10,
                    "MODERADO",
                    If(
                        _score <= 15,
                        "ALTO",
                        "CRÍTICO"
                    )
                )
            )
        )
      OnReset: |-
        =
        Set(varRM_SelectedSeverity, Min(5, Max(1, cmp_FL_RiskMatrixPro.SelectedSeverityIn)));
        Set(varRM_SelectedOccurrence, Min(5, Max(1, cmp_FL_RiskMatrixPro.SelectedOccurrenceIn)))
    Children:
      - conRMP_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorValue("#DCE4F0")
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#FFFFFF")
            Height: =Parent.Height
            RadiusBottomLeft: =24
            RadiusBottomRight: =24
            RadiusTopLeft: =24
            RadiusTopRight: =24
            Width: =Parent.Width
          Children:
            - conRMP_HeaderIcon:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#D9D4FF")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F5F3FF")
                  Height: =64
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =64
                  X: =36
                  Y: =30
                Children:
                  - lblRMP_HeaderIcon:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorValue("#5B5CEB")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =18
                        Text: ="▦"
                        Width: =40
                        X: =12
                        Y: =12

            - lblRMP_Title:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorValue("#0F172A")
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =40
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =24
                  Text: =cmp_FL_RiskMatrixPro.Title
                  Width: =620
                  X: =124
                  Y: =32

            - lblRMP_Subtitle:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorValue("#5B6F93")
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  Height: =28
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =13
                  Text: =cmp_FL_RiskMatrixPro.Subtitle
                  Width: =680
                  X: =124
                  Y: =70

            - conRMP_AssetBadge:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#D9D4FF")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F7F5FF")
                  Height: =56
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =132
                  X: =Parent.Width - 168
                  Y: =34
                Children:
                  - lblRMP_AssetBadgeText:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorValue("#4F46E5")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =14
                        Text: =cmp_FL_RiskMatrixPro.AssetTag
                        Width: =96
                        X: =18
                        Y: =14

            - lblRMP_OccurrenceAxis:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorValue("#556987")
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =16
                  Text: ="OCURRENCIA"
                  Width: =650
                  X: =330
                  Y: =136

            - galRMP_ColumnHeaders:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  Height: =40
                  Items: =Sequence(5)
                  ShowScrollbar: =false
                  TemplatePadding: =12
                  TemplateSize: =124
                  Width: =668
                  X: =314
                  Y: =176
                Children:
                  - lblRMP_ColumnHeader:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorValue("#0F172A")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        Size: =16
                        Text: =Text(ThisItem.Value)
                        Width: =112
                        X: =6
                        Y: =4

            - lblRMP_SeverityAxis:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorValue("#556987")
                  Fill: =Color.Transparent
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =34
                  Size: =16
                  Text: ="SEVERIDAD"
                  Width: =120
                  X: =66
                  Y: =288

            - galRMP_Rows:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =398
                  Items: =Sequence(5, 5, -1)
                  ShowScrollbar: =false
                  TemplatePadding: =8
                  TemplateSize: =72
                  Width: =860
                  X: =170
                  Y: =220
                Children:
                  - lblRMP_RowHeader:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorValue("#0F172A")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =64
                        Size: =16
                        Text: =Text(ThisItem.Value)
                        Width: =44
                        X: =0
                        Y: =2

                  - galRMP_Cells:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        Height: =64
                        Items: |-
                          =With(
                              { _sev: Value(ThisItem.Value) },
                              AddColumns(
                                  Sequence(5),
                                  OccurrenceScore, Value,
                                  SeverityScore, _sev,
                                  CellScore, _sev * Value
                              )
                          )
                        ShowScrollbar: =false
                        TemplatePadding: =12
                        TemplateSize: =124
                        Width: =668
                        X: =60
                        Y: =2
                      Children:
                        - btnRMP_Cell:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: |-
                                =If(
                                    cmp_FL_RiskMatrixPro.SelectedSeverityOut = ThisItem.SeverityScore &&
                                    cmp_FL_RiskMatrixPro.SelectedOccurrenceOut = ThisItem.OccurrenceScore,
                                    ColorValue("#2563EB"),
                                    RGBA(255,255,255,0)
                                )
                              BorderThickness: =If(cmp_FL_RiskMatrixPro.SelectedSeverityOut = ThisItem.SeverityScore && cmp_FL_RiskMatrixPro.SelectedOccurrenceOut = ThisItem.OccurrenceScore, 3, 0)
                              Color: =ColorValue("#0F172A")
                              Fill: |-
                                =With(
                                    { _score: ThisItem.CellScore },
                                    If(
                                        _score <= 5,
                                        ColorValue("#CDECCB"),
                                        If(
                                            _score <= 10,
                                            ColorValue("#E8E4AE"),
                                            If(
                                                _score <= 15,
                                                ColorValue("#F4D88F"),
                                                If(
                                                    _score <= 20,
                                                    ColorValue("#F2C88C"),
                                                    ColorValue("#EEA1A7")
                                                )
                                            )
                                        )
                                    )
                                )
                              FocusedBorderColor: =ColorValue("#2563EB")
                              FocusedBorderThickness: =3
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(cmp_FL_RiskMatrixPro.SelectedSeverityOut = ThisItem.SeverityScore && cmp_FL_RiskMatrixPro.SelectedOccurrenceOut = ThisItem.OccurrenceScore, FontWeight.Bold, FontWeight.Semibold)
                              Height: =64
                              HoverBorderColor: =ColorValue("#2563EB")
                              HoverColor: =Self.Color
                              HoverFill: =ColorFade(Self.Fill, -0.04)
                              OnSelect: |-
                                =
                                Set(varRM_SelectedSeverity, ThisItem.SeverityScore);
                                Set(varRM_SelectedOccurrence, ThisItem.OccurrenceScore);
                                cmp_FL_RiskMatrixPro.OnCellSelect()
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              PressedBorderColor: =ColorValue("#1D4ED8")
                              PressedColor: =Self.Color
                              PressedFill: =ColorFade(Self.Fill, -0.08)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =16
                              Text: =Text(ThisItem.CellScore)
                              Tooltip: ="Severidad " & Text(ThisItem.SeverityScore) & " · Ocurrencia " & Text(ThisItem.OccurrenceScore) & " · S×O = " & Text(ThisItem.CellScore)
                              Width: =112
                              X: =6
                              Y: =0

            - recRMP_Divider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =ColorValue("#E5EBF4")
                  Height: =1
                  Width: =Parent.Width - 72
                  X: =36
                  Y: =626

            - conRMP_DetectionCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#FFFFFF")
                  Height: =104
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =230
                  X: =52
                  Y: =652
                Children:
                  - conRMP_DetectionIcon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Fill: =ColorValue("#EAF1FF")
                        Height: =68
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =68
                        X: =0
                        Y: =18
                      Children:
                        - lblRMP_DetectionIcon:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =ColorValue("#1D4ED8")
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =42
                              Size: =18
                              Text: ="D"
                              Width: =42
                              X: =13
                              Y: =13

                  - lblRMP_DetectionCaption:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#556987")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="Detección"
                        Width: =120
                        X: =92
                        Y: =20

                  - lblRMP_DetectionValue:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#1D4ED8")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =22
                        Text: =Text(Min(5, Max(1, cmp_FL_RiskMatrixPro.DetectionScore)))
                        Width: =70
                        X: =92
                        Y: =46

            - conRMP_SxOCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#FFFFFF")
                  Height: =104
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =230
                  X: =386
                  Y: =652
                Children:
                  - conRMP_SxOIcon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Fill: =ColorValue("#F4EFFF")
                        Height: =68
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =68
                        X: =0
                        Y: =18
                      Children:
                        - lblRMP_SxOIcon:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =ColorValue("#6D28D9")
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =42
                              Size: =18
                              Text: ="×"
                              Width: =42
                              X: =13
                              Y: =13

                  - lblRMP_SxOCaption:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#556987")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="S × O"
                        Width: =120
                        X: =92
                        Y: =20

                  - lblRMP_SxOValue:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#6D28D9")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        Size: =22
                        Text: =Text(cmp_FL_RiskMatrixPro.MatrixScoreOut)
                        Width: =80
                        X: =92
                        Y: =46

            - conRMP_RpnCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#C9D8F3")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F9FBFF")
                  Height: =104
                  RadiusBottomLeft: =18
                  RadiusBottomRight: =18
                  RadiusTopLeft: =18
                  RadiusTopRight: =18
                  Width: =416
                  X: =752
                  Y: =652
                Children:
                  - conRMP_RpnIcon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Fill: =ColorValue("#FFFFFF")
                        Height: =68
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =68
                        X: =22
                        Y: =18
                      Children:
                        - lblRMP_RpnIcon:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =ColorValue("#1E40AF")
                              Fill: =Color.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =42
                              Size: =18
                              Text: ="N"
                              Width: =42
                              X: =13
                              Y: =13

                  - lblRMP_RpnCaption:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#556987")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="NPR (S × O × D)"
                        Width: =180
                        X: =108
                        Y: =20

                  - lblRMP_RpnValue:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#1D4ED8")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        Size: =24
                        Text: =Text(cmp_FL_RiskMatrixPro.RpnOut)
                        Width: =120
                        X: =108
                        Y: =44

                  - lblRMP_RpnBand:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =If(cmp_FL_RiskMatrixPro.SelectedBandOut = "CRÍTICO", ColorValue("#B45309"), If(cmp_FL_RiskMatrixPro.SelectedBandOut = "ALTO", ColorValue("#92400E"), If(cmp_FL_RiskMatrixPro.SelectedBandOut = "MODERADO", ColorValue("#6B7280"), ColorValue("#166534")))
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: =cmp_FL_RiskMatrixPro.SelectedBandOut
                        Width: =120
                        X: =272
                        Y: =44

            - recRMP_FooterDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =ColorValue("#E5EBF4")
                  Height: =1
                  Visible: =cmp_FL_RiskMatrixPro.ShowFooterNote
                  Width: =Parent.Width
                  Y: =790

            - conRMP_FooterNote:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  Fill: =ColorValue("#FFFFFF")
                  Height: =54
                  Visible: =cmp_FL_RiskMatrixPro.ShowFooterNote
                  Width: =Parent.Width
                  Y: =798
                Children:
                  - lblRMP_FooterIcon:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ColorValue("#7A8CA8")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        Size: =14
                        Text: ="i"
                        Width: =20
                        X: =38
                        Y: =15

                  - lblRMP_FooterText:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ColorValue("#64748B")
                        Fill: =Color.Transparent
                        Font: =Font.'Segoe UI'
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =cmp_FL_RiskMatrixPro.FooterNote
                        Width: =Parent.Width - 92
                        X: =72
                        Y: =15
