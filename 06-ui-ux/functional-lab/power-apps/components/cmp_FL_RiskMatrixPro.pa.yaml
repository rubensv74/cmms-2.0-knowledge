ComponentDefinitions:
  cmp_FL_RiskMatrixPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título visible del componente.
        DataType: Text
        Default: ="Matriz de riesgo"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Explicación breve de la matriz.
        DataType: Text
        Default: ="Matriz configurable · escalas definidas por el host"
      RowAxisTitle:
        PropertyKind: Input
        DisplayName: RowAxisTitle
        Description: Título semántico del eje vertical.
        DataType: Text
        Default: ="SEVERIDAD"
      ColumnAxisTitle:
        PropertyKind: Input
        DisplayName: ColumnAxisTitle
        Description: Título semántico del eje horizontal.
        DataType: Text
        Default: ="OCURRENCIA"
      RowScale:
        PropertyKind: Input
        DisplayName: RowScale
        Description: Escala del eje vertical. Campos requeridos ScaleIndex, ScaleLabel y ScaleScore.
        DataType: Table
        Default: =ForAll(Sequence(10),{ScaleIndex:Value,ScaleLabel:Text(Value),ScaleScore:Value})
      ColumnScale:
        PropertyKind: Input
        DisplayName: ColumnScale
        Description: Escala del eje horizontal. Campos requeridos ScaleIndex, ScaleLabel y ScaleScore.
        DataType: Table
        Default: =ForAll(Sequence(10),{ScaleIndex:Value,ScaleLabel:Text(Value),ScaleScore:Value})
      MatrixMode:
        PropertyKind: Input
        DisplayName: MatrixMode
        Description: PRODUCT calcula RowScore×ColumnScore; CONFIGURED utiliza MatrixCells.
        DataType: Text
        Default: ="PRODUCT"
      MatrixCells:
        PropertyKind: Input
        DisplayName: MatrixCells
        Description: Tabla opcional para matrices configuradas. Campos RowIndex, ColumnIndex, CellScore y BandKey.
        DataType: Table
        Default: =Table({RowIndex:0,ColumnIndex:0,CellScore:-1,BandKey:""})
      SeverityValue:
        PropertyKind: Input
        DisplayName: SeverityValue
        Description: Score actual del eje vertical; en AMEF representa Severidad.
        DataType: Number
        Default: =8
      OccurrenceValue:
        PropertyKind: Input
        DisplayName: OccurrenceValue
        Description: Score actual del eje horizontal; en AMEF representa Ocurrencia.
        DataType: Number
        Default: =4
      DetectionValue:
        PropertyKind: Input
        DisplayName: DetectionValue
        Description: Métrica auxiliar de Detección para uso AMEF; no altera la posición de la matriz.
        DataType: Number
        Default: =3
      DetectionLabel:
        PropertyKind: Input
        DisplayName: DetectionLabel
        Description: Etiqueta visible para la métrica auxiliar de detección.
        DataType: Text
        Default: ="Detección"
      ShowDetection:
        PropertyKind: Input
        DisplayName: ShowDetection
        Description: Muestra u oculta la métrica auxiliar de Detección.
        DataType: Boolean
        Default: =true
      RiskScore:
        PropertyKind: Input
        DisplayName: RiskScore
        Description: Indicador global calculado por el host; en AMEF representa NPR.
        DataType: Number
        Default: =96
      RiskScoreLabel:
        PropertyKind: Input
        DisplayName: RiskScoreLabel
        Description: Etiqueta visible del indicador global.
        DataType: Text
        Default: ="NPR"
      ShowRiskScore:
        PropertyKind: Input
        DisplayName: ShowRiskScore
        Description: Muestra u oculta el indicador global del host.
        DataType: Boolean
        Default: =true
      CriticalOverride:
        PropertyKind: Input
        DisplayName: CriticalOverride
        Description: Texto de sobreclasificación o excepción crítica.
        DataType: Text
        Default: ="No"
      LowMax:
        PropertyKind: Input
        DisplayName: LowMax
        Description: Máximo del score de matriz para banda baja en modo PRODUCT.
        DataType: Number
        Default: =20
      ModerateMax:
        PropertyKind: Input
        DisplayName: ModerateMax
        Description: Máximo del score de matriz para banda moderada en modo PRODUCT.
        DataType: Number
        Default: =40
      HighMax:
        PropertyKind: Input
        DisplayName: HighMax
        Description: Máximo del score de matriz para banda alta en modo PRODUCT; superiores son críticos.
        DataType: Number
        Default: =70
      LowLabel:
        PropertyKind: Input
        DisplayName: LowLabel
        Description: Etiqueta de banda baja.
        DataType: Text
        Default: ="Bajo"
      ModerateLabel:
        PropertyKind: Input
        DisplayName: ModerateLabel
        Description: Etiqueta de banda moderada.
        DataType: Text
        Default: ="Moderado"
      HighLabel:
        PropertyKind: Input
        DisplayName: HighLabel
        Description: Etiqueta de banda alta.
        DataType: Text
        Default: ="Alto"
      CriticalLabel:
        PropertyKind: Input
        DisplayName: CriticalLabel
        Description: Etiqueta de banda crítica.
        DataType: Text
        Default: ="Crítico"
      LowColor:
        PropertyKind: Input
        DisplayName: LowColor
        Description: Color de banda baja.
        DataType: Color
        Default: =ColorValue("#DCFCE7")
      ModerateColor:
        PropertyKind: Input
        DisplayName: ModerateColor
        Description: Color de banda moderada.
        DataType: Color
        Default: =ColorValue("#FEF3C7")
      HighColor:
        PropertyKind: Input
        DisplayName: HighColor
        Description: Color de banda alta.
        DataType: Color
        Default: =ColorValue("#FFEDD5")
      CriticalColor:
        PropertyKind: Input
        DisplayName: CriticalColor
        Description: Color de banda crítica.
        DataType: Color
        Default: =ColorValue("#FEE2E2")
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color principal de acento.
        DataType: Color
        Default: =ColorValue("#0284C7")
      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Color de superficie.
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color de borde.
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color de texto principal.
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color de texto secundario.
        DataType: Color
        Default: =ColorValue("#64748B")
      ScaleNote:
        PropertyKind: Input
        DisplayName: ScaleNote
        Description: Nota sobre procedencia o validación de escalas y umbrales.
        DataType: Text
        Default: ="Escalas y umbrales configurables por el host"
      OnSelectCell:
        PropertyKind: Event
        DisplayName: OnSelectCell
        Description: Se ejecuta al seleccionar una celda.
        ReturnType: None
        Default: =false
      SelectedSeverityOut:
        PropertyKind: Output
        DisplayName: SelectedSeverityOut
        Description: Score seleccionado del eje vertical. Alias compatible con AMEF.
        DataType: Number
      SelectedOccurrenceOut:
        PropertyKind: Output
        DisplayName: SelectedOccurrenceOut
        Description: Score seleccionado del eje horizontal. Alias compatible con AMEF.
        DataType: Number
      SelectedRowLabelOut:
        PropertyKind: Output
        DisplayName: SelectedRowLabelOut
        Description: Etiqueta seleccionada del eje vertical.
        DataType: Text
      SelectedColumnLabelOut:
        PropertyKind: Output
        DisplayName: SelectedColumnLabelOut
        Description: Etiqueta seleccionada del eje horizontal.
        DataType: Text
      MatrixScoreOut:
        PropertyKind: Output
        DisplayName: MatrixScoreOut
        Description: Score de la celda actual.
        DataType: Number
      MatrixBandOut:
        PropertyKind: Output
        DisplayName: MatrixBandOut
        Description: Banda cualitativa de la celda actual.
        DataType: Text

    Properties:
      Fill: =Color.Transparent
      Height: =330
      MatrixScoreOut: |-
        =
        With(
            {
                rowRec:LookUp(cmp_FL_RiskMatrixPro.RowScale,ScaleScore=cmp_FL_RiskMatrixPro.SeverityValue),
                colRec:LookUp(cmp_FL_RiskMatrixPro.ColumnScale,ScaleScore=cmp_FL_RiskMatrixPro.OccurrenceValue)
            },
            With(
                {
                    configuredScore:LookUp(
                        cmp_FL_RiskMatrixPro.MatrixCells,
                        RowIndex=rowRec.ScaleIndex && ColumnIndex=colRec.ScaleIndex,
                        CellScore
                    )
                },
                If(
                    Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" && !IsBlank(configuredScore) && configuredScore>=0,
                    configuredScore,
                    cmp_FL_RiskMatrixPro.SeverityValue*cmp_FL_RiskMatrixPro.OccurrenceValue
                )
            )
        )
      MatrixBandOut: |-
        =
        With(
            {
                rowRec:LookUp(cmp_FL_RiskMatrixPro.RowScale,ScaleScore=cmp_FL_RiskMatrixPro.SeverityValue),
                colRec:LookUp(cmp_FL_RiskMatrixPro.ColumnScale,ScaleScore=cmp_FL_RiskMatrixPro.OccurrenceValue),
                score:cmp_FL_RiskMatrixPro.MatrixScoreOut
            },
            With(
                {
                    configuredBand:LookUp(
                        cmp_FL_RiskMatrixPro.MatrixCells,
                        RowIndex=rowRec.ScaleIndex && ColumnIndex=colRec.ScaleIndex,
                        BandKey
                    )
                },
                With(
                    {
                        bandKey:If(
                            Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" && !IsBlank(configuredBand),
                            Upper(configuredBand),
                            If(
                                score<=cmp_FL_RiskMatrixPro.LowMax,
                                "LOW",
                                If(
                                    score<=cmp_FL_RiskMatrixPro.ModerateMax,
                                    "MODERATE",
                                    If(score<=cmp_FL_RiskMatrixPro.HighMax,"HIGH","CRITICAL")
                                )
                            )
                        )
                    },
                    Switch(
                        bandKey,
                        "LOW",cmp_FL_RiskMatrixPro.LowLabel,
                        "MODERATE",cmp_FL_RiskMatrixPro.ModerateLabel,
                        "HIGH",cmp_FL_RiskMatrixPro.HighLabel,
                        "CRITICAL",cmp_FL_RiskMatrixPro.CriticalLabel,
                        bandKey
                    )
                )
            )
        )
      SelectedOccurrenceOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            cmp_FL_RiskMatrixPro.OccurrenceValue,
            With(
                {
                    cols:Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                    colPos:Mod(Value(galFLRiskMatrix.Selected.Value)-1,Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))+1
                },
                Last(
                    FirstN(
                        SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                        colPos
                    )
                ).ScaleScore
            )
        )
      SelectedSeverityOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            cmp_FL_RiskMatrixPro.SeverityValue,
            With(
                {
                    cols:Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                    rowPos:RoundDown(
                        (Value(galFLRiskMatrix.Selected.Value)-1)/
                        Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                        0
                    )+1
                },
                Last(
                    FirstN(
                        SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                        rowPos
                    )
                ).ScaleScore
            )
        )
      SelectedRowLabelOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            LookUp(cmp_FL_RiskMatrixPro.RowScale,ScaleScore=cmp_FL_RiskMatrixPro.SeverityValue,ScaleLabel),
            With(
                {
                    rowPos:RoundDown(
                        (Value(galFLRiskMatrix.Selected.Value)-1)/
                        Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                        0
                    )+1
                },
                Last(
                    FirstN(
                        SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                        rowPos
                    )
                ).ScaleLabel
            )
        )
      SelectedColumnLabelOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            LookUp(cmp_FL_RiskMatrixPro.ColumnScale,ScaleScore=cmp_FL_RiskMatrixPro.OccurrenceValue,ScaleLabel),
            With(
                {
                    colPos:Mod(
                        Value(galFLRiskMatrix.Selected.Value)-1,
                        Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                    )+1
                },
                Last(
                    FirstN(
                        SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                        colPos
                    )
                ).ScaleLabel
            )
        )
      Width: =520

    Children:
      - conFLRiskMatrixRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_FL_RiskMatrixPro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_FL_RiskMatrixPro.SurfaceColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width

          Children:
            - lblFLRiskMatrixTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_FL_RiskMatrixPro.TextColor
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: =cmp_FL_RiskMatrixPro.Title
                  Width: =Parent.Width-32
                  Wrap: =false
                  X: =16
                  Y: =14
            - lblFLRiskMatrixSubtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                  Size: =9
                  Text: =cmp_FL_RiskMatrixPro.Subtitle
                  Width: =Parent.Width-32
                  Wrap: =false
                  X: =16
                  Y: =39
            - lblFLRiskAxisColumn:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                  FontWeight: =FontWeight.Semibold
                  Size: =8
                  Text: =cmp_FL_RiskMatrixPro.ColumnAxisTitle & " →"
                  Width: =Parent.Width-92
                  Wrap: =false
                  X: =72
                  Y: =63
            - lblFLRiskAxisRow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                  FontWeight: =FontWeight.Semibold
                  Size: =8
                  Text: =cmp_FL_RiskMatrixPro.RowAxisTitle
                  Width: =62
                  Wrap: =false
                  X: =10
                  Y: =92

            - galFLRiskColumnLabels:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =20
                  Items: =SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending)
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =Self.Height
                  Width: =Parent.Width-100
                  WrapCount: =Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                  X: =72
                  Y: =81
                Children:
                  - lblFLRiskColumnScale:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight
                        Size: =8
                        Text: =ThisItem.ScaleLabel
                        Width: =Parent.TemplateWidth
                        Wrap: =false
                        X: =0
                        Y: =0

            - galFLRiskRowLabels:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =Parent.Height-142
                  Items: =SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending)
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =Self.Height/Max(1,CountRows(cmp_FL_RiskMatrixPro.RowScale))
                  Width: =28
                  X: =40
                  Y: =103
                Children:
                  - lblFLRiskRowScale:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight
                        Size: =8
                        Text: =ThisItem.ScaleLabel
                        Width: =Parent.TemplateWidth
                        Wrap: =false
                        X: =0
                        Y: =0

            - galFLRiskMatrix:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =Parent.Height-142
                  Items: |-
                    =
                    Sequence(
                        Max(1,CountRows(cmp_FL_RiskMatrixPro.RowScale))*
                        Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                    )
                  OnSelect: =cmp_FL_RiskMatrixPro.OnSelectCell()
                  ShowScrollbar: =false
                  TemplatePadding: =1
                  TemplateSize: =Self.Height/Max(1,CountRows(cmp_FL_RiskMatrixPro.RowScale))
                  Width: =Parent.Width-100
                  WrapCount: =Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                  X: =72
                  Y: =103
                Children:
                  - btnFLRiskCell:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: |-
                          =
                          With(
                              {
                                  cols:Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                                  rowPos:RoundDown(
                                      (Value(ThisItem.Value)-1)/
                                      Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                                      0
                                  )+1,
                                  colPos:Mod(
                                      Value(ThisItem.Value)-1,
                                      Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                                  )+1
                              },
                              With(
                                  {
                                      rowRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              rowPos
                                          )
                                      ),
                                      colRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              colPos
                                          )
                                      )
                                  },
                                  If(
                                      rowRec.ScaleScore=cmp_FL_RiskMatrixPro.SeverityValue &&
                                      colRec.ScaleScore=cmp_FL_RiskMatrixPro.OccurrenceValue,
                                      ColorValue("#0F172A"),
                                      ColorValue("#FFFFFF")
                                  )
                              )
                          )
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: |-
                          =
                          With(
                              {
                                  rowPos:RoundDown(
                                      (Value(ThisItem.Value)-1)/
                                      Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                                      0
                                  )+1,
                                  colPos:Mod(
                                      Value(ThisItem.Value)-1,
                                      Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                                  )+1
                              },
                              With(
                                  {
                                      rowRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              rowPos
                                          )
                                      ),
                                      colRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              colPos
                                          )
                                      )
                                  },
                                  If(
                                      rowRec.ScaleScore=cmp_FL_RiskMatrixPro.SeverityValue &&
                                      colRec.ScaleScore=cmp_FL_RiskMatrixPro.OccurrenceValue,
                                      3,
                                      1
                                  )
                              )
                          )
                        Color: =ColorValue("#0F172A")
                        Fill: |-
                          =
                          With(
                              {
                                  rowPos:RoundDown(
                                      (Value(ThisItem.Value)-1)/
                                      Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                                      0
                                  )+1,
                                  colPos:Mod(
                                      Value(ThisItem.Value)-1,
                                      Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                                  )+1
                              },
                              With(
                                  {
                                      rowRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              rowPos
                                          )
                                      ),
                                      colRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              colPos
                                          )
                                      )
                                  },
                                  With(
                                      {
                                          productScore:rowRec.ScaleScore*colRec.ScaleScore,
                                          configuredScore:LookUp(
                                              cmp_FL_RiskMatrixPro.MatrixCells,
                                              RowIndex=rowRec.ScaleIndex && ColumnIndex=colRec.ScaleIndex,
                                              CellScore
                                          ),
                                          configuredBand:LookUp(
                                              cmp_FL_RiskMatrixPro.MatrixCells,
                                              RowIndex=rowRec.ScaleIndex && ColumnIndex=colRec.ScaleIndex,
                                              BandKey
                                          )
                                      },
                                      With(
                                          {
                                              score:If(
                                                  Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" &&
                                                  !IsBlank(configuredScore) &&
                                                  configuredScore>=0,
                                                  configuredScore,
                                                  productScore
                                              )
                                          },
                                          With(
                                              {
                                                  bandKey:If(
                                                      Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" &&
                                                      !IsBlank(configuredBand),
                                                      Upper(configuredBand),
                                                      If(
                                                          score<=cmp_FL_RiskMatrixPro.LowMax,
                                                          "LOW",
                                                          If(
                                                              score<=cmp_FL_RiskMatrixPro.ModerateMax,
                                                              "MODERATE",
                                                              If(
                                                                  score<=cmp_FL_RiskMatrixPro.HighMax,
                                                                  "HIGH",
                                                                  "CRITICAL"
                                                              )
                                                          )
                                                      )
                                                  )
                                              },
                                              Switch(
                                                  bandKey,
                                                  "LOW",cmp_FL_RiskMatrixPro.LowColor,
                                                  "MODERATE",cmp_FL_RiskMatrixPro.ModerateColor,
                                                  "HIGH",cmp_FL_RiskMatrixPro.HighColor,
                                                  "CRITICAL",cmp_FL_RiskMatrixPro.CriticalColor,
                                                  cmp_FL_RiskMatrixPro.SurfaceColor
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.TemplateHeight
                        HoverFill: =Self.Fill
                        OnSelect: =Select(Parent)
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =8
                        Text: |-
                          =
                          With(
                              {
                                  rowPos:RoundDown(
                                      (Value(ThisItem.Value)-1)/
                                      Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),
                                      0
                                  )+1,
                                  colPos:Mod(
                                      Value(ThisItem.Value)-1,
                                      Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                                  )+1
                              },
                              With(
                                  {
                                      rowRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              rowPos
                                          )
                                      ),
                                      colRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              colPos
                                          )
                                      )
                                  },
                                  If(
                                      rowRec.ScaleScore=cmp_FL_RiskMatrixPro.SeverityValue &&
                                      colRec.ScaleScore=cmp_FL_RiskMatrixPro.OccurrenceValue,
                                      Text(cmp_FL_RiskMatrixPro.MatrixScoreOut),
                                      ""
                                  )
                              )
                          )
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0

            - conFLRiskMatrixSummary:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FL_RiskMatrixPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F8FAFC")
                  Height: =54
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Parent.Width-32
                  X: =16
                  Y: =Parent.Height-62
                Children:
                  - lblFLRiskMatrixCurrent:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_RiskMatrixPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =10
                        Text: |-
                          =
                          "Matriz " &
                          Text(cmp_FL_RiskMatrixPro.MatrixScoreOut) &
                          " · " &
                          cmp_FL_RiskMatrixPro.MatrixBandOut
                        Width: =145
                        X: =12
                        Y: =8
                  - lblFLRiskMatrixNPR:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_RiskMatrixPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =10
                        Text: =cmp_FL_RiskMatrixPro.RiskScoreLabel & " " & Text(cmp_FL_RiskMatrixPro.RiskScore)
                        Visible: =cmp_FL_RiskMatrixPro.ShowRiskScore
                        Width: =90
                        X: =160
                        Y: =8
                  - lblFLRiskMatrixDetection:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                        Size: =8
                        Text: =cmp_FL_RiskMatrixPro.DetectionLabel & " " & Text(cmp_FL_RiskMatrixPro.DetectionValue)
                        Visible: =cmp_FL_RiskMatrixPro.ShowDetection
                        Width: =100
                        X: =252
                        Y: =10
                  - lblFLRiskMatrixOverride:
