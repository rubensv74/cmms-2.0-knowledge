                        Y: =16
                  - lblFLRiskDetectionValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#1D4ED8")
                        FontWeight: =FontWeight.Bold
                        Size: =24
                        Text: =Text(cmp_FL_RiskMatrixPro.DetectionValue)
                        Width: =80
                        X: =70
                        Y: =39
            - conFLRiskSO:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
