# CMMS 2.0 FUNCTIONAL LAB — RISK MATRIX PRO — PREMIUM 5x5 REFERENCE RC
#
# Visual source of truth: AMEF premium reference approved 2026-08-11.
# Preserves the existing public contract and component identity.
# Adds optional ContextLabel / ShowContextBadge without removing existing properties.
# Default rendering is 5×5; RowScale/ColumnScale remain host-configurable.
# Safe palette is used unless UseHostTheme=true.

ComponentDefinitions:
  cmp_FL_RiskMatrixPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título visible del componente.
        DataType: Text
        Default: ="Matriz de riesgo AMEF"

      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Explicación breve de la matriz.
        DataType: Text
        Default: ="Valoración contextual del modo de fallo"

      ContextLabel:
        PropertyKind: Input
        DisplayName: ContextLabel
        Description: Código o etiqueta contextual mostrada en la cabecera.
        DataType: Text
        Default: ="P-101"

      ShowContextBadge:
        PropertyKind: Input
        DisplayName: ShowContextBadge
        Description: Muestra la etiqueta contextual en la cabecera.
        DataType: Boolean
        Default: =true

      RowAxisTitle:
        PropertyKind: Input
        DisplayName: RowAxisTitle
        Description: Título semántico del eje vertical.
        DataType: Text
        Default: ="SEVERIDAD"

      ColumnAxisTitle:
        PropertyKind: Input
        DisplayName: ColumnAxisTitle
        Description: Título semántico del eje horizontal.
        DataType: Text
        Default: ="OCURRENCIA"

      RowScale:
        PropertyKind: Input
        DisplayName: RowScale
        Description: Escala del eje vertical. Campos requeridos ScaleIndex, ScaleLabel y ScaleScore.
        DataType: Table
        Default: =ForAll(Sequence(5),{ScaleIndex:Value,ScaleLabel:Text(Value),ScaleScore:Value})

      ColumnScale:
        PropertyKind: Input
        DisplayName: ColumnScale
        Description: Escala del eje horizontal. Campos requeridos ScaleIndex, ScaleLabel y ScaleScore.
        DataType: Table
        Default: =ForAll(Sequence(5),{ScaleIndex:Value,ScaleLabel:Text(Value),ScaleScore:Value})

      MatrixMode:
        PropertyKind: Input
        DisplayName: MatrixMode
        Description: PRODUCT calcula RowScore×ColumnScore; CONFIGURED utiliza MatrixCells.
        DataType: Text
        Default: ="PRODUCT"

      MatrixCells:
        PropertyKind: Input
        DisplayName: MatrixCells
        Description: Tabla opcional para matrices configuradas. Campos RowIndex, ColumnIndex, CellScore y BandKey.
        DataType: Table
        Default: =Table({RowIndex:0,ColumnIndex:0,CellScore:-1,BandKey:""})

      SeverityValue:
        PropertyKind: Input
        DisplayName: SeverityValue
        Description: Score actual del eje vertical; en AMEF representa Severidad.
        DataType: Number
        Default: =4

      OccurrenceValue:
        PropertyKind: Input
        DisplayName: OccurrenceValue
        Description: Score actual del eje horizontal; en AMEF representa Ocurrencia.
        DataType: Number
        Default: =3

      DetectionValue:
        PropertyKind: Input
        DisplayName: DetectionValue
        Description: Métrica auxiliar de Detección para uso AMEF; no altera la posición de la matriz.
        DataType: Number
        Default: =3

      DetectionLabel:
        PropertyKind: Input
        DisplayName: DetectionLabel
        Description: Etiqueta visible para la métrica auxiliar de detección.
        DataType: Text
        Default: ="Detección"

      ShowDetection:
        PropertyKind: Input
        DisplayName: ShowDetection
        Description: Muestra u oculta la métrica auxiliar de Detección.
        DataType: Boolean
        Default: =true

      RiskScore:
        PropertyKind: Input
        DisplayName: RiskScore
        Description: Indicador global calculado por el host; en AMEF representa NPR.
        DataType: Number
        Default: =36

      RiskScoreLabel:
        PropertyKind: Input
        DisplayName: RiskScoreLabel
        Description: Etiqueta visible del indicador global.
        DataType: Text
        Default: ="NPR"

      ShowRiskScore:
        PropertyKind: Input
        DisplayName: ShowRiskScore
        Description: Muestra u oculta el indicador global del host.
        DataType: Boolean
        Default: =true

      CriticalOverride:
        PropertyKind: Input
        DisplayName: CriticalOverride
        Description: Texto de sobreclasificación o excepción crítica.
        DataType: Text
        Default: ="No"

      LowMax:
        PropertyKind: Input
        DisplayName: LowMax
        Description: Máximo del score de matriz para banda baja en modo PRODUCT.
        DataType: Number
        Default: =5

      ModerateMax:
        PropertyKind: Input
        DisplayName: ModerateMax
        Description: Máximo del score de matriz para banda moderada en modo PRODUCT.
        DataType: Number
        Default: =10

      HighMax:
        PropertyKind: Input
        DisplayName: HighMax
        Description: Máximo del score de matriz para banda alta en modo PRODUCT; superiores son críticos.
        DataType: Number
        Default: =20

      LowLabel:
        PropertyKind: Input
        DisplayName: LowLabel
        Description: Etiqueta de banda baja.
        DataType: Text
        Default: ="Bajo"

      ModerateLabel:
        PropertyKind: Input
        DisplayName: ModerateLabel
        Description: Etiqueta de banda moderada.
        DataType: Text
        Default: ="Moderado"

      HighLabel:
        PropertyKind: Input
        DisplayName: HighLabel
        Description: Etiqueta de banda alta.
        DataType: Text
        Default: ="Alto"

      CriticalLabel:
        PropertyKind: Input
        DisplayName: CriticalLabel
        Description: Etiqueta de banda crítica.
        DataType: Text
        Default: ="Crítico"

      LowColor:
        PropertyKind: Input
        DisplayName: LowColor
        Description: Color de banda baja.
        DataType: Color
        Default: =ColorValue("#D8F3D8")

      ModerateColor:
        PropertyKind: Input
        DisplayName: ModerateColor
        Description: Color de banda moderada.
        DataType: Color
        Default: =ColorValue("#F4F0BE")

      HighColor:
        PropertyKind: Input
        DisplayName: HighColor
        Description: Color de banda alta.
        DataType: Color
        Default: =ColorValue("#F8D6A0")

      CriticalColor:
        PropertyKind: Input
        DisplayName: CriticalColor
        Description: Color de banda crítica.
        DataType: Color
        Default: =ColorValue("#F6A6AC")

      UseHostTheme:
        PropertyKind: Input
        DisplayName: UseHostTheme
        Description: Usa colores del host. Desactivado por defecto por compatibilidad Studio.
        DataType: Boolean
        Default: =false

      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color principal de acento.
        DataType: Color
        Default: =ColorValue("#2563EB")

      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Color de superficie.
        DataType: Color
        Default: =ColorValue("#FFFFFF")

      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color de borde.
        DataType: Color
        Default: =ColorValue("#DCE4EE")

      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color de texto principal.
        DataType: Color
        Default: =ColorValue("#0F172A")

      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color de texto secundario.
        DataType: Color
        Default: =ColorValue("#5B6B86")

      ScaleNote:
        PropertyKind: Input
        DisplayName: ScaleNote
        Description: Nota sobre procedencia o validación de escalas y umbrales.
        DataType: Text
        Default: ="Matriz AMEF 5×5 · escalas y umbrales definidos por el host"

      OnSelectCell:
        PropertyKind: Event
        DisplayName: OnSelectCell
        Description: Se ejecuta al seleccionar una celda.
        ReturnType: None
        Default: =false

      SelectedSeverityOut:
        PropertyKind: Output
        DisplayName: SelectedSeverityOut
        Description: Score seleccionado del eje vertical. Alias compatible con AMEF.
        DataType: Number

      SelectedOccurrenceOut:
        PropertyKind: Output
        DisplayName: SelectedOccurrenceOut
        Description: Score seleccionado del eje horizontal. Alias compatible con AMEF.
        DataType: Number

      SelectedRowLabelOut:
        PropertyKind: Output
        DisplayName: SelectedRowLabelOut
        Description: Etiqueta seleccionada del eje vertical.
        DataType: Text

      SelectedColumnLabelOut:
        PropertyKind: Output
        DisplayName: SelectedColumnLabelOut
        Description: Etiqueta seleccionada del eje horizontal.
        DataType: Text

      MatrixScoreOut:
        PropertyKind: Output
        DisplayName: MatrixScoreOut
        Description: Score de la celda actual.
        DataType: Number

      MatrixBandOut:
        PropertyKind: Output
        DisplayName: MatrixBandOut
        Description: Banda cualitativa de la celda actual.
        DataType: Text

    Properties:
      Fill: =Color.Transparent
      Height: =620
      SelectedSeverityOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            cmp_FL_RiskMatrixPro.SeverityValue,
            With(
                {
                    _rowPos:RoundUp(Value(galFLRiskMatrix.Selected.Value)/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),0)
                },
                Last(
                    FirstN(
                        SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                        _rowPos
                    )
                ).ScaleScore
            )
        )
      SelectedOccurrenceOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            cmp_FL_RiskMatrixPro.OccurrenceValue,
            With(
                {
                    _colPos:Mod(Value(galFLRiskMatrix.Selected.Value)-1,Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))+1
                },
                Last(
                    FirstN(
                        SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                        _colPos
                    )
                ).ScaleScore
            )
        )
      SelectedRowLabelOut: |-
        =
        Coalesce(
            LookUp(
                cmp_FL_RiskMatrixPro.RowScale,
                ScaleScore=cmp_FL_RiskMatrixPro.SelectedSeverityOut,
                ScaleLabel
            ),
            Text(cmp_FL_RiskMatrixPro.SelectedSeverityOut)
        )
      SelectedColumnLabelOut: |-
        =
        Coalesce(
            LookUp(
                cmp_FL_RiskMatrixPro.ColumnScale,
                ScaleScore=cmp_FL_RiskMatrixPro.SelectedOccurrenceOut,
                ScaleLabel
            ),
            Text(cmp_FL_RiskMatrixPro.SelectedOccurrenceOut)
        )
      MatrixScoreOut: |-
        =
        With(
            {
                _rowRec:LookUp(
                    cmp_FL_RiskMatrixPro.RowScale,
                    ScaleScore=cmp_FL_RiskMatrixPro.SeverityValue
                ),
                _colRec:LookUp(
                    cmp_FL_RiskMatrixPro.ColumnScale,
                    ScaleScore=cmp_FL_RiskMatrixPro.OccurrenceValue
                )
            },
            With(
                {
                    _configuredScore:LookUp(
                        cmp_FL_RiskMatrixPro.MatrixCells,
                        RowIndex=_rowRec.ScaleIndex && ColumnIndex=_colRec.ScaleIndex,
                        CellScore
                    )
                },
                If(
                    Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" &&
                    !IsBlank(_configuredScore) &&
                    _configuredScore>=0,
                    _configuredScore,
                    cmp_FL_RiskMatrixPro.SeverityValue*cmp_FL_RiskMatrixPro.OccurrenceValue
                )
            )
        )
      MatrixBandOut: |-
        =
        With(
            {_score:cmp_FL_RiskMatrixPro.MatrixScoreOut},
            If(
                _score<=cmp_FL_RiskMatrixPro.LowMax,
                cmp_FL_RiskMatrixPro.LowLabel,
                If(
                    _score<=cmp_FL_RiskMatrixPro.ModerateMax,
                    cmp_FL_RiskMatrixPro.ModerateLabel,
                    If(
                        _score<=cmp_FL_RiskMatrixPro.HighMax,
                        cmp_FL_RiskMatrixPro.HighLabel,
                        cmp_FL_RiskMatrixPro.CriticalLabel
                    )
                )
            )
        )
      Width: =820

    Children:
      - conFLRiskRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.BorderColor,ColorValue("#DCE4EE"))
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.SurfaceColor,ColorValue("#FFFFFF"))
            Height: =Parent.Height
            RadiusBottomLeft: =22
            RadiusBottomRight: =22
            RadiusTopLeft: =22
            RadiusTopRight: =22
            Width: =Parent.Width

          Children:
            - conFLRiskTitleIcon:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#C7D2FE")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F5F3FF")
                  Height: =48
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =48
                  X: =26
                  Y: =22
                Children:
                  - lblFLRiskTitleGlyph:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#4F46E5")
                        FontWeight: =FontWeight.Bold
                        Size: =20
                        Text: ="▦"
                        Width: =Parent.Width
                        X: =0
                        Y: =12

            - lblFLRiskTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.TextColor,ColorValue("#0F172A"))
                  FontWeight: =FontWeight.Bold
                  Size: =22
                  Text: =cmp_FL_RiskMatrixPro.Title
                  Width: =Parent.Width-250
                  Wrap: =false
                  X: =92
                  Y: =22

            - lblFLRiskSubtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.MutedTextColor,ColorValue("#5B6B86"))
                  Size: =13
                  Text: =cmp_FL_RiskMatrixPro.Subtitle
                  Width: =Parent.Width-250
                  Wrap: =false
                  X: =92
                  Y: =54

            - conFLRiskContextBadge:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#DDD6FE")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F5F3FF")
                  Height: =42
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Visible: =cmp_FL_RiskMatrixPro.ShowContextBadge && !IsBlank(cmp_FL_RiskMatrixPro.ContextLabel)
                  Width: =116
                  X: =Parent.Width-142
                  Y: =24
                Children:
                  - lblFLRiskContextBadge:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =ColorValue("#4338CA")
                        FontWeight: =FontWeight.Semibold
                        Size: =13
                        Text: =cmp_FL_RiskMatrixPro.ContextLabel
                        Width: =Parent.Width
                        X: =0
                        Y: =11

            - lblFLRiskColAxis:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.MutedTextColor,ColorValue("#5B6B86"))
                  FontWeight: =FontWeight.Bold
                  Size: =14
                  Text: =Upper(cmp_FL_RiskMatrixPro.ColumnAxisTitle)
                  Width: =Parent.Width-250
                  X: =164
                  Y: =100

            - galFLRiskColumnHeaders:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =34
                  Items: =SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending)
                  ShowScrollbar: =false
                  TemplatePadding: =4
                  TemplateSize: =(Parent.Width-8)/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                  Width: =Parent.Width-250
                  X: =164
                  Y: =128
                Children:
                  - lblFLRiskColumn:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.TextColor,ColorValue("#0F172A"))
                        FontWeight: =FontWeight.Semibold
                        Size: =14
                        Text: =Text(ThisItem.ScaleLabel)
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =4

            - lblFLRiskRowAxis:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.MutedTextColor,ColorValue("#5B6B86"))
                  FontWeight: =FontWeight.Bold
                  Size: =14
                  Text: =Upper(cmp_FL_RiskMatrixPro.RowAxisTitle)
                  Width: =88
                  X: =28
                  Y: =176

            - galFLRiskRows:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =270
                  Items: =SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending)
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =270/Max(1,CountRows(cmp_FL_RiskMatrixPro.RowScale))
                  Width: =44
                  X: =112
                  Y: =166
                Children:
                  - lblFLRiskRow:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.TextColor,ColorValue("#0F172A"))
                        FontWeight: =FontWeight.Semibold
                        Size: =14
                        Text: =Text(ThisItem.ScaleLabel)
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =Max(0,(Parent.TemplateHeight-20)/2)

            - galFLRiskMatrix:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =Color.Transparent
                  Height: =270
                  Items: =Sequence(Max(1,CountRows(cmp_FL_RiskMatrixPro.RowScale))*Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))
                  OnSelect: =cmp_FL_RiskMatrixPro.OnSelectCell()
                  ShowScrollbar: =false
                  TemplateFill: =Color.Transparent
                  TemplatePadding: =4
                  TemplateSize: =270/Max(1,CountRows(cmp_FL_RiskMatrixPro.RowScale))
                  Width: =Parent.Width-250
                  WrapCount: =Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale))
                  X: =164
                  Y: =166
                Children:
                  - btnFLRiskCell:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: |-
                          =
                          With(
                              {
                                  _rowPos:RoundUp(Value(ThisItem.Value)/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),0),
                                  _colPos:Mod(Value(ThisItem.Value)-1,Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))+1
                              },
                              With(
                                  {
                                      _rowScore:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              _rowPos
                                          )
                                      ).ScaleScore,
                                      _colScore:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              _colPos
                                          )
                                      ).ScaleScore
                                  },
                                  If(
                                      _rowScore=cmp_FL_RiskMatrixPro.SeverityValue &&
                                      _colScore=cmp_FL_RiskMatrixPro.OccurrenceValue,
                                      If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.AccentColor,ColorValue("#2563EB")),
                                      RGBA(255,255,255,0.55)
                                  )
                              )
                          )
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: |-
                          =
                          With(
                              {
                                  _rowPos:RoundUp(Value(ThisItem.Value)/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),0),
                                  _colPos:Mod(Value(ThisItem.Value)-1,Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))+1
                              },
                              With(
                                  {
                                      _rowScore:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              _rowPos
                                          )
                                      ).ScaleScore,
                                      _colScore:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              _colPos
                                          )
                                      ).ScaleScore
                                  },
                                  If(
                                      _rowScore=cmp_FL_RiskMatrixPro.SeverityValue &&
                                      _colScore=cmp_FL_RiskMatrixPro.OccurrenceValue,
                                      3,
                                      1
                                  )
                              )
                          )
                        Color: =If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.TextColor,ColorValue("#0F172A"))
                        Fill: |-
                          =
                          With(
                              {
                                  _rowPos:RoundUp(Value(ThisItem.Value)/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),0),
                                  _colPos:Mod(Value(ThisItem.Value)-1,Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))+1
                              },
                              With(
                                  {
                                      _rowRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              _rowPos
                                          )
                                      ),
                                      _colRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              _colPos
                                          )
                                      )
                                  },
                                  With(
                                      {
                                          _configuredScore:LookUp(
                                              cmp_FL_RiskMatrixPro.MatrixCells,
                                              RowIndex=_rowRec.ScaleIndex && ColumnIndex=_colRec.ScaleIndex,
                                              CellScore
                                          ),
                                          _configuredBand:Upper(
                                              Coalesce(
                                                  LookUp(
                                                      cmp_FL_RiskMatrixPro.MatrixCells,
                                                      RowIndex=_rowRec.ScaleIndex && ColumnIndex=_colRec.ScaleIndex,
                                                      BandKey
                                                  ),
                                                  ""
                                              )
                                          )
                                      },
                                      With(
                                          {
                                              _score:If(
                                                  Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" &&
                                                  !IsBlank(_configuredScore) &&
                                                  _configuredScore>=0,
                                                  _configuredScore,
                                                  _rowRec.ScaleScore*_colRec.ScaleScore
                                              )
                                          },
                                          If(
                                              Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" &&
                                              !IsBlank(_configuredBand),
                                              Switch(
                                                  _configuredBand,
                                                  "LOW",If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.LowColor,ColorValue("#D8F3D8")),
                                                  "MODERATE",If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.ModerateColor,ColorValue("#F4F0BE")),
                                                  "HIGH",If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.HighColor,ColorValue("#F8D6A0")),
                                                  "CRITICAL",If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.CriticalColor,ColorValue("#F6A6AC")),
                                                  ColorValue("#F8FAFC")
                                              ),
                                              If(
                                                  _score<=cmp_FL_RiskMatrixPro.LowMax,
                                                  If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.LowColor,ColorValue("#D8F3D8")),
                                                  If(
                                                      _score<=cmp_FL_RiskMatrixPro.ModerateMax,
                                                      If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.ModerateColor,ColorValue("#F4F0BE")),
                                                      If(
                                                          _score<=cmp_FL_RiskMatrixPro.HighMax,
                                                          If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.HighColor,ColorValue("#F8D6A0")),
                                                          If(cmp_FL_RiskMatrixPro.UseHostTheme,cmp_FL_RiskMatrixPro.CriticalColor,ColorValue("#F6A6AC"))
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: |-
                          =
                          With(
                              {
                                  _rowPos:RoundUp(Value(ThisItem.Value)/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),0),
                                  _colPos:Mod(Value(ThisItem.Value)-1,Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))+1
                              },
                              With(
                                  {
                                      _rowScore:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              _rowPos
                                          )
                                      ).ScaleScore,
                                      _colScore:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              _colPos
                                          )
                                      ).ScaleScore
                                  },
                                  If(
                                      _rowScore=cmp_FL_RiskMatrixPro.SeverityValue &&
                                      _colScore=cmp_FL_RiskMatrixPro.OccurrenceValue,
                                      FontWeight.Bold,
                                      FontWeight.Semibold
                                  )
                              )
                          )
                        Height: =Parent.TemplateHeight-8
                        HoverFill: =Self.Fill
                        OnSelect: =Select(Parent)
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =16
                        Text: |-
                          =
                          With(
                              {
                                  _rowPos:RoundUp(Value(ThisItem.Value)/Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)),0),
                                  _colPos:Mod(Value(ThisItem.Value)-1,Max(1,CountRows(cmp_FL_RiskMatrixPro.ColumnScale)))+1
                              },
                              With(
                                  {
                                      _rowRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                              _rowPos
                                          )
                                      ),
                                      _colRec:Last(
                                          FirstN(
                                              SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                              _colPos
                                          )
                                      ),
                                      _configuredScore:LookUp(
                                          cmp_FL_RiskMatrixPro.MatrixCells,
                                          RowIndex=Last(
                                              FirstN(
                                                  SortByColumns(cmp_FL_RiskMatrixPro.RowScale,"ScaleIndex",SortOrder.Descending),
                                                  _rowPos
                                              )
                                          ).ScaleIndex &&
                                          ColumnIndex=Last(
                                              FirstN(
                                                  SortByColumns(cmp_FL_RiskMatrixPro.ColumnScale,"ScaleIndex",SortOrder.Ascending),
                                                  _colPos
                                              )
                                          ).ScaleIndex,
                                          CellScore
                                      )
                                  },
                                  Text(
                                      If(
                                          Upper(cmp_FL_RiskMatrixPro.MatrixMode)="CONFIGURED" &&
                                          !IsBlank(_configuredScore) &&
                                          _configuredScore>=0,
                                          _configuredScore,
                                          _rowRec.ScaleScore*_colRec.ScaleScore
                                      )
                                  )
                              )
                          )
                        Width: =Parent.TemplateWidth-8
                        X: =4
                        Y: =4

