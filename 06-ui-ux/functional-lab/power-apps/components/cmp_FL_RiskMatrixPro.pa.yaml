ComponentDefinitions:
  cmp_FL_RiskMatrixPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título visible del componente.
        DataType: Text
        Default: ="Matriz de riesgo"
      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Explicación breve de la matriz.
        DataType: Text
        Default: ="Severidad × Ocurrencia · escala 1–10"
      SeverityValue:
        PropertyKind: Input
        DisplayName: SeverityValue
        Description: Severidad actual entre 1 y 10.
        DataType: Number
        Default: =8
      OccurrenceValue:
        PropertyKind: Input
        DisplayName: OccurrenceValue
        Description: Ocurrencia actual entre 1 y 10.
        DataType: Number
        Default: =4
      DetectionValue:
        PropertyKind: Input
        DisplayName: DetectionValue
        Description: Detección actual entre 1 y 10; se muestra separada de la matriz S×O.
        DataType: Number
        Default: =3
      RiskScore:
        PropertyKind: Input
        DisplayName: RiskScore
        Description: NPR o indicador global calculado por el host.
        DataType: Number
        Default: =96
      CriticalOverride:
        PropertyKind: Input
        DisplayName: CriticalOverride
        Description: Texto de sobreclasificación o excepción crítica.
        DataType: Text
        Default: ="No"
      LowMax:
        PropertyKind: Input
        DisplayName: LowMax
        Description: Máximo de S×O para banda baja.
        DataType: Number
        Default: =20
      ModerateMax:
        PropertyKind: Input
        DisplayName: ModerateMax
        Description: Máximo de S×O para banda moderada.
        DataType: Number
        Default: =40
      HighMax:
        PropertyKind: Input
        DisplayName: HighMax
        Description: Máximo de S×O para banda alta; valores superiores son críticos.
        DataType: Number
        Default: =70
      LowColor:
        PropertyKind: Input
        DisplayName: LowColor
        Description: Color de banda baja.
        DataType: Color
        Default: =ColorValue("#DCFCE7")
      ModerateColor:
        PropertyKind: Input
        DisplayName: ModerateColor
        Description: Color de banda moderada.
        DataType: Color
        Default: =ColorValue("#FEF3C7")
      HighColor:
        PropertyKind: Input
        DisplayName: HighColor
        Description: Color de banda alta.
        DataType: Color
        Default: =ColorValue("#FFEDD5")
      CriticalColor:
        PropertyKind: Input
        DisplayName: CriticalColor
        Description: Color de banda crítica.
        DataType: Color
        Default: =ColorValue("#FEE2E2")
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color principal de acento.
        DataType: Color
        Default: =ColorValue("#0284C7")
      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Color de superficie.
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color de borde.
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color de texto principal.
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color de texto secundario.
        DataType: Color
        Default: =ColorValue("#64748B")
      ScaleNote:
        PropertyKind: Input
        DisplayName: ScaleNote
        Description: Nota sobre procedencia o validación de umbrales.
        DataType: Text
        Default: ="Umbrales de laboratorio · configurables por el host"
      OnSelectCell:
        PropertyKind: Event
        DisplayName: OnSelectCell
        Description: Se ejecuta al seleccionar una celda S×O.
        ReturnType: None
        Default: =false
      SelectedSeverityOut:
        PropertyKind: Output
        DisplayName: SelectedSeverityOut
        Description: Severidad seleccionada.
        DataType: Number
      SelectedOccurrenceOut:
        PropertyKind: Output
        DisplayName: SelectedOccurrenceOut
        Description: Ocurrencia seleccionada.
        DataType: Number
      MatrixScoreOut:
        PropertyKind: Output
        DisplayName: MatrixScoreOut
        Description: Resultado S×O actual.
        DataType: Number
      MatrixBandOut:
        PropertyKind: Output
        DisplayName: MatrixBandOut
        Description: Banda cualitativa derivada de S×O.
        DataType: Text

    Properties:
      Fill: =Color.Transparent
      Height: =330
      MatrixBandOut: |-
        =
        With(
            {score:cmp_FL_RiskMatrixPro.SeverityValue*cmp_FL_RiskMatrixPro.OccurrenceValue},
            If(
                score<=cmp_FL_RiskMatrixPro.LowMax,
                "Bajo",
                If(
                    score<=cmp_FL_RiskMatrixPro.ModerateMax,
                    "Moderado",
                    If(score<=cmp_FL_RiskMatrixPro.HighMax,"Alto","Crítico")
                )
            )
        )
      MatrixScoreOut: =cmp_FL_RiskMatrixPro.SeverityValue*cmp_FL_RiskMatrixPro.OccurrenceValue
      SelectedOccurrenceOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            cmp_FL_RiskMatrixPro.OccurrenceValue,
            Mod(Value(galFLRiskMatrix.Selected.Value)-1,10)+1
        )
      SelectedSeverityOut: |-
        =
        If(
            IsBlank(galFLRiskMatrix.Selected.Value),
            cmp_FL_RiskMatrixPro.SeverityValue,
            10-RoundDown((Value(galFLRiskMatrix.Selected.Value)-1)/10,0)
        )
      Width: =520

    Children:
      - conFLRiskMatrixRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_FL_RiskMatrixPro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_FL_RiskMatrixPro.SurfaceColor
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width

          Children:
            - lblFLRiskMatrixTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_FL_RiskMatrixPro.TextColor
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: =cmp_FL_RiskMatrixPro.Title
                  Width: =Parent.Width-32
                  Wrap: =false
                  X: =16
                  Y: =14
            - lblFLRiskMatrixSubtitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =cmp_FL_RiskMatrixPro.MutedTextColor
                  Size: =9
                  Text: =cmp_FL_RiskMatrixPro.Subtitle
                  Width: =Parent.Width-32
                  Wrap: =false
                  X: =16
                  Y: =39
            - lblFLRiskAxisOccurrence:
