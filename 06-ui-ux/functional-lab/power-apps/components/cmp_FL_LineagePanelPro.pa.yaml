# CMMS 2.0 FUNCTIONAL LAB — LINEAGE PANEL PRO — COMFORTABLE READABILITY RC
#
# Preserves public contract and component identity.
# Horizontal lineage keeps context visible without stacking several small cards.

ComponentDefinitions:
  cmp_FL_LineagePanelPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      LibraryCode:
        PropertyKind: Input
        DisplayName: LibraryCode
        Description: Código de la definición AMEF de origen.
        DataType: Text
        Default: ="AMEF-BOMBA-CENTRIFUGA"

      RevisionCode:
        PropertyKind: Input
        DisplayName: RevisionCode
        Description: Revisión AMEF aplicada.
        DataType: Text
        Default: ="R01"

      AssetCode:
        PropertyKind: Input
        DisplayName: AssetCode
        Description: Código del activo contextual.
        DataType: Text
        Default: ="P-101"

      ApplicationCode:
        PropertyKind: Input
        DisplayName: ApplicationCode
        Description: Código de aplicación de la revisión al activo.
        DataType: Text
        Default: ="APP-P101-R01"

      CriticalityLabel:
        PropertyKind: Input
        DisplayName: CriticalityLabel
        Description: Criticidad contextual del activo.
        DataType: Text
        Default: ="Alta"

      ExecutionLabel:
        PropertyKind: Input
        DisplayName: ExecutionLabel
        Description: Estado resumido del handoff hacia ejecución.
        DataType: Text
        Default: ="Plan en preparación"

      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título del componente.
        DataType: Text
        Default: ="Origen y trazabilidad"

      UseHostTheme:
        PropertyKind: Input
        DisplayName: UseHostTheme
        Description: Usa colores del host. Desactivado por defecto por compatibilidad Studio.
        DataType: Boolean
        Default: =false

      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color de acento.
        DataType: Color
        Default: =ColorValue("#0284C7")

      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Fondo del componente.
        DataType: Color
        Default: =ColorValue("#FFFFFF")

      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color del borde.
        DataType: Color
        Default: =ColorValue("#E2E8F0")

      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color del texto principal.
        DataType: Color
        Default: =ColorValue("#0F172A")

      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color del texto secundario.
        DataType: Color
        Default: =ColorValue("#64748B")

    Properties:
      Fill: =Color.Transparent
      Height: =112
      Width: =900

    Children:
      - conFLLineageRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.BorderColor,ColorValue("#E2E8F0"))
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.SurfaceColor,ColorValue("#FFFFFF"))
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width

          Children:
            - lblFLLineageTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.TextColor,ColorValue("#0F172A"))
                  FontWeight: =FontWeight.Semibold
                  Size: =15
                  Text: =cmp_FL_LineagePanelPro.Title
                  Width: =Parent.Width-32
                  Wrap: =false
                  X: =16
                  Y: =8

            - lblFLLineageLibraryEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.MutedTextColor,ColorValue("#64748B"))
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="BIBLIOTECA / REVISIÓN"
                  Width: =(Parent.Width-96)*0.25
                  X: =16
                  Y: =34

            - lblFLLineageLibraryValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.TextColor,ColorValue("#0F172A"))
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.LibraryCode & " · " & cmp_FL_LineagePanelPro.RevisionCode
                  Width: =(Parent.Width-96)*0.25
                  Wrap: =false
                  X: =16
                  Y: =55

            - lblFLLineageArrow1:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.AccentColor,ColorValue("#0284C7"))
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: ="→"
                  Width: =24
                  X: =16+(Parent.Width-96)*0.25
                  Y: =53

            - lblFLLineageApplicationEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.MutedTextColor,ColorValue("#64748B"))
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="APLICACIÓN"
                  Width: =(Parent.Width-96)*0.22
                  X: =40+(Parent.Width-96)*0.25
                  Y: =34

            - lblFLLineageApplicationValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.TextColor,ColorValue("#0F172A"))
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.ApplicationCode
                  Width: =(Parent.Width-96)*0.22
                  Wrap: =false
                  X: =40+(Parent.Width-96)*0.25
                  Y: =55

            - lblFLLineageArrow2:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.AccentColor,ColorValue("#0284C7"))
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: ="→"
                  Width: =24
                  X: =40+(Parent.Width-96)*0.47
                  Y: =53

            - lblFLLineageAssetEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.MutedTextColor,ColorValue("#64748B"))
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="ACTIVO / CONTEXTO"
                  Width: =(Parent.Width-96)*0.25
                  X: =64+(Parent.Width-96)*0.47
                  Y: =34

            - lblFLLineageAssetValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.TextColor,ColorValue("#0F172A"))
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.AssetCode & " · Criticidad " & cmp_FL_LineagePanelPro.CriticalityLabel
                  Width: =(Parent.Width-96)*0.25
                  Wrap: =false
                  X: =64+(Parent.Width-96)*0.47
                  Y: =55

            - lblFLLineageArrow3:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.AccentColor,ColorValue("#0284C7"))
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: ="→"
                  Width: =24
                  X: =64+(Parent.Width-96)*0.72
                  Y: =53

            - lblFLLineageExecutionEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.MutedTextColor,ColorValue("#64748B"))
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="HANDOFF / ESTADO"
                  Width: =Parent.Width-(88+(Parent.Width-96)*0.72)-16
                  X: =88+(Parent.Width-96)*0.72
                  Y: =34

            - lblFLLineageExecutionValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.TextColor,ColorValue("#0F172A"))
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.ExecutionLabel
                  Width: =Parent.Width-(88+(Parent.Width-96)*0.72)-16
                  Wrap: =false
                  X: =88+(Parent.Width-96)*0.72
                  Y: =55

            - lblFLLineageHint:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =If(cmp_FL_LineagePanelPro.UseHostTheme,cmp_FL_LineagePanelPro.MutedTextColor,ColorValue("#64748B"))
                  Size: =12
                  Text: ="La ingeniería se hereda; el contexto del activo queda registrado en la aplicación sin modificar silenciosamente la biblioteca."
                  Width: =Parent.Width-32
                  Wrap: =false
                  X: =16
                  Y: =84
