# CMMS 2.0 FUNCTIONAL LAB — LINEAGE PANEL PRO — HARDENED SAFE PALETTE RC2
#
# Base: Studio-proven historical Lineage component.
# Scope: preserve public contract and identity while eliminating Color-input
# materialization risk from the internal visual path.
# Visible typography follows the Comfortable baseline (>=11).

ComponentDefinitions:
  cmp_FL_LineagePanelPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      LibraryCode:
        PropertyKind: Input
        DisplayName: LibraryCode
        Description: Código de la definición AMEF de origen.
        DataType: Text
        Default: ="AMEF-BOMBA-CENTRIFUGA"
      RevisionCode:
        PropertyKind: Input
        DisplayName: RevisionCode
        Description: Revisión AMEF aplicada.
        DataType: Text
        Default: ="R01"
      AssetCode:
        PropertyKind: Input
        DisplayName: AssetCode
        Description: Código del activo contextual.
        DataType: Text
        Default: ="P-101"
      ApplicationCode:
        PropertyKind: Input
        DisplayName: ApplicationCode
        Description: Código de aplicación de la revisión al activo.
        DataType: Text
        Default: ="APP-P101-R01"
      CriticalityLabel:
        PropertyKind: Input
        DisplayName: CriticalityLabel
        Description: Criticidad contextual del activo.
        DataType: Text
        Default: ="Alta"
      ExecutionLabel:
        PropertyKind: Input
        DisplayName: ExecutionLabel
        Description: Estado resumido del handoff hacia ejecución.
        DataType: Text
        Default: ="Plan en preparación"
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título del componente.
        DataType: Text
        Default: ="Origen y trazabilidad"
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color de acento. Se conserva por compatibilidad de contrato; la RC2 usa paleta interna segura.
        DataType: Color
        Default: =ColorValue("#0284C7")
      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Fondo del componente. Se conserva por compatibilidad de contrato; la RC2 usa paleta interna segura.
        DataType: Color
        Default: =ColorValue("#FFFFFF")
      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color del borde. Se conserva por compatibilidad de contrato; la RC2 usa paleta interna segura.
        DataType: Color
        Default: =ColorValue("#E2E8F0")
      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color del texto principal. Se conserva por compatibilidad de contrato; la RC2 usa paleta interna segura.
        DataType: Color
        Default: =ColorValue("#0F172A")
      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color del texto secundario. Se conserva por compatibilidad de contrato; la RC2 usa paleta interna segura.
        DataType: Color
        Default: =ColorValue("#64748B")

    Properties:
      Fill: =Color.Transparent
      Height: =154
      Width: =900

    Children:
      - conFLLineageRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =ColorValue("#E2E8F0")
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#FFFFFF")
            Height: =Parent.Height
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            RadiusTopLeft: =14
            RadiusTopRight: =14
            Width: =Parent.Width
          Children:
            - lblFLLineageTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =15
                  Text: =cmp_FL_LineagePanelPro.Title
                  Width: =Parent.Width-36
                  Wrap: =false
                  X: =18
                  Y: =14

            - lblFLLineageLibraryEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="BIBLIOTECA / REVISIÓN"
                  Width: =(Parent.Width-120)*0.26
                  Wrap: =false
                  X: =18
                  Y: =48

            - lblFLLineageLibraryValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.LibraryCode & " · " & cmp_FL_LineagePanelPro.RevisionCode
                  Width: =(Parent.Width-120)*0.26
                  Wrap: =false
                  X: =18
                  Y: =72

            - lblFLLineageArrow1:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#0284C7")
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="→"
                  Width: =28
                  X: =18+(Parent.Width-120)*0.26
                  Y: =70

            - lblFLLineageApplicationEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="APLICACIÓN"
                  Width: =(Parent.Width-120)*0.20
                  Wrap: =false
                  X: =46+(Parent.Width-120)*0.26
                  Y: =48

            - lblFLLineageApplicationValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.ApplicationCode
                  Width: =(Parent.Width-120)*0.20
                  Wrap: =false
                  X: =46+(Parent.Width-120)*0.26
                  Y: =72

            - lblFLLineageArrow2:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#0284C7")
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="→"
                  Width: =28
                  X: =46+(Parent.Width-120)*0.46
                  Y: =70

            - lblFLLineageAssetEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="ACTIVO / CONTEXTO"
                  Width: =(Parent.Width-120)*0.27
                  Wrap: =false
                  X: =74+(Parent.Width-120)*0.46
                  Y: =48

            - lblFLLineageAssetValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.AssetCode & " · Criticidad " & cmp_FL_LineagePanelPro.CriticalityLabel
                  Width: =(Parent.Width-120)*0.27
                  Wrap: =false
                  X: =74+(Parent.Width-120)*0.46
                  Y: =72

            - lblFLLineageArrow3:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =ColorValue("#0284C7")
                  FontWeight: =FontWeight.Semibold
                  Size: =14
                  Text: ="→"
                  Width: =28
                  X: =74+(Parent.Width-120)*0.73
                  Y: =70

            - lblFLLineageExecutionEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  FontWeight: =FontWeight.Semibold
                  Size: =11
                  Text: ="HANDOFF"
                  Width: =Parent.Width-(102+(Parent.Width-120)*0.73)-18
                  Wrap: =false
                  X: =102+(Parent.Width-120)*0.73
                  Y: =48

            - lblFLLineageExecutionValue:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =12
                  Text: =cmp_FL_LineagePanelPro.ExecutionLabel
                  Width: =Parent.Width-(102+(Parent.Width-120)*0.73)-18
                  Wrap: =false
                  X: =102+(Parent.Width-120)*0.73
                  Y: =72

            - lblFLLineageHint:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Size: =11
                  Text: ="La ingeniería se hereda; los ajustes del activo quedan registrados en la aplicación y no modifican silenciosamente la biblioteca."
                  Width: =Parent.Width-36
                  Wrap: =true
                  X: =18
                  Y: =112
