# CMMS 2.0 FUNCTIONAL LAB — F01-00B — PREMIUM PAGE HEADER
#
# Status: INSTANCE_SAFE PASS — VISUAL QA CORRECTION PENDING
# Target component: cmp_FL_PageHeaderPro
#
# REFERENCE STRATEGY
# - Visual/body reference: PULSE cmp_PageHeaderPro.
# - Public-contract reference: PULSE cmp_HeatMapPro + cmp_FL_SidebarPro RC2.
# - Inputs preserve the full proven metadata shape:
#   PropertyKind + DisplayName + Description + DataType + Default.
# - No globals, external assets or hidden business logic.
#
# VISUAL CORRECTION
# - Instance insertion is stable.
# - Compact context cards use two visual text levels only.
# - CaseType and JourneyHint are composed into the primary value line.
# - ReviewHint remains in the public contract for later host use but is not rendered in the compact card.
#
# SINGLE QA GATE
# 1. Replace complete component Source Code.
# 2. Save.
# 3. Confirm cards render without overlap/clipping.
# 4. Save/reopen.
# 5. If stable, continue directly to F01-01 Premium App Shell.

ComponentDefinitions:
  cmp_FL_PageHeaderPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      WorkspaceCode:
        PropertyKind: Input
        DisplayName: WorkspaceCode
        Description: Functional Lab workspace code shown in the header eyebrow
        DataType: Text
        Default: ="WS-01"

      Archetype:
        PropertyKind: Input
        DisplayName: Archetype
        Description: Primary SaaS interaction archetype for the current workspace
        DataType: Text
        Default: ="OBJECT 360"

      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Primary workspace title
        DataType: Text
        Default: ="Case & Context"

      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Short description of the current workspace purpose
        DataType: Text
        Default: ="Understand the asset, boundaries and operating context before defining functions"

      CaseCode:
        PropertyKind: Input
        DisplayName: CaseCode
        Description: Code of the current Functional Lab case
        DataType: Text
        Default: ="P-101"

      CaseType:
        PropertyKind: Input
        DisplayName: CaseType
        Description: Short asset or case type description
        DataType: Text
        Default: ="Centrifugal pump"

      JourneyPosition:
        PropertyKind: Input
        DisplayName: JourneyPosition
        Description: Human-readable current position in the Functional Journey
        DataType: Text
        Default: ="01 / 28"

      JourneyHint:
        PropertyKind: Input
        DisplayName: JourneyHint
        Description: Short label for the current journey stage
        DataType: Text
        Default: ="Context"

      ReviewState:
        PropertyKind: Input
        DisplayName: ReviewState
        Description: Current functional review state
        DataType: Text
        Default: ="Ready for review"

      ReviewHint:
        PropertyKind: Input
        DisplayName: ReviewHint
        Description: Secondary explanation of the current review state
        DataType: Text
        Default: ="Evidence available"

      ProgressCurrent:
        PropertyKind: Input
        DisplayName: ProgressCurrent
        Description: Current numeric stage used by the progress indicator
        DataType: Number
        Default: =1

      ProgressTotal:
        PropertyKind: Input
        DisplayName: ProgressTotal
        Description: Total number of stages used by the progress indicator
        DataType: Number
        Default: =28

      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Main page-header surface color
        DataType: Color
        Default: =ColorValue("#FFFFFF")

      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate surface used by context cards
        DataType: Color
        Default: =ColorValue("#F8FAFC")

      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Neutral border and progress-track color
        DataType: Color
        Default: =ColorValue("#E2E8F0")

      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Primary page-header text color
        DataType: Color
        Default: =ColorValue("#0F172A")

      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary page-header text color
        DataType: Color
        Default: =ColorValue("#64748B")

      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Functional Lab accent color for eyebrow and progress
        DataType: Color
        Default: =ColorValue("#0284C7")

      SuccessColor:
        PropertyKind: Input
        DisplayName: SuccessColor
        Description: Success-state accent color
        DataType: Color
        Default: =ColorValue("#22C55E")

      SuccessTextColor:
        PropertyKind: Input
        DisplayName: SuccessTextColor
        Description: Success-state primary text color
        DataType: Color
        Default: =ColorValue("#14532D")

      SuccessMutedTextColor:
        PropertyKind: Input
        DisplayName: SuccessMutedTextColor
        Description: Success-state secondary text color
        DataType: Color
        Default: =ColorValue("#166534")

      SuccessSoftColor:
        PropertyKind: Input
        DisplayName: SuccessSoftColor
        Description: Success-state soft background color
        DataType: Color
        Default: =ColorValue("#F0FDF4")

      SuccessBorderColor:
        PropertyKind: Input
        DisplayName: SuccessBorderColor
        Description: Success-state border color
        DataType: Color
        Default: =ColorValue("#BBF7D0")

    Properties:
      Fill: =cmp_FL_PageHeaderPro.SurfaceColor
      Height: =112
      Width: =1200

    Children:
      - conFLPH_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_FL_PageHeaderPro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_FL_PageHeaderPro.SurfaceColor
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width

          Children:
            - conFLPH_Identity:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =82
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Max(340,conFLPH_Case.X-48)
                  X: =24
                  Y: =12

                Children:
                  - lblFLPH_Eyebrow:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.AccentColor
                        FontWeight: =FontWeight.Semibold
                        Size: =8
                        Text: =Upper(cmp_FL_PageHeaderPro.WorkspaceCode) & "  ·  " & Upper(cmp_FL_PageHeaderPro.Archetype)
                        Width: =Parent.Width
                        Wrap: =false
                        X: =0
                        Y: =0

                  - lblFLPH_Title:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Text: =cmp_FL_PageHeaderPro.Title
                        Width: =Parent.Width
                        Wrap: =false
                        X: =0
                        Y: =21

                  - lblFLPH_Subtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.MutedTextColor
                        Size: =9
                        Text: =cmp_FL_PageHeaderPro.Subtitle
                        Width: =Parent.Width
                        Wrap: =false
                        X: =0
                        Y: =54

            - conFLPH_Case:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FL_PageHeaderPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FL_PageHeaderPro.SurfaceAltColor
                  Height: =62
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =184
                  X: =conFLPH_Journey.X-Self.Width-10
                  Y: =18

                Children:
                  - lblFLPH_CaseLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.MutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =7
                        Text: ="CURRENT CASE"
                        Width: =Parent.Width-24
                        Wrap: =false
                        X: =12
                        Y: =10

                  - lblFLPH_CaseValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: =cmp_FL_PageHeaderPro.CaseCode & "  ·  " & cmp_FL_PageHeaderPro.CaseType
                        Width: =Parent.Width-24
                        Wrap: =false
                        X: =12
                        Y: =32

            - conFLPH_Journey:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FL_PageHeaderPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FL_PageHeaderPro.SurfaceAltColor
                  Height: =62
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =140
                  X: =conFLPH_Status.X-Self.Width-10
                  Y: =18

                Children:
                  - lblFLPH_JourneyLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.MutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =7
                        Text: ="JOURNEY"
                        Width: =Parent.Width-24
                        Wrap: =false
                        X: =12
                        Y: =10

                  - lblFLPH_JourneyValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: =cmp_FL_PageHeaderPro.JourneyPosition & "  ·  " & cmp_FL_PageHeaderPro.JourneyHint
                        Width: =Parent.Width-24
                        Wrap: =false
                        X: =12
                        Y: =32

            - conFLPH_Status:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FL_PageHeaderPro.SuccessBorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FL_PageHeaderPro.SuccessSoftColor
                  Height: =62
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =176
                  X: =Parent.Width-Self.Width-24
                  Y: =18

                Children:
                  - conFLPH_StatusDot:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =cmp_FL_PageHeaderPro.SuccessColor
                        Height: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =8
                        X: =12
                        Y: =14

                  - lblFLPH_StatusLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.SuccessMutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =7
                        Text: ="REVIEW STATE"
                        Width: =Parent.Width-36
                        Wrap: =false
                        X: =28
                        Y: =10

                  - lblFLPH_StatusValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.SuccessTextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: =cmp_FL_PageHeaderPro.ReviewState
                        Width: =Parent.Width-24
                        Wrap: =false
                        X: =12
                        Y: =32

            - recFLPH_ProgressTrack:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Fill: =cmp_FL_PageHeaderPro.BorderColor
                  Height: =2
                  Width: =Parent.Width-48
                  X: =24
                  Y: =105

            - recFLPH_ProgressValue:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Fill: =cmp_FL_PageHeaderPro.AccentColor
                  Height: =2
                  Width: |-
                    =If(
                        cmp_FL_PageHeaderPro.ProgressCurrent <= 0,
                        0,
                        Max(
                            44,
                            Min(
                                Parent.Width-48,
                                (Parent.Width-48) * cmp_FL_PageHeaderPro.ProgressCurrent / Max(1,cmp_FL_PageHeaderPro.ProgressTotal)
                            )
                        )
                    )
                  X: =24
                  Y: =105
