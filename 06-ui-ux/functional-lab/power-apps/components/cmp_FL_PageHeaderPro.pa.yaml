# CMMS 2.0 FUNCTIONAL LAB — F01-00B — CABECERA PREMIUM
#
# Estado: INSTANCE_SAFE PASS — QA ESCALA COMFORTABLE PENDIENTE
# Componente: cmp_FL_PageHeaderPro
#
# ESTRATEGIA DE REFERENCIA
# - Referencia visual/cuerpo: PULSE cmp_PageHeaderPro.
# - Referencia de contrato público: PULSE cmp_HeatMapPro + cmp_FL_SidebarPro RC2.
# - Los Inputs conservan la forma contractual validada:
#   PropertyKind + DisplayName + Description + DataType + Default.
# - Sin variables globales, assets externos ni lógica de negocio oculta.
#
# IDIOMA
# - Toda la interfaz visible se presenta en español.
# - Los identificadores internos permanecen estables para evitar refactorizaciones sin valor funcional.
#
# ESCALA BASE COMFORTABLE
# - Tipografía aumentada para mejorar la legibilidad en escritorio.
# - Geometría aumentada proporcionalmente para evitar clipping y solapamientos.
# - Es la densidad visual por defecto del Functional Lab.
# - El futuro selector Normal / Cómodo / Grande pertenece al App Shell.

ComponentDefinitions:
  cmp_FL_PageHeaderPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      WorkspaceCode:
        PropertyKind: Input
        DisplayName: WorkspaceCode
        Description: Código del espacio de trabajo mostrado en la cabecera
        DataType: Text
        Default: ="WS-01"

      Archetype:
        PropertyKind: Input
        DisplayName: Archetype
        Description: Arquetipo principal de interacción del espacio de trabajo
        DataType: Text
        Default: ="OBJETO 360"

      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Título principal del espacio de trabajo
        DataType: Text
        Default: ="Caso y contexto"

      Subtitle:
        PropertyKind: Input
        DisplayName: Subtitle
        Description: Descripción breve del propósito del espacio de trabajo
        DataType: Text
        Default: ="Comprender el activo, sus límites y el contexto operativo antes de definir sus funciones"

      CaseCode:
        PropertyKind: Input
        DisplayName: CaseCode
        Description: Código del caso actual del Laboratorio Funcional
        DataType: Text
        Default: ="P-101"

      CaseType:
        PropertyKind: Input
        DisplayName: CaseType
        Description: Descripción breve del tipo de activo o caso
        DataType: Text
        Default: ="Bomba centrífuga"

      JourneyPosition:
        PropertyKind: Input
        DisplayName: JourneyPosition
        Description: Posición actual dentro del recorrido funcional
        DataType: Text
        Default: ="01 / 28"

      JourneyHint:
        PropertyKind: Input
        DisplayName: JourneyHint
        Description: Nombre breve de la etapa actual del recorrido
        DataType: Text
        Default: ="Contexto"

      ReviewState:
        PropertyKind: Input
        DisplayName: ReviewState
        Description: Estado actual de revisión funcional
        DataType: Text
        Default: ="Listo para revisión"

      ReviewHint:
        PropertyKind: Input
        DisplayName: ReviewHint
        Description: Explicación secundaria del estado de revisión
        DataType: Text
        Default: ="Evidencia disponible"

      ProgressCurrent:
        PropertyKind: Input
        DisplayName: ProgressCurrent
        Description: Etapa numérica actual utilizada por el indicador de progreso
        DataType: Number
        Default: =1

      ProgressTotal:
        PropertyKind: Input
        DisplayName: ProgressTotal
        Description: Número total de etapas utilizado por el indicador de progreso
        DataType: Number
        Default: =28

      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Color de la superficie principal de la cabecera
        DataType: Color
        Default: =ColorValue("#FFFFFF")

      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Superficie alternativa utilizada por las tarjetas de contexto
        DataType: Color
        Default: =ColorValue("#F8FAFC")

      BorderColor:
        PropertyKind: Input
        DisplayName: BorderColor
        Description: Color neutro de bordes y pista de progreso
        DataType: Color
        Default: =ColorValue("#E2E8F0")

      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Color del texto principal de la cabecera
        DataType: Color
        Default: =ColorValue("#0F172A")

      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Color del texto secundario de la cabecera
        DataType: Color
        Default: =ColorValue("#64748B")

      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color de acento del Laboratorio Funcional
        DataType: Color
        Default: =ColorValue("#0284C7")

      SuccessColor:
        PropertyKind: Input
        DisplayName: SuccessColor
        Description: Color de acento para estados satisfactorios
        DataType: Color
        Default: =ColorValue("#22C55E")

      SuccessTextColor:
        PropertyKind: Input
        DisplayName: SuccessTextColor
        Description: Color principal del texto de estado satisfactorio
        DataType: Color
        Default: =ColorValue("#14532D")

      SuccessMutedTextColor:
        PropertyKind: Input
        DisplayName: SuccessMutedTextColor
        Description: Color secundario del texto de estado satisfactorio
        DataType: Color
        Default: =ColorValue("#166534")

      SuccessSoftColor:
        PropertyKind: Input
        DisplayName: SuccessSoftColor
        Description: Fondo suave para estados satisfactorios
        DataType: Color
        Default: =ColorValue("#F0FDF4")

      SuccessBorderColor:
        PropertyKind: Input
        DisplayName: SuccessBorderColor
        Description: Color de borde para estados satisfactorios
        DataType: Color
        Default: =ColorValue("#BBF7D0")

    Properties:
      Fill: =cmp_FL_PageHeaderPro.SurfaceColor
      Height: =132
      Width: =1200

    Children:
      - conFLPH_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =cmp_FL_PageHeaderPro.BorderColor
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmp_FL_PageHeaderPro.SurfaceColor
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width

          Children:
            - conFLPH_Identity:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =98
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Max(360,conFLPH_Case.X-48)
                  X: =24
                  Y: =14

                Children:
                  - lblFLPH_Eyebrow:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.AccentColor
                        FontWeight: =FontWeight.Semibold
                        Size: =10
                        Text: =Upper(cmp_FL_PageHeaderPro.WorkspaceCode) & "  ·  " & Upper(cmp_FL_PageHeaderPro.Archetype)
                        Width: =Parent.Width
                        Wrap: =false
                        X: =0
                        Y: =0

                  - lblFLPH_Title:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =22
                        Text: =cmp_FL_PageHeaderPro.Title
                        Width: =Parent.Width
                        Wrap: =false
                        X: =0
                        Y: =25

                  - lblFLPH_Subtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.MutedTextColor
                        Size: =11
                        Text: =cmp_FL_PageHeaderPro.Subtitle
                        Width: =Parent.Width
                        Wrap: =false
                        X: =0
                        Y: =63

            - conFLPH_Case:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FL_PageHeaderPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FL_PageHeaderPro.SurfaceAltColor
                  Height: =74
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =200
                  X: =conFLPH_Journey.X-Self.Width-10
                  Y: =20

                Children:
                  - lblFLPH_CaseLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.MutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: ="CASO ACTUAL"
                        Width: =Parent.Width-28
                        Wrap: =false
                        X: =14
                        Y: =12

                  - lblFLPH_CaseValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =11
                        Text: =cmp_FL_PageHeaderPro.CaseCode & "  ·  " & cmp_FL_PageHeaderPro.CaseType
                        Width: =Parent.Width-28
                        Wrap: =false
                        X: =14
                        Y: =40

            - conFLPH_Journey:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FL_PageHeaderPro.BorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FL_PageHeaderPro.SurfaceAltColor
                  Height: =74
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =156
                  X: =conFLPH_Status.X-Self.Width-10
                  Y: =20

                Children:
                  - lblFLPH_JourneyLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.MutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: ="RECORRIDO"
                        Width: =Parent.Width-28
                        Wrap: =false
                        X: =14
                        Y: =12

                  - lblFLPH_JourneyValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =11
                        Text: =cmp_FL_PageHeaderPro.JourneyPosition & "  ·  " & cmp_FL_PageHeaderPro.JourneyHint
                        Width: =Parent.Width-28
                        Wrap: =false
                        X: =14
                        Y: =40

            - conFLPH_Status:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =cmp_FL_PageHeaderPro.SuccessBorderColor
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FL_PageHeaderPro.SuccessSoftColor
                  Height: =74
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =194
                  X: =Parent.Width-Self.Width-24
                  Y: =20

                Children:
                  - conFLPH_StatusDot:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =cmp_FL_PageHeaderPro.SuccessColor
                        Height: =9
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Width: =9
                        X: =14
                        Y: =16

                  - lblFLPH_StatusLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.SuccessMutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: ="ESTADO DE REVISIÓN"
                        Width: =Parent.Width-42
                        Wrap: =false
                        X: =32
                        Y: =12

                  - lblFLPH_StatusValue:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_PageHeaderPro.SuccessTextColor
                        FontWeight: =FontWeight.Semibold
                        Size: =11
                        Text: =cmp_FL_PageHeaderPro.ReviewState
                        Width: =Parent.Width-28
                        Wrap: =false
                        X: =14
                        Y: =40

            - recFLPH_ProgressTrack:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Fill: =cmp_FL_PageHeaderPro.BorderColor
                  Height: =3
                  Width: =Parent.Width-48
                  X: =24
                  Y: =123

            - recFLPH_ProgressValue:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Fill: =cmp_FL_PageHeaderPro.AccentColor
                  Height: =3
                  Width: |-
                    =If(
                        cmp_FL_PageHeaderPro.ProgressCurrent <= 0,
                        0,
                        Max(
                            48,
                            Min(
                                Parent.Width-48,
                                (Parent.Width-48) * cmp_FL_PageHeaderPro.ProgressCurrent / Max(1,cmp_FL_PageHeaderPro.ProgressTotal)
                            )
                        )
                    )
                  X: =24
                  Y: =123
