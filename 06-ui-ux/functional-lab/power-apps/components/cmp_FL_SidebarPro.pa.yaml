# CMMS 2.0 FUNCTIONAL LAB — F01-00A-R5-TB — BIND TO STUDIO-CREATED INPUT
#
# Status: CORRECTIVE DIAGNOSTIC — PENDING POWER APPS STUDIO VALIDATION
# Incident: FL-SC-001
# Target component: cmp_FL_SidebarPro
#
# PREREQUISITE
# AppTitle already exists as a Data / Input / Text custom property created
# manually in Power Apps Studio and has passed R5-TM INSTANCE_SAFE.
#
# IMPORTANT
# This YAML intentionally contains NO CustomProperties block.
# It tests only whether Source Code controls can consume a public property
# whose metadata was created by Studio.
#
# PASS -> viable hybrid authoring strategy:
#         public contract in Studio + visual/body Source Code.
# FAIL -> reduce the binding/reference path further.

ComponentDefinitions:
  cmp_FL_SidebarPro:
    DefinitionType: CanvasComponent

    Properties:
      Fill: =ColorValue("#07111F")
      Height: =700
      Width: =220

    Children:
      - conFLSB_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#07111F")
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - lblFLSB_R5TB_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#F8FAFC")
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: =cmp_FL_SidebarPro.AppTitle
                  Width: =180
                  Wrap: =false
                  X: =17
                  Y: =20
