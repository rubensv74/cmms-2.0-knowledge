# CMMS 2.0 FUNCTIONAL LAB — F01-00A-R5-BM — STUDIO BOOLEAN INPUT BINDING
#
# Status: CORRECTIVE DIAGNOSTIC — PENDING POWER APPS STUDIO VALIDATION
# Incident: FL-SC-001
# Target component: cmp_FL_SidebarPro
#
# PREREQUISITES
# - AppTitle exists as Data / Input / Text, created manually in Studio.
# - ShowEnvironment exists as Data / Input / Boolean, created manually in Studio.
# - ShowEnvironment default value = true.
#
# IMPORTANT
# This YAML intentionally contains NO CustomProperties block.
# It tests only whether Source Code can consume a Studio-created Boolean input
# through a simple Visible binding.
#
# PASS -> Text and Boolean public inputs support the hybrid authoring strategy.
# FAIL -> reduce Boolean declaration vs binding behavior before adding Color.

ComponentDefinitions:
  cmp_FL_SidebarPro:
    DefinitionType: CanvasComponent

    Properties:
      Fill: =ColorValue("#07111F")
      Height: =700
      Width: =220

    Children:
      - conFLSB_Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#07111F")
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - lblFLSB_R5BM_Title:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#F8FAFC")
                  FontWeight: =FontWeight.Semibold
                  Size: =13
                  Text: =cmp_FL_SidebarPro.AppTitle
                  Width: =180
                  Wrap: =false
                  X: =17
                  Y: =20

            - lblFLSB_R5BM_Environment:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#94A3B8")
                  FontWeight: =FontWeight.Semibold
                  Size: =9
                  Text: ="CONCEPT LAB"
                  Visible: =cmp_FL_SidebarPro.ShowEnvironment
                  Width: =180
                  Wrap: =false
                  X: =17
                  Y: =54
