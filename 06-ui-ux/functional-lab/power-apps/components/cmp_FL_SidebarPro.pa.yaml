                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        FontWeight: =FontWeight.Semibold
                        Size: =7
                        Text: ="FUNCTIONAL JOURNEY"
                        Width: =196
                        Wrap: =false
                        X: =18
                        Y: =12

                  - galFLNav:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        Height: =Parent.Height-38
                        Items: |-
                          =
                          Table(
                              {Order:0, Key:"Overview", Label:"Overview", IconKey:"Overview"},
                              {Order:10, Key:"Context", Label:"Case & Context", IconKey:"Context"},
                              {Order:20, Key:"Functions", Label:"Functions & Failures", IconKey:"Functions"},
                              {Order:30, Key:"Risk", Label:"AMEF & Risk", IconKey:"Risk"},
                              {Order:40, Key:"Decision", Label:"RCM Decision", IconKey:"Decision"},
                              {Order:50, Key:"Economics", Label:"Economics & Task", IconKey:"Plan"},
                              {Order:60, Key:"Execution", Label:"Interval & Execution", IconKey:"Plan"},
                              {Order:70, Key:"Traceability", Label:"Traceability & QA", IconKey:"Governance"},
                              {Order:80, Key:"Publication", Label:"Review & Publication", IconKey:"Governance"},
                              {Order:90, Key:"Improve", Label:"Effectiveness", IconKey:"Improve"}
                          )
                        ShowScrollbar: =false
                        TemplateFill: =Color.Transparent
                        TemplatePadding: =2
                        TemplateSize: =44
                        Width: =Parent.Width-12
                        X: =6
                        Y: =38

                      Children:
                        - conFLSB_RowSurface:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(ThisItem.Key=Coalesce(galFLNav.Selected.Key,"Overview"),RGBA(56,189,248,0.18),RGBA(0,0,0,0))
                              BorderThickness: =If(ThisItem.Key=Coalesce(galFLNav.Selected.Key,"Overview"),1,0)
                              DropShadow: =DropShadow.None
                              Fill: =If(ThisItem.Key=Coalesce(galFLNav.Selected.Key,"Overview"),ColorValue("#12395A"),Color.Transparent)
                              Height: =Parent.TemplateHeight-4
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth-4
                              X: =2
                              Y: =2

                        - recFLSB_ActiveBar:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderThickness: =0
                              Fill: =ColorValue("#38BDF8")
                              Height: =Parent.TemplateHeight-14
                              Visible: =ThisItem.Key=Coalesce(galFLNav.Selected.Key,"Overview")
                              Width: =3
                              X: =2
                              Y: =7

                        - icoFLSB_Item:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =If(ThisItem.Key=Coalesce(galFLNav.Selected.Key,"Overview"),Color.White,ColorValue("#C7D6E8"))
                              Height: =20
                              HoverColor: =Color.White
                              Icon: |-
                                =
                                Switch(
                                    ThisItem.IconKey,
                                    "Overview", Icon.Home,
                                    "Context", Icon.Document,
                                    "Functions", Icon.Document,
                                    "Risk", Icon.Flag,
                                    "Decision", Icon.Message,
                                    "Plan", Icon.Trending,
                                    "Governance", Icon.Lock,
                                    "Improve", Icon.TrendingUpwards,
                                    Icon.Home
                                )
                              Width: =20
                              X: =16
                              Y: =12

                        - lblFLSB_Item:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =If(ThisItem.Key=Coalesce(galFLNav.Selected.Key,"Overview"),Color.White,ColorValue("#C7D6E8"))
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.Key=Coalesce(galFLNav.Selected.Key,"Overview"),FontWeight.Semibold,FontWeight.Normal)
                              Height: =Parent.TemplateHeight
                              Size: =9
                              Text: =ThisItem.Label
                              Width: =Parent.TemplateWidth-58
                              Wrap: =false
                              X: =48
                              Y: =0

                        - btnFLSB_Hit:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =Color.Transparent
                              Fill: =Color.Transparent
                              Height: =Parent.TemplateHeight-4
                              HoverFill: =RGBA(255,255,255,0.05)
                              OnSelect: =Select(Parent)
                              PressedFill: =RGBA(56,189,248,0.10)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: =""
                              Width: =Parent.TemplateWidth-4
                              X: =2
                              Y: =2

