# CMMS 2.0 FUNCTIONAL LAB — F01-00A-R5 — SIMPLE CUSTOM INPUTS
#
# Status: CORRECTIVE DIAGNOSTIC — PENDING POWER APPS STUDIO VALIDATION
# Incident: FL-SC-001
# Operation: REPLACE COMPLETE COMPONENT SOURCE
# Target component: cmp_FL_SidebarPro
# Previous results:
# - R1 root-only = PASS / INSTANCE_SAFE
# - R2 identity/text = PASS / INSTANCE_SAFE
# - R3 static containers = PASS / INSTANCE_SAFE
# - R4 static navigation controls = PASS / INSTANCE_SAFE
#
# PURPOSE
# Introduce only primitive custom input properties on top of the R4-safe baseline.
# This stage tests CustomProperties without introducing Table, Gallery, Output,
# Event, OnSelect or dynamic collection logic.
#
# ADDED IN R5
# - AppTitle: Input / Text
# - ShowEnvironment: Input / Boolean
# - AccentColor: Input / Color
#
# CONSUMPTION
# - AppTitle drives the title ModernText.Text
# - ShowEnvironment drives environment ModernText.Visible
# - AccentColor drives the C2 mark and active navigation bar colors
#
# STILL EXCLUDED
# - Table inputs
# - Gallery
# - Output properties
# - Event properties
# - OnSelect
# - ThisItem / dynamic Items
# - navigation behavior
# - complex conditional geometry
#
# VALIDATION
# 1. Source definition is accepted.
# 2. Save succeeds.
# 3. Insert ONE NEW instance on an otherwise empty screen.
# 4. Studio remains open and responsive.
# 5. Title shows CMMS 2.0, environment is visible, accent is cyan.
# 6. Save again.
# 7. App Checker shows no new error attributable to the component.
#
# INTERPRETATION
# PASS -> primitive Text/Boolean/Color custom inputs are not sufficient to
#         reproduce FL-SC-001; continue with R6 Gallery + Table.
# FAIL -> stop and subdivide R5 by custom property type before adding anything else.

