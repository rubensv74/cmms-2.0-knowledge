# CMMS 2.0 FUNCTIONAL LAB — F01-00A-RC2 — PREMIUM SIDEBAR WITH VALIDATED CUSTOM PROPERTY CONTRACT
#
# Status: VALIDATED — INSTANCE_SAFE PASS
# Incident: FL-SC-001 RESOLVED — CORRECTIVE PATTERN VALIDATED
# Target component: cmp_FL_SidebarPro
#
# REFERENCE PATTERN
# CustomProperties are modeled after the instance-safe PULSE cmp_HeatMapPro.
# Inputs preserve PropertyKind + DisplayName + Description + DataType + Default.
# Outputs and Events preserve their own PropertyKind-specific patterns.
#
# IMPORTANT EVIDENCE
# - Original reduced custom-property contract: definition accepted, instance crash.
# - cmp_HeatMapPro with extensive CustomProperties: stable in PULSE.
# - RC2 full Sidebar with HeatMap-style input metadata: instance-safe in Studio.
#
# The exact platform-internal root cause is not narrowed to DisplayName or
# Description alone because RC2 was also created on a clean component.
# The validated engineering rule is to copy the complete public-contract shape
# from an equivalent INSTANCE_SAFE reference and retain the instance smoke test.

ComponentDefinitions:
  cmp_FL_SidebarPro:
    DefinitionType: CanvasComponent

    CustomProperties:
      AppTitle:
        PropertyKind: Input
        DisplayName: AppTitle
        Description: Product title shown in the sidebar header
        DataType: Text
        Default: ="CMMS 2.0"

      AppSubtitle:
        PropertyKind: Input
        DisplayName: AppSubtitle
        Description: Product subtitle shown below the main title
        DataType: Text
        Default: ="Functional Lab"

      EnvironmentLabel:
        PropertyKind: Input
        DisplayName: EnvironmentLabel
        Description: Environment or experience label shown in the sidebar
        DataType: Text
        Default: ="CONCEPT LAB"

      ActiveKey:
        PropertyKind: Input
        DisplayName: ActiveKey
        Description: Navigation key currently active in the host workspace
        DataType: Text
        Default: ="Overview"

      NavItems:
        PropertyKind: Input
        DisplayName: NavItems
        Description: Navigation table with Order, Key, Label and IconKey
        DataType: Table
        Default: |-
          =
          Table(
              {Order:10, Key:"Overview", Label:"Overview", IconKey:"Overview"},
              {Order:20, Key:"Context", Label:"Case & Context", IconKey:"Context"},
              {Order:30, Key:"Functions", Label:"Functions & Failures", IconKey:"Functions"},
              {Order:40, Key:"Risk", Label:"Effects & Risk", IconKey:"Risk"},
              {Order:50, Key:"Decision", Label:"RCM Decision", IconKey:"Decision"},
              {Order:60, Key:"Plan", Label:"Plan Design", IconKey:"Plan"},
              {Order:70, Key:"Governance", Label:"Governance", IconKey:"Governance"},
              {Order:80, Key:"Improve", Label:"Effectiveness", IconKey:"Improve"}
          )

      IsCollapsed:
        PropertyKind: Input
        DisplayName: IsCollapsed
        Description: Collapse the sidebar to its compact navigation state
        DataType: Boolean
        Default: =false

      CurrentCaseCode:
        PropertyKind: Input
        DisplayName: CurrentCaseCode
        Description: Code of the current Functional Lab case
        DataType: Text
        Default: ="P-101"

      CurrentCaseName:
        PropertyKind: Input
        DisplayName: CurrentCaseName
        Description: Name of the current Functional Lab case
        DataType: Text
        Default: ="Cooling water centrifugal pump"

      UserRole:
        PropertyKind: Input
        DisplayName: UserRole
        Description: Role label shown in the sidebar footer
        DataType: Text
        Default: ="Functional reviewer"

      SurfaceColor:
        PropertyKind: Input
        DisplayName: SurfaceColor
        Description: Main sidebar surface color
        DataType: Color
        Default: =ColorValue("#07111F")

      SurfaceAltColor:
        PropertyKind: Input
        DisplayName: SurfaceAltColor
        Description: Alternate sidebar surface color
        DataType: Color
        Default: =ColorValue("#0B1B2E")

      TextColor:
        PropertyKind: Input
        DisplayName: TextColor
        Description: Primary sidebar text color
        DataType: Color
        Default: =ColorValue("#F8FAFC")

      MutedTextColor:
        PropertyKind: Input
        DisplayName: MutedTextColor
        Description: Secondary sidebar text color
        DataType: Color
        Default: =ColorValue("#94A3B8")

      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Accent color used for selected and highlighted states
        DataType: Color
        Default: =ColorValue("#38BDF8")

      ActiveFillColor:
        PropertyKind: Input
        DisplayName: ActiveFillColor
        Description: Background fill used by the active navigation item
        DataType: Color
        Default: =ColorValue("#12395A")

      OnSelectItem:
        PropertyKind: Event
        ReturnType: None
        Default: =

      SelectedKey:
        PropertyKind: Output
        DataType: Text

    Properties:
      Fill: =cmp_FL_SidebarPro.SurfaceColor
      Height: =900
      SelectedKey: =Coalesce(galFLNav.Selected.Key, cmp_FL_SidebarPro.ActiveKey, "")
      Width: =If(cmp_FL_SidebarPro.IsCollapsed,76,220)

    Children:
      - conFLSB_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =cmp_FL_SidebarPro.SurfaceColor
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width

          Children:
            - conFLSB_Brand:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(255,255,255,0.06)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FL_SidebarPro.SurfaceColor
                  FillPortions: =0
                  Height: =96
                  LayoutMinHeight: =96
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width

                Children:
                  - conFLSB_Mark:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(255,255,255,0.10)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =cmp_FL_SidebarPro.SurfaceAltColor
                        Height: =42
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =42
                        X: =17
                        Y: =18
                      Children:
                        - lblFLSB_Mark:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =cmp_FL_SidebarPro.AccentColor
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              Size: =13
                              Text: ="C2"
                              Width: =Parent.Width
                              Wrap: =false
                              X: =0
                              Y: =8

                  - lblFLSB_AppTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_SidebarPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =13
                        Text: =cmp_FL_SidebarPro.AppTitle
                        Visible: =!cmp_FL_SidebarPro.IsCollapsed
                        Width: =Parent.Width-76
                        Wrap: =false
                        X: =70
                        Y: =19

                  - lblFLSB_AppSubtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_SidebarPro.MutedTextColor
                        Height: =18
                        Size: =9
                        Text: =cmp_FL_SidebarPro.AppSubtitle
                        Visible: =!cmp_FL_SidebarPro.IsCollapsed
                        Width: =Parent.Width-76
                        Wrap: =false
                        X: =70
                        Y: =45

                  - lblFLSB_Environment:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =If(cmp_FL_SidebarPro.IsCollapsed,Align.Center,Align.Left)
                        AutoHeight: =true
                        Color: =cmp_FL_SidebarPro.MutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        Size: =8
                        Text: =cmp_FL_SidebarPro.EnvironmentLabel
                        Width: =If(cmp_FL_SidebarPro.IsCollapsed,Parent.Width,Parent.Width-34)
                        Wrap: =false
                        X: =If(cmp_FL_SidebarPro.IsCollapsed,0,17)
                        Y: =70

            - recFLSB_DividerTop:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Fill: =RGBA(255,255,255,0.07)
                  FillPortions: =0
                  Height: =1
                  LayoutMinHeight: =1
                  Width: =Parent.Width

            - conFLSB_Menu:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =280
                  PaddingBottom: =10
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width

                Children:
                  - galFLNav:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        FillPortions: =1
                        Items: |-
                          =
                          SortByColumns(
                              cmp_FL_SidebarPro.NavItems,
                              "Order",
                              SortOrder.Ascending
                          )
                        LayoutMinHeight: =240
                        OnSelect: =cmp_FL_SidebarPro.OnSelectItem()
                        ShowScrollbar: =false
                        TemplateFill: =If(Lower(Text(ThisItem.Key))=Lower(Text(cmp_FL_SidebarPro.ActiveKey)),cmp_FL_SidebarPro.ActiveFillColor,Color.Transparent)
                        TemplatePadding: =3
                        TemplateSize: =50
                        Width: =Parent.Width

                      Children:
                        - recFLSB_ActiveBar:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderThickness: =0
                              Fill: =cmp_FL_SidebarPro.AccentColor
                              Height: =Parent.TemplateHeight-12
                              Visible: =Lower(Text(ThisItem.Key))=Lower(Text(cmp_FL_SidebarPro.ActiveKey))
                              Width: =3
                              X: =0
                              Y: =6

                        - icoFLSB_Item:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              Color: =If(Lower(Text(ThisItem.Key))=Lower(Text(cmp_FL_SidebarPro.ActiveKey)),Color.White,ColorValue("#C7D6E8"))
                              Height: =22
                              HoverColor: =Color.White
                              Icon: |-
                                =
                                Switch(
                                    ThisItem.IconKey,
                                    "Overview", Icon.Home,
                                    "Context", Icon.Document,
                                    "Functions", Icon.Document,
                                    "Risk", Icon.Flag,
                                    "Decision", Icon.Message,
                                    "Plan", Icon.Trending,
                                    "Governance", Icon.Lock,
                                    "Improve", Icon.TrendingUpwards,
                                    "Settings", Icon.Settings,
                                    Icon.Home
                                )
                              OnSelect: =Select(Parent)
                              Width: =22
                              X: =If(cmp_FL_SidebarPro.IsCollapsed,(Parent.TemplateWidth-Self.Width)/2,16)
                              Y: =14

                        - lblFLSB_Item:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =If(Lower(Text(ThisItem.Key))=Lower(Text(cmp_FL_SidebarPro.ActiveKey)),Color.White,ColorValue("#C7D6E8"))
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(Lower(Text(ThisItem.Key))=Lower(Text(cmp_FL_SidebarPro.ActiveKey)),FontWeight.Semibold,FontWeight.Normal)
                              Height: =Parent.TemplateHeight
                              OnSelect: =Select(Parent)
                              Size: =10
                              Text: =ThisItem.Label
                              Visible: =!cmp_FL_SidebarPro.IsCollapsed
                              Width: =Parent.TemplateWidth-54
                              Wrap: =false
                              X: =48
                              Y: =0

                        - btnFLSB_Hit:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =Color.Transparent
                              Fill: =Color.Transparent
                              Height: =Parent.TemplateHeight
                              HoverFill: =RGBA(255,255,255,0.05)
                              OnSelect: =Select(Parent)
                              PressedFill: =RGBA(56,189,248,0.10)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: =""
                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =0

            - recFLSB_DividerBottom:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  Fill: =RGBA(255,255,255,0.07)
                  FillPortions: =0
                  Height: =1
                  LayoutMinHeight: =1
                  Width: =Parent.Width

            - conFLSB_Footer:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =cmp_FL_SidebarPro.SurfaceAltColor
                  FillPortions: =0
                  Height: =132
                  LayoutMinHeight: =132
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width

                Children:
                  - lblFLSB_CaseLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =If(cmp_FL_SidebarPro.IsCollapsed,Align.Center,Align.Left)
                        AutoHeight: =true
                        Color: =cmp_FL_SidebarPro.MutedTextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        Size: =8
                        Text: =If(cmp_FL_SidebarPro.IsCollapsed,"CASE","CURRENT CASE")
                        Width: =If(cmp_FL_SidebarPro.IsCollapsed,Parent.Width,Parent.Width-28)
                        Wrap: =false
                        X: =If(cmp_FL_SidebarPro.IsCollapsed,0,14)
                        Y: =12

                  - lblFLSB_CaseCode:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =If(cmp_FL_SidebarPro.IsCollapsed,Align.Center,Align.Left)
                        AutoHeight: =true
                        Color: =cmp_FL_SidebarPro.TextColor
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Size: =10
                        Text: =Coalesce(cmp_FL_SidebarPro.CurrentCaseCode,"No case")
                        Width: =If(cmp_FL_SidebarPro.IsCollapsed,Parent.Width,Parent.Width-28)
                        Wrap: =false
                        X: =If(cmp_FL_SidebarPro.IsCollapsed,0,14)
                        Y: =34

                  - lblFLSB_CaseName:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =cmp_FL_SidebarPro.MutedTextColor
                        Height: =34
                        Size: =8
                        Text: =cmp_FL_SidebarPro.CurrentCaseName
                        Visible: =!cmp_FL_SidebarPro.IsCollapsed
                        Width: =Parent.Width-28
                        Wrap: =true
                        X: =14
                        Y: =58

                  - lblFLSB_Role:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =If(cmp_FL_SidebarPro.IsCollapsed,Align.Center,Align.Left)
                        AutoHeight: =true
                        Color: =cmp_FL_SidebarPro.AccentColor
                        Height: =18
                        Size: =8
                        Text: =If(cmp_FL_SidebarPro.IsCollapsed,"LAB",cmp_FL_SidebarPro.UserRole)
                        Width: =If(cmp_FL_SidebarPro.IsCollapsed,Parent.Width,Parent.Width-28)
                        Wrap: =false
                        X: =If(cmp_FL_SidebarPro.IsCollapsed,0,14)
                        Y: =104
