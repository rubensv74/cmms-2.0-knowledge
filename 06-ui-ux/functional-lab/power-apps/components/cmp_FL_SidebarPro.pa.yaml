                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#0B1B2E")
                        Height: =44
                        RadiusBottomLeft: =11
                        RadiusBottomRight: =11
                        RadiusTopLeft: =11
                        RadiusTopRight: =11
                        Width: =44
                        X: =16
                        Y: =20

                      Children:
                        - lblFLSB_Mark:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =ColorValue("#38BDF8")
                              FontWeight: =FontWeight.Bold
                              Size: =13
                              Text: ="C2"
                              Width: =Parent.Width
                              Wrap: =false
                              X: =0
                              Y: =10

                  - lblFLSB_AppTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#F8FAFC")
