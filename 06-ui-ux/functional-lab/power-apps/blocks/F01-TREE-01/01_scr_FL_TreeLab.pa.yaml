                RowParentNodeId:"N06",
                RowLevel:7,
                RowLabel:"Circuito de agua CW-01",
                RowDescription:"Nivel 7 de la prueba",
                RowSortPath:"001/001/001/001/001/001/001",
                RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración > Circuito de agua CW-01",
                RowNodeType:"subsystem",
                RowHasChildren:true,
                RowIsExpanded:true,
                RowIsVisible:true
            },
            {
