Screens:
  scr_FL_TreeLab:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#1677FF")
      OnVisible: |-
        =
        Set(varFLTreeSelected,"N11-P101");

        ClearCollect(
            colFLTreeLabNodes,
            {RowNodeId:"N01",RowParentNodeId:"",RowLevel:1,RowLabel:"Grupo industrial DEMO",RowDescription:"Raíz demostrativa",RowSortPath:"001",RowPath:"Grupo industrial DEMO",RowNodeType:"organization",RowIconKey:"home",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N02",RowParentNodeId:"N01",RowLevel:2,RowLabel:"Complejo Norte",RowDescription:"Emplazamiento industrial",RowSortPath:"001/001",RowPath:"Grupo industrial DEMO > Complejo Norte",RowNodeType:"site",RowIconKey:"home",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N03",RowParentNodeId:"N02",RowLevel:3,RowLabel:"Planta de proceso",RowDescription:"Planta del complejo",RowSortPath:"001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso",RowNodeType:"plant",RowIconKey:"home",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N04",RowParentNodeId:"N03",RowLevel:4,RowLabel:"Área de proceso",RowDescription:"Área operacional",RowSortPath:"001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso",RowNodeType:"area",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N05",RowParentNodeId:"N04",RowLevel:5,RowLabel:"Unidad de proceso A",RowDescription:"Contexto operativo del caso P-101",RowSortPath:"001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A",RowNodeType:"unit",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N06",RowParentNodeId:"N05",RowLevel:6,RowLabel:"Sistema de refrigeración",RowDescription:"Sistema funcional",RowSortPath:"001/001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración",RowNodeType:"system",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N07",RowParentNodeId:"N06",RowLevel:7,RowLabel:"Circuito de agua CW-01",RowDescription:"Circuito funcional",RowSortPath:"001/001/001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración > Circuito de agua CW-01",RowNodeType:"circuit",RowIconKey:"trend",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N08",RowParentNodeId:"N07",RowLevel:8,RowLabel:"Estación de bombeo",RowDescription:"Estación funcional",RowSortPath:"001/001/001/001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración > Circuito de agua CW-01 > Estación de bombeo",RowNodeType:"station",RowIconKey:"flag",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N09",RowParentNodeId:"N08",RowLevel:9,RowLabel:"Tren de bombeo P-100",RowDescription:"Conjunto funcional",RowSortPath:"001/001/001/001/001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración > Circuito de agua CW-01 > Estación de bombeo > Tren de bombeo P-100",RowNodeType:"train",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N10",RowParentNodeId:"N09",RowLevel:10,RowLabel:"Conjunto bomba-motor",RowDescription:"Ensamblaje mecánico",RowSortPath:"001/001/001/001/001/001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración > Circuito de agua CW-01 > Estación de bombeo > Tren de bombeo P-100 > Conjunto bomba-motor",RowNodeType:"assembly",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"N11-P101",RowParentNodeId:"N10",RowLevel:11,RowLabel:"P-101 · Bomba centrífuga",RowDescription:"Activo del caso AMEF/RCM del Functional Lab",RowSortPath:"001/001/001/001/001/001/001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración > Circuito de agua CW-01 > Estación de bombeo > Tren de bombeo P-100 > Conjunto bomba-motor > P-101",RowNodeType:"asset",RowIconKey:"document",RowHasChildren:false,RowIsExpanded:false,RowIsVisible:true},
            {RowNodeId:"N11-P102",RowParentNodeId:"N10",RowLevel:11,RowLabel:"P-102 · Bomba de reserva",RowDescription:"Equipo redundante del caso",RowSortPath:"001/001/001/001/001/001/001/001/001/001/002",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración > Circuito de agua CW-01 > Estación de bombeo > Tren de bombeo P-100 > Conjunto bomba-motor > P-102",RowNodeType:"asset",RowIconKey:"document",RowHasChildren:false,RowIsExpanded:false,RowIsVisible:true}
        )

    Children:
      - conFLTreeLabRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width

          Children:
            - lblFLTreeLabEyebrow:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#1677FF")
                  FontWeight: =FontWeight.Semibold
                  Size: =10
                  Text: ="DISCOVERY · TREEPRO PREMIUM"
                  Width: =Parent.Width-48
                  Wrap: =false
                  X: =24
                  Y: =20

            - lblFLTreeLabTitle:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#0F172A")
                  FontWeight: =FontWeight.Semibold
                  Size: =22
                  Text: ="Jerarquía profunda con contexto P-101"
                  Width: =Parent.Width-48
                  Wrap: =false
                  X: =24
                  Y: =47

            - lblFLTreeLabHint:
                Control: ModernText@1.0.0
                Properties:
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Size: =10
                  Text: ="Prueba visual de profundidad 11, iconografía semántica, compresión de sangría, selección y navegación padre-hijo."
                  Width: =Parent.Width-48
                  Wrap: =false
                  X: =24
                  Y: =84

            - cmpFL_Tree:
                Control: CanvasComponent
                ComponentName: cmp_FL_TreePro
                Properties:
                  AllowSearch: =true
                  CompactMode: =true
                  DeepIndentSize: =9
                  DepthCompressionStart: =6
                  Height: =Parent.Height-140
                  HighlightBadgeText: ="ACTIVO"
                  HighlightNodeId: ="N11-P101"
                  IndentSize: =16
                  Items: =colFLTreeLabNodes
                  MaxVisualDepth: =11
                  OnSelectNode: =Set(varFLTreeSelected,cmpFL_Tree.SelectedNodeIdOut)
                  OnToggleNode: |-
                    =
                    With(
                        {
                            _nodeId:cmpFL_Tree.ToggleNodeIdOut,
                            _target:cmpFL_Tree.ToggleTargetExpandedOut,
                            _sortPath:LookUp(colFLTreeLabNodes,RowNodeId=cmpFL_Tree.ToggleNodeIdOut,RowSortPath)
                        },
                        Patch(colFLTreeLabNodes,LookUp(colFLTreeLabNodes,RowNodeId=_nodeId),{RowIsExpanded:_target});
                        If(
                            _target,
                            UpdateIf(colFLTreeLabNodes,RowParentNodeId=_nodeId,{RowIsVisible:true}),
                            UpdateIf(colFLTreeLabNodes,StartsWith(RowSortPath,_sortPath & "/"),{RowIsVisible:false,RowIsExpanded:false})
                        )
                    )
                  SelectedNodeId: =varFLTreeSelected
                  ShowBreadcrumb: =true
                  ShowDescriptions: =false
                  ShowHighlightBadge: =true
                  ShowIcons: =true
                  ShowLines: =true
                  Width: =Min(650,Parent.Width*0.47)
                  X: =24
                  Y: =122

            - conFLTreeLabInfo:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#E2E8F0")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#FFFFFF")
                  Height: =306
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =Parent.Width-cmpFL_Tree.Width-72
                  X: =cmpFL_Tree.X+cmpFL_Tree.Width+24
                  Y: =122

                Children:
                  - lblFLTreeLabInfoEyebrow:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#1677FF")
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: ="NODO SELECCIONADO"
                        Width: =Parent.Width-36
                        Wrap: =false
                        X: =18
                        Y: =18

                  - lblFLTreeLabInfoTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0F172A")
                        FontWeight: =FontWeight.Semibold
                        Size: =18
                        Text: =cmpFL_Tree.SelectedLabelOut
                        Width: =Parent.Width-36
                        Wrap: =true
                        X: =18
                        Y: =46

                  - lblFLTreeLabInfoType:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#475569")
                        FontWeight: =FontWeight.Semibold
                        Size: =10
                        Text: =Upper(Text(Coalesce(cmpFL_Tree.SelectedRecordOut.RowNodeType,"Nodo"))) & "  ·  NIVEL " & Text(cmpFL_Tree.SelectedLevelOut) & " DE 11"
                        Width: =Parent.Width-36
                        Wrap: =false
                        X: =18
                        Y: =86

                  - lblFLTreeLabInfoDescription:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#334155")
                        Size: =10
                        Text: =Text(Coalesce(cmpFL_Tree.SelectedRecordOut.RowDescription,""))
                        Width: =Parent.Width-36
                        Wrap: =true
                        X: =18
                        Y: =116

                  - lblFLTreeLabInfoPathLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        FontWeight: =FontWeight.Semibold
                        Size: =8
                        Text: ="RUTA COMPLETA"
                        Width: =Parent.Width-36
                        Wrap: =false
                        X: =18
                        Y: =155

                  - lblFLTreeLabInfoPath:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        Size: =9
                        Text: =cmpFL_Tree.SelectedPathOut
                        Width: =Parent.Width-36
                        Wrap: =true
                        X: =18
                        Y: =177

                  - conFLTreeLabStatus:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#BBF7D0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#F0FDF4")
                        Height: =56
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.Width-36
                        X: =18
                        Y: =232

                        Children:
                          - lblFLTreeLabStatus:
                              Control: ModernText@1.0.0
                              Properties:
                                AutoHeight: =true
                                Color: =ColorValue("#166534")
                                FontWeight: =FontWeight.Semibold
                                Size: =9
                                Text: ="Motor único · profundidad variable · iconografía por significado · P-101 resaltado"
                                Width: =Parent.Width-24
                                Wrap: =true
                                X: =12
                                Y: =12

            - conFLTreeLabLegend:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue("#E2E8F0")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#FFFFFF")
                  Height: =176
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Width: =conFLTreeLabInfo.Width
                  X: =conFLTreeLabInfo.X
                  Y: =conFLTreeLabInfo.Y+conFLTreeLabInfo.Height+16

                Children:
                  - lblFLTreeLabLegendEyebrow:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#1677FF")
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: ="CATÁLOGO SEMÁNTICO"
                        Width: =Parent.Width-36
                        Wrap: =false
                        X: =18
                        Y: =16

                  - lblFLTreeLabLegendText:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#334155")
                        Size: =10
                        Text: ="El icono ya no depende del nivel. Cada nodo declara RowIconKey y el componente resuelve su apariencia."
                        Width: =Parent.Width-36
                        Wrap: =true
                        X: =18
                        Y: =43

                  - lblFLTreeLabLegendCatalog:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        Size: =9
                        Text: ="home · folder · settings · flag · lock · message · trend · document"
                        Width: =Parent.Width-36
                        Wrap: =true
                        X: =18
                        Y: =89

                  - lblFLTreeLabLegendFuture:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        Size: =9
                        Text: |-
                          ="Siguiente evolución opcional: Fluent Icon moderno e iconografía industrial específica para bombas, motores, válvulas e instrumentos."
                        Width: =Parent.Width-36
                        Wrap: =true
                        X: =18
                        Y: =122
