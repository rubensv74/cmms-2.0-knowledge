Screens:
  scr_FL_Economics:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: |-
        =
        Set(varFLNavKey,"Strategy");
        Set(varFLCurrentStageId,"FL-17");
        Set(varFLFailureAnnualCost,varFLFailRatePerYear*(varFLRepairCostPerFailureEur+(varFLDowntimeHoursPerFailure*varFLDowntimeRateEurPerHour)+varFLAdditionalImpactCostEur));
        Set(varFLTaskAnnualCost,varFLAnnualRuns*((varFLLaborHoursPerRun*varFLLaborRateEurPerHour)+varFLMaterialPerRunEur)+varFLFixedAnnualCostEur);
        Set(varFLResidualFailureCost,varFLFailureAnnualCost*(1-varFLProbabilityReductionPct/100)*(1-varFLConsequenceReductionPct/100));
        Set(varFLStrategyAnnualCost,varFLTaskAnnualCost+varFLResidualFailureCost);
        Set(varFLAnnualBenefit,varFLFailureAnnualCost-varFLStrategyAnnualCost)

    Children:
      - conFLEcoRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLEcoNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Strategy"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLEcoNav.SelectedKey);
                    Switch(cmpFLEcoNav.SelectedKey,"Home",Navigate(scr_FL_Home,ScreenTransition.None),"Assets",Navigate(scr_FL_FLH,ScreenTransition.None),"Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),"Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),"Governance",Navigate(scr_FL_Governance,ScreenTransition.None),"Settings",Navigate(scr_FL_Settings,ScreenTransition.None))
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLEcoMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLEcoNav.Width
                  X: =cmpFLEcoNav.Width
                  Y: =0
                Children:
                  - cmpFLEcoHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="COMPARACIÓN ECONÓMICA"
                        CaseCode: =varFLActiveCaseCode
                        CaseType: =varFLRecommendedStrategy
                        Height: =132
                        JourneyHint: ="Comparar el coste esperado"
                        JourneyPosition: ="17 / 28"
                        ProgressCurrent: =17
                        ProgressTotal: =28
                        ReviewHint: ="FL-17"
                        ReviewState: =If(varFLCaseDraft,"Borrador","En revisión")
                        Subtitle: ="Compara alternativas técnicamente válidas sin permitir que el criterio económico sustituya la decisión RCM."
                        Title: ="Evaluación económica"
                        Width: =Parent.Width
                        WorkspaceCode: ="ESTRATEGIA"
                        X: =0
                        Y: =0
                  - cmpFLEcoRail:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_ProcessRailPro
                      Properties:
                        ActiveStageId: ="FL-17"
                        CompactMode: =true
                        Height: =Parent.Height-cmpFLEcoHeader.Height-24
                        Items: =colFLStageExecutions
                        OnSelectStage: |-
                          =
                          Set(varFLCurrentStageId,cmpFLEcoRail.SelectedStageIdOut);
                          Switch(cmpFLEcoRail.SelectedScreenKeyOut,"Context",Navigate(scr_FL_Context,ScreenTransition.None),"Functions",Navigate(scr_FL_Functions,ScreenTransition.None),"FailureModes",Navigate(scr_FL_FailureModes,ScreenTransition.None),"AMEF",Navigate(scr_FL_AMEF,ScreenTransition.None),"RCM",Navigate(scr_FL_RCM,ScreenTransition.None),"Economics",Navigate(scr_FL_Economics,ScreenTransition.None),"Task",Navigate(scr_FL_Task,ScreenTransition.None),"PlanPackage",Navigate(scr_FL_PlanPackage,ScreenTransition.None),"Traceability",Navigate(scr_FL_Traceability,ScreenTransition.None),"ReviewApproval",Navigate(scr_FL_ReviewApproval,ScreenTransition.None),"Effectiveness",Navigate(scr_FL_Effectiveness,ScreenTransition.None))
                        ShowPhaseHeaders: =true
                        Width: =300
                        X: =24
                        Y: =cmpFLEcoHeader.Height+12
                  - conFLEcoWork:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height-cmpFLEcoHeader.Height-24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width-cmpFLEcoRail.Width-60
                        X: =cmpFLEcoRail.X+cmpFLEcoRail.Width+12
                        Y: =cmpFLEcoHeader.Height+12
                      Children:
                        - conFLEcoAssumptions:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#E2E8F0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =140
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - lblFLEcoAssumptionsLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="HIPÓTESIS ECONÓMICAS DEL CASO"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =14
                              - lblFLEcoFailRate:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#334155")
                                    Size: =10
                                    Text: =Text(varFLFailRatePerYear) & " fallos/año"
                                    Width: =130
                                    X: =18
                                    Y: =48
                              - lblFLEcoRepair:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#334155")
                                    Size: =10
                                    Text: =Text(varFLRepairCostPerFailureEur,"#,##0") & " € reparación"
                                    Width: =170
                                    X: =170
                                    Y: =48
                              - lblFLEcoDowntime:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#334155")
                                    Size: =10
                                    Text: =Text(varFLDowntimeHoursPerFailure) & " h parada · " & Text(varFLDowntimeRateEurPerHour,"#,##0") & " €/h"
                                    Width: =220
                                    X: =360
                                    Y: =48
                              - lblFLEcoReduction:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#166534")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="Reducción esperada de probabilidad " & Text(varFLProbabilityReductionPct) & "% · consecuencia " & Text(varFLConsequenceReductionPct) & "%"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =88
                              - lblFLEcoWarning:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#B45309")
                                    Size: =8
                                    Text: ="Los valores son hipótesis del laboratorio y deben poder sustituirse por datos reales de coste y fiabilidad."
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =114
                        - conFLEcoFailure:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#FECACA")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FEF2F2")
                              Height: =198
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =(Parent.Width-12)*0.5
                              X: =0
                              Y: =152
                            Children:
                              - lblFLEcoFailureLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#B91C1C")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="ALTERNATIVA A · FALLO / REPARACIÓN"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =16
                              - lblFLEcoFailureValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =24
                                    Text: =Text(varFLFailureAnnualCost,"€ #,##0")
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =48
                              - lblFLEcoFailureHint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =9
                                    Text: ="Coste esperado anual = tasa de fallo × (reparación + parada + impacto adicional)."
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =90
                              - lblFLEcoFailureInputs:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#991B1B")
                                    Size: =9
                                    Text: ="Impacto adicional por fallo " & Text(varFLAdditionalImpactCostEur,"€ #,##0")
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =144
                        - conFLEcoStrategy:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#BBF7D0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#F0FDF4")
                              Height: =198
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =Parent.Width-conFLEcoFailure.Width-12
                              X: =conFLEcoFailure.Width+12
                              Y: =152
                            Children:
                              - lblFLEcoStrategyLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#15803D")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="ALTERNATIVA B · BASADA EN CONDICIÓN"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =16
                              - lblFLEcoStrategyValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =24
                                    Text: =Text(varFLStrategyAnnualCost,"€ #,##0")
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =48
                              - lblFLEcoStrategyTask:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    Size: =9
                                    Text: ="Coste anual de tarea " & Text(varFLTaskAnnualCost,"€ #,##0") & " + riesgo residual " & Text(varFLResidualFailureCost,"€ #,##0")
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =92
                              - lblFLEcoBenefit:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#166534")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: ="Beneficio esperado: " & Text(varFLAnnualBenefit,"€ #,##0") & "/año"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =144
                        - cmpFLEcoDecision:
                            Control: CanvasComponent
                            ComponentName: cmp_FL_DecisionPanelPro
                            Properties:
                              CanConfirm: =varFLStrategyAnnualCost<varFLFailureAnnualCost
                              CanOverride: =true
                              ConfirmLabel: ="Confirmar alternativa"
                              ContextText: ="La comparación económica se aplica solo entre alternativas que ya han superado la validez técnica RCM."
                              DecisionReason: ="La estrategia basada en condición mantiene validez técnica y reduce el coste esperado anual en el caso ilustrativo."
                              Height: =254
                              HumanDecisionValue: =varFLRecommendedStrategy
                              IsOverride: =false
                              OnConfirmDecision: =UpdateIf(colFLStageExecutions,StageId="FL-17",{Status:"confirmed"});Set(varFLCaseDraft,false)
                              OnOverrideDecision: =Set(varFLCaseDraft,true)
                              RecommendationExplanation: ="El coste esperado total de la estrategia es inferior al escenario de fallo y reparación."
                              RecommendationLabel: ="Alternativa preferente"
                              RecommendationValue: =varFLRecommendedStrategy
                              RequiredRole: ="Ingeniería de Fiabilidad + Mantenimiento / Planificación"
                              ShowDecision: =true
                              ShowRecommendation: =true
                              ShowSystemResult: =true
                              SystemResultLabel: ="Beneficio esperado anual"
                              SystemResultValue: =Text(varFLAnnualBenefit,"€ #,##0")
                              Title: ="FL-17 · Comparar coste esperado"
                              Width: =Parent.Width*0.60
                              X: =0
                              Y: =362
                        - cmpFLEcoGate:
                            Control: CanvasComponent
                            ComponentName: cmp_FL_GatePanelPro
                            Properties:
                              CanContinue: =varFLStrategyAnnualCost<varFLFailureAnnualCost
                              ContinueLabel: ="Continuar a tarea"
                              GateStatus: =If(varFLStrategyAnnualCost<varFLFailureAnnualCost,"passed","warning")
                              GateTitle: ="Salida de evaluación económica"
                              Height: =254
                              OnContinue: |-
                                =
                                UpdateIf(colFLStageExecutions,StageId="FL-17",{Status:"confirmed"});
                                Set(varFLCaseDraft,false);
                                Set(varFLCurrentStageId,"FL-18");
                                Navigate(scr_FL_Task,ScreenTransition.None)
                              OutputLabel: ="Alternativa económica confirmada para diseño de tarea"
                              Reason: ="La economía respalda la política RCM; no sustituye su justificación técnica."
                              RequiredAction: ="Confirmar las hipótesis económicas utilizadas"
                              ResponsibleRole: ="Mantenimiento / Planificación"
                              Summary: ="Comparación económica favorable"
                              Width: =Parent.Width-cmpFLEcoDecision.Width-12
                              X: =cmpFLEcoDecision.Width+12
                              Y: =362
