Screens:
  scr_FL_Economics:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: |-
        =
        Set(varFLNavKey,"Strategy");
        Set(varFLCurrentStageId,"FL-17");
        ClearCollect(
            colFLEconomicAlternatives,
            {AlternativeCode:"ALT-CBM",AlternativeName:"Mantenimiento basado en condición",TechnicalStatus:"Válida",ExpectedAnnualCost:4050,InvestmentCost:2500,AvoidedRiskValue:14500,SystemRank:1,HumanSelected:varFLRCMHumanStrategy="Mantenimiento basado en condición"},
            {AlternativeCode:"ALT-TBM",AlternativeName:"Preventivo por tiempo",TechnicalStatus:"Válida con reservas",ExpectedAnnualCost:6200,InvestmentCost:900,AvoidedRiskValue:11800,SystemRank:2,HumanSelected:varFLRCMHumanStrategy="Preventivo por tiempo"},
            {AlternativeCode:"ALT-RTF",AlternativeName:"Operar hasta fallo",TechnicalStatus:"No válida para el caso ilustrativo",ExpectedAnnualCost:9300,InvestmentCost:0,AvoidedRiskValue:0,SystemRank:3,HumanSelected:false}
        )

    Children:
      - conFLEconomicsRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLEconomicsNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Strategy"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLEconomicsNav.SelectedKey);
                    Switch(
                        cmpFLEconomicsNav.SelectedKey,
                        "Home",Navigate(scr_FL_Home,ScreenTransition.None),
                        "Assets",Navigate(scr_FL_FLH,ScreenTransition.None),
                        "Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),
                        "Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),
                        "Governance",Navigate(scr_FL_Governance,ScreenTransition.None),
                        "Settings",Navigate(scr_FL_Settings,ScreenTransition.None)
                    )
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLEconomicsMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLEconomicsNav.Width
                  X: =cmpFLEconomicsNav.Width
                  Y: =0
                Children:
                  - cmpFLEconomicsHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="EVALUACIÓN ECONÓMICA"
                        CaseCode: =varFLActiveAssetCode
                        CaseType: =varFLRCMHumanStrategy
                        Height: =132
                        JourneyHint: ="FL-17 · comparar alternativas técnicamente válidas"
                        JourneyPosition: ="17 / 28"
                        ProgressCurrent: =17
                        ProgressTotal: =28
                        ReviewHint: ="Tres capas de coste"
                        ReviewState: ="Preliminar"
                        Subtitle: ="Aquí comparamos alternativas RCM. El coste detallado de mantenimiento se calcula después con tarea, frecuencia y recursos; el coste real llega desde ejecución."
                        Title: ="Evaluación económica"
                        Width: =Parent.Width
                        WorkspaceCode: ="ESTRATEGIA"
                        X: =0
                        Y: =0
                  - cmpFLEconomicsRail:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_ProcessRailPro
                      Properties:
                        ActiveStageId: ="FL-17"
                        CompactMode: =true
                        Height: =Parent.Height-cmpFLEconomicsHeader.Height-24
                        Items: =colFLStageExecutions
                        OnSelectStage: |-
                          =
                          Set(varFLCurrentStageId,cmpFLEconomicsRail.SelectedStageIdOut);
                          Switch(
                              cmpFLEconomicsRail.SelectedScreenKeyOut,
                              "Context",Navigate(scr_FL_Context,ScreenTransition.None),
                              "Functions",Navigate(scr_FL_Functions,ScreenTransition.None),
                              "FailureModes",Navigate(scr_FL_FailureModes,ScreenTransition.None),
                              "AMEF",Navigate(scr_FL_AMEF,ScreenTransition.None),
                              "RCM",Navigate(scr_FL_RCM,ScreenTransition.None),
                              "Economics",Navigate(scr_FL_Economics,ScreenTransition.None),
                              "Task",Navigate(scr_FL_Task,ScreenTransition.None),
                              "PlanPackage",Navigate(scr_FL_PlanPackage,ScreenTransition.None),
                              "Traceability",Navigate(scr_FL_Traceability,ScreenTransition.None),
                              "ReviewApproval",Navigate(scr_FL_ReviewApproval,ScreenTransition.None),
                              "Effectiveness",Navigate(scr_FL_Effectiveness,ScreenTransition.None)
                          )
                        ShowPhaseHeaders: =true
                        Width: =300
                        X: =24
                        Y: =cmpFLEconomicsHeader.Height+12
                  - conFLEconomicsWork:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height-cmpFLEconomicsHeader.Height-24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width-cmpFLEconomicsRail.Width-60
                        X: =cmpFLEconomicsRail.X+cmpFLEconomicsRail.Width+12
                        Y: =cmpFLEconomicsHeader.Height+12
                      Children:
                        - cmpFLEconomicsLineage:
                            Control: CanvasComponent
                            ComponentName: cmp_FL_LineagePanelPro
                            Properties:
                              ApplicationCode: =varFLActiveApplicationCode
                              AssetCode: =varFLActiveAssetCode
                              CriticalityLabel: =varFLActiveCriticality
                              ExecutionLabel: ="Coste real disponible como referencia"
                              Height: =112
                              LibraryCode: =varFLActiveFmeaCode
                              RevisionCode: =varFLActiveFmeaRevisionCode
                              Title: ="Qué coste estamos comparando"
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                        - conFLEconomicsAlternatives:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#BAE6FD")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =300
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =Parent.Width
                              X: =0
                              Y: =124
                            Children:
                              - lblFLEconomicsAlternativesTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0284C7")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="ECONOMIC ASSESSMENT · COMPARACIÓN PRELIMINAR"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =14
                              - lblFLEconomicsAlternativesHint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="La economía solo compara políticas que siguen siendo técnicamente defendibles. Una opción barata no recupera una estrategia descartada por seguridad o inviabilidad técnica."
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =36
                              - galFLEconomicAlternatives:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    BorderColor: =Color.Transparent
                                    Height: =218
                                    Items: =SortByColumns(colFLEconomicAlternatives,"SystemRank",SortOrder.Ascending)
                                    ShowScrollbar: =false
                                    TemplatePadding: =2
                                    TemplateSize: =66
                                    Width: =Parent.Width-28
                                    X: =14
                                    Y: =72
                                  Children:
                                    - btnFLEconomicAlternative:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =If(ThisItem.HumanSelected,ColorValue("#A78BFA"),ColorValue("#E2E8F0"))
                                          BorderThickness: =If(ThisItem.HumanSelected,2,1)
                                          Color: =Color.Transparent
                                          Fill: =If(ThisItem.HumanSelected,ColorValue("#F5F3FF"),ColorValue("#FFFFFF"))
                                          Height: =Parent.TemplateHeight-4
                                          HoverFill: =ColorValue("#F8FAFC")
                                          OnSelect: =false
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =""
                                          Width: =Parent.TemplateWidth
                                          X: =0
                                          Y: =2
                                    - lblFLEconomicAlternativeName:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#0F172A")
                                          FontWeight: =FontWeight.Semibold
                                          Size: =9
                                          Text: =ThisItem.AlternativeName
                                          Width: =Parent.TemplateWidth*0.38
                                          X: =12
                                          Y: =10
                                    - lblFLEconomicAlternativeTechnical:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =If(StartsWith(ThisItem.TechnicalStatus,"No válida"),ColorValue("#B91C1C"),ColorValue("#15803D"))
                                          Size: =8
                                          Text: =ThisItem.TechnicalStatus
                                          Width: =Parent.TemplateWidth*0.20
                                          X: =Parent.TemplateWidth*0.39
                                          Y: =10
                                    - lblFLEconomicAlternativeCost:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Right
                                          AutoHeight: =true
                                          Color: =ColorValue("#0F172A")
                                          FontWeight: =FontWeight.Semibold
                                          Size: =9
                                          Text: =Text(ThisItem.ExpectedAnnualCost,"[$-es-ES]#,##0 €") & " / año"
                                          Width: =Parent.TemplateWidth*0.18
                                          X: =Parent.TemplateWidth*0.60
                                          Y: =10
                                    - lblFLEconomicAlternativeBenefit:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Right
                                          AutoHeight: =true
                                          Color: =ColorValue("#475569")
                                          Size: =8
                                          Text: ="Riesgo evitado " & Text(ThisItem.AvoidedRiskValue,"[$-es-ES]#,##0 €")
                                          Width: =Parent.TemplateWidth*0.20-12
                                          X: =Parent.TemplateWidth*0.79
                                          Y: =10
                                    - lblFLEconomicAlternativeState:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#7C3AED")
                                          FontWeight: =FontWeight.Semibold
                                          Size: =7
                                          Text: =If(ThisItem.HumanSelected,"DECISIÓN RCM ACTUAL","ALTERNATIVA")
                                          Width: =Parent.TemplateWidth-24
                                          X: =12
                                          Y: =38
                        - conFLEconomicsCostLayers:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#E2E8F0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =154
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =Parent.Width
                              X: =0
                              Y: =436
                            Children:
                              - lblFLEconomicsLayer1:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0284C7")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="1 · ECONOMIC ASSESSMENT"
                                    Width: =Parent.Width/3-32
                                    X: =18
                                    Y: =16
                              - lblFLEconomicsLayer1Value:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: =Text(LookUp(colFLEconomicAlternatives,HumanSelected,ExpectedAnnualCost),"[$-es-ES]#,##0 €") & " / año"
                                    Width: =Parent.Width/3-32
                                    X: =18
                                    Y: =42
                              - lblFLEconomicsLayer1Hint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="Estimación de alternativa RCM; todavía no es el coste detallado de la tarea."
                                    Width: =Parent.Width/3-32
                                    Wrap: =true
                                    X: =18
                                    Y: =70
                              - lblFLEconomicsLayer2:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#7C3AED")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="2 · MAINTENANCE COST ESTIMATE"
                                    Width: =Parent.Width/3-32
                                    X: =Parent.Width/3+6
                                    Y: =16
                              - lblFLEconomicsLayer2Value:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: =Text(varFLEstimatedAnnualCost,"[$-es-ES]#,##0 €") & " / año"
                                    Width: =Parent.Width/3-32
                                    X: =Parent.Width/3+6
                                    Y: =42
                              - lblFLEconomicsLayer2Hint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="Se consolida con tarea, frecuencia, duración, H-H, materiales y servicios."
                                    Width: =Parent.Width/3-32
                                    Wrap: =true
                                    X: =Parent.Width/3+6
                                    Y: =70
                              - lblFLEconomicsLayer3:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#15803D")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="3 · ACTUAL MAINTENANCE COST"
                                    Width: =Parent.Width/3-32
                                    X: =2*Parent.Width/3-6
                                    Y: =16
                              - lblFLEconomicsLayer3Value:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: =Text(varFLActualAnnualCost,"[$-es-ES]#,##0 €") & " / año"
                                    Width: =Parent.Width/3-32
                                    X: =2*Parent.Width/3-6
                                    Y: =42
                              - lblFLEconomicsLayer3Hint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="Referencia histórica de ejecución; no se confunde con una estimación."
                                    Width: =Parent.Width/3-32
                                    Wrap: =true
                                    X: =2*Parent.Width/3-6
                                    Y: =70
                        - cmpFLEconomicsGate:
                            Control: CanvasComponent
                            ComponentName: cmp_FL_GatePanelPro
                            Properties:
                              CanContinue: =!IsBlank(varFLRCMHumanStrategy)
                              ContinueLabel: ="Continuar a tarea"
                              GateStatus: =If(!IsBlank(varFLRCMHumanStrategy),"passed","blocked")
                              GateTitle: ="Control de avance FL-17"
                              Height: =Parent.Height-602
                              OnContinue: |-
                                =
                                UpdateIf(colFLStageExecutions,StageId="FL-17",{Status:"confirmed",IsCurrent:false});
                                Set(varFLCurrentStageId,"FL-18");
                                UpdateIf(colFLStageExecutions,StageId="FL-18",{IsCurrent:true});
                                Navigate(scr_FL_Task,ScreenTransition.None)
                              OutputLabel: ="EconomicAssessment de alternativas válidas"
                              Reason: ="El coste detallado se completará después de definir tarea, intervalo y recursos."
                              RequiredAction: ="Mantener solo alternativas técnicamente válidas"
                              ResponsibleRole: ="Mantenimiento / Planificación + Ingeniería de Fiabilidad"
                              Summary: ="Comparación económica preliminar preparada"
                              Width: =Parent.Width
                              X: =0
                              Y: =602
