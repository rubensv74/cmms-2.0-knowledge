Screens:
  scr_FL_FLH:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: |-
        =
        Set(varFLNavKey,"Assets");
        Set(varFLAssetSelectedNode,"P101");
        ClearCollect(
            colFLFLHNodes,
            {RowNodeId:"FLH01",RowParentNodeId:"",RowLevel:1,RowLabel:"Grupo industrial DEMO",RowDescription:"",RowSortPath:"001",RowPath:"Grupo industrial DEMO",RowNodeType:"plant",RowIconKey:"home",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH02",RowParentNodeId:"FLH01",RowLevel:2,RowLabel:"Complejo Norte",RowDescription:"",RowSortPath:"001/001",RowPath:"Grupo industrial DEMO > Complejo Norte",RowNodeType:"area",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH03",RowParentNodeId:"FLH02",RowLevel:3,RowLabel:"Planta de proceso",RowDescription:"",RowSortPath:"001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso",RowNodeType:"plant",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH04",RowParentNodeId:"FLH03",RowLevel:4,RowLabel:"Área de proceso",RowDescription:"",RowSortPath:"001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso",RowNodeType:"area",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH05",RowParentNodeId:"FLH04",RowLevel:5,RowLabel:"Unidad de proceso A",RowDescription:"",RowSortPath:"001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A",RowNodeType:"unit",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH06",RowParentNodeId:"FLH05",RowLevel:6,RowLabel:"Sistema de refrigeración",RowDescription:"",RowSortPath:"001/001/001/001/001/001",RowPath:"Grupo industrial DEMO > Complejo Norte > Planta de proceso > Área de proceso > Unidad de proceso A > Sistema de refrigeración",RowNodeType:"system",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH07",RowParentNodeId:"FLH06",RowLevel:7,RowLabel:"Circuito de agua CW-01",RowDescription:"",RowSortPath:"001/001/001/001/001/001/001",RowPath:"... > Sistema de refrigeración > Circuito de agua CW-01",RowNodeType:"subsystem",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH08",RowParentNodeId:"FLH07",RowLevel:8,RowLabel:"Estación de bombeo",RowDescription:"",RowSortPath:"001/001/001/001/001/001/001/001",RowPath:"... > Circuito de agua CW-01 > Estación de bombeo",RowNodeType:"system",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH09",RowParentNodeId:"FLH08",RowLevel:9,RowLabel:"Tren de bombeo P-100",RowDescription:"",RowSortPath:"001/001/001/001/001/001/001/001/001",RowPath:"... > Estación de bombeo > Tren de bombeo P-100",RowNodeType:"equipment",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"FLH10",RowParentNodeId:"FLH09",RowLevel:10,RowLabel:"Conjunto bomba-motor",RowDescription:"",RowSortPath:"001/001/001/001/001/001/001/001/001/001",RowPath:"... > Tren de bombeo P-100 > Conjunto bomba-motor",RowNodeType:"equipment",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"P101",RowParentNodeId:"FLH10",RowLevel:11,RowLabel:"P-101 · Bomba centrífuga",RowDescription:"Activo principal del caso",RowSortPath:"001/001/001/001/001/001/001/001/001/001/001",RowPath:"... > Conjunto bomba-motor > P-101",RowNodeType:"tag",RowIconKey:"flag",RowHasChildren:false,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"P102",RowParentNodeId:"FLH10",RowLevel:11,RowLabel:"P-102 · Bomba de reserva",RowDescription:"",RowSortPath:"001/001/001/001/001/001/001/001/001/001/002",RowPath:"... > Conjunto bomba-motor > P-102",RowNodeType:"tag",RowIconKey:"document",RowHasChildren:false,RowIsExpanded:true,RowIsVisible:true}
        )

    Children:
      - conFLAssetRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width

          Children:
            - cmpFLAssetNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Assets"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLAssetNav.SelectedKey);
                    Switch(
                        cmpFLAssetNav.SelectedKey,
                        "Home",Navigate(scr_FL_Home,ScreenTransition.None),
                        "Assets",Navigate(scr_FL_FLH,ScreenTransition.None),
                        "Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),
                        "Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),
                        "Governance",Navigate(scr_FL_Governance,ScreenTransition.None),
                        "Settings",Navigate(scr_FL_Settings,ScreenTransition.None)
                    )
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0

            - conFLAssetMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLAssetNav.Width
                  X: =cmpFLAssetNav.Width
                  Y: =0

                Children:
                  - lblFLAssetEyebrow:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0284C7")
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: ="ACTIVOS · P-101"
                        Width: =Parent.Width-48
                        X: =24
                        Y: =20
                  - lblFLAssetTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0F172A")
                        FontWeight: =FontWeight.Semibold
                        Size: =23
                        Text: =LookUp(colFLText,Key="SCREEN_FLH_TITLE",If(varFLLocale="en",EN,ES))
                        Width: =Parent.Width-48
                        Wrap: =false
                        X: =24
                        Y: =46
                  - lblFLAssetSubtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        Size: =10
                        Text: =LookUp(colFLText,Key="SCREEN_FLH_SUBTITLE",If(varFLLocale="en",EN,ES))
                        Width: =Parent.Width-48
                        Wrap: =false
                        X: =24
                        Y: =82
                  - conFLAssetTabs:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =50
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.Width-48
                        X: =24
                        Y: =116
                      Children:
                        - btnFLAssetFLH:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =If(App.ActiveScreen=scr_FL_FLH,ColorValue("#BAE6FD"),RGBA(0,0,0,0))
                              BorderThickness: =1
                              Color: =If(App.ActiveScreen=scr_FL_FLH,ColorValue("#0369A1"),ColorValue("#475569"))
                              Fill: =If(App.ActiveScreen=scr_FL_FLH,ColorValue("#F0F9FF"),Color.Transparent)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              HoverFill: =ColorValue("#F8FAFC")
                              OnSelect: =Navigate(scr_FL_FLH,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="FLH"
                              Width: =110
                              X: =8
                              Y: =8
                        - btnFLAssetTaxonomy:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =If(App.ActiveScreen=scr_FL_Taxonomy,ColorValue("#BAE6FD"),RGBA(0,0,0,0))
                              BorderThickness: =1
                              Color: =If(App.ActiveScreen=scr_FL_Taxonomy,ColorValue("#0369A1"),ColorValue("#475569"))
                              Fill: =If(App.ActiveScreen=scr_FL_Taxonomy,ColorValue("#F0F9FF"),Color.Transparent)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              HoverFill: =ColorValue("#F8FAFC")
                              OnSelect: =Navigate(scr_FL_Taxonomy,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Taxonomía"
                              Width: =126
                              X: =126
                              Y: =8
                        - btnFLAssetADR:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =If(App.ActiveScreen=scr_FL_ADR,ColorValue("#BAE6FD"),RGBA(0,0,0,0))
                              BorderThickness: =1
                              Color: =If(App.ActiveScreen=scr_FL_ADR,ColorValue("#0369A1"),ColorValue("#475569"))
                              Fill: =If(App.ActiveScreen=scr_FL_ADR,ColorValue("#F0F9FF"),Color.Transparent)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              HoverFill: =ColorValue("#F8FAFC")
                              OnSelect: =Navigate(scr_FL_ADR,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="ADR"
                              Width: =110
                              X: =260
                              Y: =8
                        - btnFLAsset360:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =If(App.ActiveScreen=scr_FL_Asset360,ColorValue("#BAE6FD"),RGBA(0,0,0,0))
                              BorderThickness: =1
                              Color: =If(App.ActiveScreen=scr_FL_Asset360,ColorValue("#0369A1"),ColorValue("#475569"))
                              Fill: =If(App.ActiveScreen=scr_FL_Asset360,ColorValue("#F0F9FF"),Color.Transparent)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              HoverFill: =ColorValue("#F8FAFC")
                              OnSelect: =Navigate(scr_FL_Asset360,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Ficha 360"
                              Width: =126
                              X: =378
                              Y: =8
                  - cmpFLAssetTree:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_TreePro
                      Properties:
                        AllowSearch: =true
                        CompactMode: =true
                        Height: =Parent.Height-196
                        HighlightBadgeText: ="ACTIVO"
                        HighlightNodeId: ="P101"
                        IndentSize: =16
                        Items: =colFLFLHNodes
                        MaxVisualDepth: =11
                        OnSelectNode: =Set(varFLAssetSelectedNode,cmpFLAssetTree.SelectedNodeIdOut)
                        OnToggleNode: |-
                          =
                          With(
                              {_nodeId:cmpFLAssetTree.ToggleNodeIdOut,_target:cmpFLAssetTree.ToggleTargetExpandedOut,_sortPath:LookUp(colFLFLHNodes,RowNodeId=cmpFLAssetTree.ToggleNodeIdOut,RowSortPath)},
                              Patch(colFLFLHNodes,LookUp(colFLFLHNodes,RowNodeId=_nodeId),{RowIsExpanded:_target});
                              If(_target,UpdateIf(colFLFLHNodes,RowParentNodeId=_nodeId,{RowIsVisible:true}),UpdateIf(colFLFLHNodes,StartsWith(RowSortPath,_sortPath & "/"),{RowIsVisible:false,RowIsExpanded:false}))
                          )
                        SelectedNodeId: =varFLAssetSelectedNode
                        ShowBreadcrumb: =true
                        ShowDescriptions: =false
                        ShowHighlightBadge: =true
                        ShowIcons: =true
                        ShowLines: =true
                        Width: =Min(600,(Parent.Width-60)*0.48)
                        X: =24
                        Y: =182
                  - conFLAssetDetail:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =Parent.Height-196
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-cmpFLAssetTree.Width-60
                        X: =cmpFLAssetTree.X+cmpFLAssetTree.Width+12
                        Y: =182
                      Children:
                        - lblFLAssetDetailEyebrow:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0284C7")
                              FontWeight: =FontWeight.Semibold
                              Size: =9
                              Text: ="NODO SELECCIONADO"
                              Width: =Parent.Width-36
                              X: =18
                              Y: =18
                        - lblFLAssetDetailTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =19
                              Text: =cmpFLAssetTree.SelectedLabelOut
                              Width: =Parent.Width-36
                              Wrap: =true
                              X: =18
                              Y: =48
                        - lblFLAssetDetailMeta:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =10
                              Text: ="Nivel " & Text(cmpFLAssetTree.SelectedLevelOut) & " · Jerarquía FLH"
                              Width: =Parent.Width-36
                              X: =18
                              Y: =86
                        - lblFLAssetDetailPath:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#475569")
                              Size: =10
                              Text: =cmpFLAssetTree.SelectedPathOut
                              Width: =Parent.Width-36
                              Wrap: =true
                              X: =18
                              Y: =118
                        - conFLAssetMasterData:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#E2E8F0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#F8FAFC")
                              Height: =112
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =Parent.Width-36
                              X: =18
                              Y: =190
                            Children:
                              - lblFLAssetMasterLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="DATO MAESTRO · SOLO LECTURA"
                                    Width: =Parent.Width-28
                                    X: =14
                                    Y: =12
                              - lblFLAssetMasterText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#334155")
                                    Size: =10
                                    Text: ="La jerarquía, clasificación y relaciones técnicas son referencia del maestro de activos. El AnalysisCase puede usarlas, pero no modificarlas directamente."
                                    Width: =Parent.Width-28
                                    Wrap: =true
                                    X: =14
                                    Y: =38
                        - conFLAssetCurrent:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#FED7AA")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFF7ED")
                              Height: =108
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =cmpFLAssetTree.SelectedNodeIdOut="P101"
                              Width: =Parent.Width-36
                              X: =18
                              Y: =316
                            Children:
                              - lblFLAssetCurrentLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#C2410C")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="ACTIVO DEL CASO P-101"
                                    Width: =Parent.Width-28
                                    X: =14
                                    Y: =12
                              - lblFLAssetCurrentText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#7C2D12")
                                    Size: =10
                                    Text: ="Este objeto es el punto de referencia común para FLH, Taxonomía, ADR y el análisis AMEF/RCM."
                                    Width: =Parent.Width-28
                                    Wrap: =true
                                    X: =14
                                    Y: =38
                        - btnFLAssetOpen360:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#0284C7")
                              BorderThickness: =1
                              Color: =Color.White
                              DisplayMode: =If(cmpFLAssetTree.SelectedNodeIdOut="P101",DisplayMode.Edit,DisplayMode.Disabled)
                              Fill: =ColorValue("#0284C7")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              HoverFill: =ColorValue("#0369A1")
                              OnSelect: =Navigate(scr_FL_Asset360,ScreenTransition.None)
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =10
                              Text: ="Abrir ficha 360"
                              Width: =160
                              X: =Parent.Width-Self.Width-18
                              Y: =Parent.Height-Self.Height-18
