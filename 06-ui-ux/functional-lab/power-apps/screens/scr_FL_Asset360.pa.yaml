Screens:
  scr_FL_Asset360:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: =Set(varFLNavKey,"Assets")

    Children:
      - conFLAsset360Root:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLAsset360Nav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Assets"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveAssetCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLAsset360Nav.SelectedKey);
                    Switch(cmpFLAsset360Nav.SelectedKey,"Home",Navigate(scr_FL_Home,ScreenTransition.None),"Assets",Navigate(scr_FL_FLH,ScreenTransition.None),"Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),"Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),"Governance",Navigate(scr_FL_Governance,ScreenTransition.None),"Settings",Navigate(scr_FL_Settings,ScreenTransition.None))
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLAsset360Main:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLAsset360Nav.Width
                  X: =cmpFLAsset360Nav.Width
                  Y: =0
                Children:
                  - cmpFLAsset360Header:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="ACTIVO"
                        CaseCode: =varFLActiveAssetCode
                        CaseType: ="Bomba centrífuga"
                        Height: =132
                        JourneyHint: ="Maestro + contexto + ingeniería aplicada"
                        JourneyPosition: ="FICHA 360"
                        ProgressCurrent: =0
                        ProgressTotal: =28
                        ReviewHint: =varFLActiveCriticalityRevision
                        ReviewState: ="Activo operativo"
                        Subtitle: ="La ficha consolida el objeto sin mezclar datos maestros, criticidad de planta e ingeniería AMEF aplicada. Cada capa conserva su propio propietario y revisión."
                        Title: =varFLActiveAssetCode & " · " & varFLActiveAssetName
                        Width: =Parent.Width
                        WorkspaceCode: ="ACTIVOS"
                        X: =0
                        Y: =0
                  - conFLAsset360Tabs:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =54
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =Parent.Width-48
                        X: =24
                        Y: =144
                      Children:
                        - btnFLAsset360FLH:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#CBD5E1")
                              BorderThickness: =1
                              Color: =ColorValue("#334155")
                              Fill: =ColorValue("#FFFFFF")
                              Height: =32
                              OnSelect: =Navigate(scr_FL_FLH,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="FLH"
                              Width: =80
                              X: =12
                              Y: =11
                        - btnFLAsset360Tax:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#CBD5E1")
                              BorderThickness: =1
                              Color: =ColorValue("#334155")
                              Fill: =ColorValue("#FFFFFF")
                              Height: =32
                              OnSelect: =Navigate(scr_FL_Taxonomy,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Taxonomía"
                              Width: =105
                              X: =102
                              Y: =11
                        - btnFLAsset360ADR:
