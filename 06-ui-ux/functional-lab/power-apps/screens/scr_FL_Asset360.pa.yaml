                              Y: =44
                        - lblFLAsset360Application:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#475569")
                              Size: =9
                              Text: =varFLActiveApplicationCode & " · Perfil " & varFLActiveProfileCode
                              Width: =Parent.Width-36
                              Wrap: =true
                              X: =18
                              Y: =82
