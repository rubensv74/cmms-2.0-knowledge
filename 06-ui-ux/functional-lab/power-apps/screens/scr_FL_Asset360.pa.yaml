                              BorderColor: =ColorValue("#CBD5E1")
                              BorderThickness: =1
                              Color: =ColorValue("#334155")
                              Fill: =ColorValue("#FFFFFF")
                              Height: =32
                              OnSelect: =Navigate(scr_FL_AssetCriticality,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Criticidad"
                              Width: =105
                              X: =307
                              Y: =11
                        - btnFLAsset360Current:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#0284C7")
                              BorderThickness: =1
                              Color: =ColorValue("#0369A1")
                              Fill: =ColorValue("#F0F9FF")
                              Height: =32
                              OnSelect: =false
