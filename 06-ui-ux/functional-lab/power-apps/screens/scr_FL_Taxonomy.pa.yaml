Screens:
  scr_FL_Taxonomy:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: |-
        =
        Set(varFLNavKey,"Assets");
        Set(varFLAssetSelectedNode,"P101");
        ClearCollect(
            colFLTaxonomyNodes,
            {RowNodeId:"TAX01",RowParentNodeId:"",RowLevel:1,RowLabel:"ISO 14224 · Equipos",RowDescription:"Esquema de clasificación de referencia",RowSortPath:"001",RowPath:"ISO 14224 · Equipos",RowNodeType:"taxonomy",RowIconKey:"home",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"TAX02",RowParentNodeId:"TAX01",RowLevel:2,RowLabel:"Equipos mecánicos",RowDescription:"",RowSortPath:"001/001",RowPath:"ISO 14224 > Equipos mecánicos",RowNodeType:"taxonomy",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"TAX03",RowParentNodeId:"TAX02",RowLevel:3,RowLabel:"Equipos rotativos",RowDescription:"",RowSortPath:"001/001/001",RowPath:"ISO 14224 > Equipos mecánicos > Equipos rotativos",RowNodeType:"taxonomy",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"TAX04",RowParentNodeId:"TAX03",RowLevel:4,RowLabel:"Bombas",RowDescription:"",RowSortPath:"001/001/001/001",RowPath:"ISO 14224 > Equipos mecánicos > Equipos rotativos > Bombas",RowNodeType:"taxonomy",RowIconKey:"folder",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"TAX05",RowParentNodeId:"TAX04",RowLevel:5,RowLabel:"Bombas centrífugas",RowDescription:"",RowSortPath:"001/001/001/001/001",RowPath:"ISO 14224 > Equipos mecánicos > Equipos rotativos > Bombas > Bombas centrífugas",RowNodeType:"taxonomy",RowIconKey:"settings",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"TAX06",RowParentNodeId:"TAX05",RowLevel:6,RowLabel:"Bomba centrífuga horizontal",RowDescription:"Clase de equipo utilizada para P-101 en el laboratorio",RowSortPath:"001/001/001/001/001/001",RowPath:"ISO 14224 > ... > Bomba centrífuga horizontal",RowNodeType:"taxonomy",RowIconKey:"document",RowHasChildren:true,RowIsExpanded:true,RowIsVisible:true},
            {RowNodeId:"P101",RowParentNodeId:"TAX06",RowLevel:7,RowLabel:"P-101 · Bomba centrífuga",RowDescription:"Activo del caso AMEF/RCM",RowSortPath:"001/001/001/001/001/001/001",RowPath:"ISO 14224 > ... > Bomba centrífuga horizontal > P-101",RowNodeType:"tag",RowIconKey:"flag",RowHasChildren:false,RowIsExpanded:false,RowIsVisible:true}
        )

    Children:
      - conFLTaxRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLTaxNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Assets"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLTaxNav.SelectedKey);
                    Switch(cmpFLTaxNav.SelectedKey,"Home",Navigate(scr_FL_Home,ScreenTransition.None),"Assets",Navigate(scr_FL_FLH,ScreenTransition.None),"Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),"Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),"Governance",Navigate(scr_FL_Governance,ScreenTransition.None),"Settings",Navigate(scr_FL_Settings,ScreenTransition.None))
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLTaxMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLTaxNav.Width
                  X: =cmpFLTaxNav.Width
                  Y: =0
                Children:
                  - lblFLTaxEyebrow:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0284C7")
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: ="ACTIVOS · P-101"
                        Width: =Parent.Width-48
                        X: =24
                        Y: =20
                  - lblFLTaxTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0F172A")
                        FontWeight: =FontWeight.Semibold
                        Size: =23
                        Text: =LookUp(colFLText,Key="SCREEN_TAXONOMY_TITLE",If(varFLLocale="en",EN,ES))
                        Width: =Parent.Width-48
                        X: =24
                        Y: =46
                  - lblFLTaxSubtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        Size: =10
                        Text: =LookUp(colFLText,Key="SCREEN_TAXONOMY_SUBTITLE",If(varFLLocale="en",EN,ES))
                        Width: =Parent.Width-48
                        X: =24
                        Y: =82
                  - conFLTaxTabs:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =50
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.Width-48
                        X: =24
                        Y: =116
                      Children:
                        - btnFLTaxFLH:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderThickness: =0
                              Color: =ColorValue("#475569")
                              Fill: =Color.Transparent
                              Height: =34
                              OnSelect: =Navigate(scr_FL_FLH,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="FLH"
                              Width: =110
                              X: =8
                              Y: =8
                        - btnFLTaxTaxonomy:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#BAE6FD")
                              BorderThickness: =1
                              Color: =ColorValue("#0369A1")
                              Fill: =ColorValue("#F0F9FF")
                              Height: =34
                              OnSelect: =false
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Taxonomía"
                              Width: =126
                              X: =126
                              Y: =8
                        - btnFLTaxADR:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderThickness: =0
                              Color: =ColorValue("#475569")
                              Fill: =Color.Transparent
                              Height: =34
                              OnSelect: =Navigate(scr_FL_ADR,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="ADR"
                              Width: =110
                              X: =260
                              Y: =8
                        - btnFLTax360:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0,0,0,0)
                              BorderThickness: =0
                              Color: =ColorValue("#475569")
                              Fill: =Color.Transparent
                              Height: =34
                              OnSelect: =Navigate(scr_FL_Asset360,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Ficha 360"
                              Width: =126
                              X: =378
                              Y: =8
                  - cmpFLTaxTree:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_TreePro
                      Properties:
                        AllowSearch: =true
                        CompactMode: =true
                        Height: =Parent.Height-196
                        HighlightBadgeText: ="ACTIVO"
                        HighlightNodeId: ="P101"
                        Items: =colFLTaxonomyNodes
                        MaxVisualDepth: =11
                        OnSelectNode: =Set(varFLAssetSelectedNode,cmpFLTaxTree.SelectedNodeIdOut)
                        OnToggleNode: |-
                          =
                          With({_nodeId:cmpFLTaxTree.ToggleNodeIdOut,_target:cmpFLTaxTree.ToggleTargetExpandedOut,_sortPath:LookUp(colFLTaxonomyNodes,RowNodeId=cmpFLTaxTree.ToggleNodeIdOut,RowSortPath)},Patch(colFLTaxonomyNodes,LookUp(colFLTaxonomyNodes,RowNodeId=_nodeId),{RowIsExpanded:_target});If(_target,UpdateIf(colFLTaxonomyNodes,RowParentNodeId=_nodeId,{RowIsVisible:true}),UpdateIf(colFLTaxonomyNodes,StartsWith(RowSortPath,_sortPath & "/"),{RowIsVisible:false,RowIsExpanded:false})))
                        SelectedNodeId: =varFLAssetSelectedNode
                        ShowBreadcrumb: =true
                        ShowDescriptions: =false
                        ShowHighlightBadge: =true
                        ShowIcons: =true
                        ShowLines: =true
                        Width: =Min(600,(Parent.Width-60)*0.48)
                        X: =24
                        Y: =182
                  - conFLTaxDetail:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =Parent.Height-196
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-cmpFLTaxTree.Width-60
                        X: =cmpFLTaxTree.X+cmpFLTaxTree.Width+12
                        Y: =182
                      Children:
                        - lblFLTaxDetailEyebrow:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0284C7")
                              FontWeight: =FontWeight.Semibold
                              Size: =9
                              Text: ="CLASIFICACIÓN SELECCIONADA"
                              Width: =Parent.Width-36
                              X: =18
                              Y: =18
                        - lblFLTaxDetailTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =19
                              Text: =cmpFLTaxTree.SelectedLabelOut
                              Width: =Parent.Width-36
                              X: =18
                              Y: =48
                        - lblFLTaxDetailPath:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#475569")
                              Size: =10
                              Text: =cmpFLTaxTree.SelectedPathOut
                              Width: =Parent.Width-36
                              Wrap: =true
                              X: =18
                              Y: =90
                        - conFLTaxRule:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#E2E8F0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#F8FAFC")
                              Height: =134
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =Parent.Width-36
                              X: =18
                              Y: =166
                            Children:
                              - lblFLTaxRuleLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="MAESTRO DE CLASIFICACIÓN"
                                    Width: =Parent.Width-28
                                    X: =14
                                    Y: =14
                              - lblFLTaxRuleText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#334155")
                                    Size: =10
                                    Text: ="La clasificación se consume como referencia. El análisis puede usar la familia de equipo para sugerir modos de fallo, pero no modifica la taxonomía maestra."
                                    Width: =Parent.Width-28
                                    Wrap: =true
                                    X: =14
                                    Y: =42
                        - btnFLTaxOpen360:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#0284C7")
                              BorderThickness: =1
                              Color: =Color.White
                              DisplayMode: =If(cmpFLTaxTree.SelectedNodeIdOut="P101",DisplayMode.Edit,DisplayMode.Disabled)
                              Fill: =ColorValue("#0284C7")
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: =Navigate(scr_FL_Asset360,ScreenTransition.None)
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =10
                              Text: ="Abrir ficha 360"
                              Width: =160
                              X: =Parent.Width-Self.Width-18
                              Y: =Parent.Height-Self.Height-18
