Screens:
  scr_FL_MaintenancePlans:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: =Set(varFLNavKey,"Plans")

    Children:
      - conFLPlansRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLPlansNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Plans"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveAssetCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLPlansNav.SelectedKey);
                    Switch(cmpFLPlansNav.SelectedKey,"Home",Navigate(scr_FL_Home,ScreenTransition.None),"Assets",Navigate(scr_FL_FLH,ScreenTransition.None),"Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),"Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),"Governance",Navigate(scr_FL_Governance,ScreenTransition.None),"Settings",Navigate(scr_FL_Settings,ScreenTransition.None))
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLPlansMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLPlansNav.Width
                  X: =cmpFLPlansNav.Width
                  Y: =0
                Children:
                  - cmpFLPlansHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="PLANES DE MANTENIMIENTO"
                        CaseCode: =varFLActiveAssetCode
                        CaseType: ="Handoff CMMS"
                        Height: =132
                        JourneyHint: ="Tarea → Job Plan/Route → PM → WO → resultado"
                        JourneyPosition: ="EJECUCIÓN"
                        ProgressCurrent: =28
                        ProgressTotal: =28
                        ReviewHint: =First(colFLPmPlans).PlanCode
                        ReviewState: =First(colFLPmPlans).Status
                        Subtitle: ="Los objetos de ejecución se relacionan, pero no son sinónimos. La agrupación permite gestionar volumen manteniendo historia y resultados por tag."
                        Title: ="Planes de mantenimiento"
                        Width: =Parent.Width
                        WorkspaceCode: ="PLANES"
                        X: =0
                        Y: =0
                  - cmpFLPlansLineage:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_LineagePanelPro
                      Properties:
                        ApplicationCode: =varFLActiveApplicationCode
                        AssetCode: =varFLActiveAssetCode
                        CriticalityLabel: =varFLActiveCriticality
                        ExecutionLabel: =First(colFLWorkOrders).WorkOrderCode & " · " & First(colFLWorkOrders).Status
                        Height: =126
                        LibraryCode: =varFLActiveFmeaCode
                        RevisionCode: =varFLActiveFmeaRevisionCode
                        Title: ="Handoff de ingeniería a ejecución"
                        Width: =Parent.Width-48
                        X: =24
                        Y: =148
                  - conFLPlansObjects:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =222
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-48
                        X: =24
                        Y: =286
                      Children:
                        - lblFLPlansObjectsTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =10
                              Text: ="Objetos distintos del proceso"
                              Width: =Parent.Width-36
                              X: =18
                              Y: =14
                        - lblFLPlansTaskTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0284C7")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="MAINTENANCE TASK"
                              Width: =Parent.Width/4-30
                              X: =18
                              Y: =50
                        - lblFLPlansTaskValue:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =10
                              Text: =varFLMaintenanceTaskName
                              Width: =Parent.Width/4-30
                              Wrap: =true
                              X: =18
                              Y: =76
                        - lblFLPlansTaskHint:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =8
                              Text: =Text(varFLMaintenanceIntervalValue) & " " & varFLMaintenanceIntervalUnit & " · " & Text(varFLEstimatedManHours,"0.00") & " H-H"
                              Width: =Parent.Width/4-30
                              X: =18
                              Y: =134
                        - lblFLPlansJobTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#7C3AED")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="JOB PLAN / ROUTE"
                              Width: =Parent.Width/4-30
                              X: =Parent.Width/4+6
                              Y: =50
                        - lblFLPlansJobValue:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =10
                              Text: =First(colFLJobPlans).JobPlanCode & " · " & First(colFLJobPlans).Name
                              Width: =Parent.Width/4-30
                              Wrap: =true
                              X: =Parent.Width/4+6
                              Y: =76
                        - lblFLPlansJobHint:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =8
                              Text: ="Agrupa instrucciones/tareas compatibles para ejecución."
                              Width: =Parent.Width/4-30
                              Wrap: =true
                              X: =Parent.Width/4+6
                              Y: =134
                        - lblFLPlansPMTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#C2410C")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="PREVENTIVE MAINTENANCE PLAN"
                              Width: =Parent.Width/4-30
                              X: =Parent.Width/2-6
                              Y: =50
                        - lblFLPlansPMValue:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =10
                              Text: =First(colFLPmPlans).PlanCode
                              Width: =Parent.Width/4-30
                              Wrap: =true
                              X: =Parent.Width/2-6
                              Y: =76
                        - lblFLPlansPMHint:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =8
                              Text: =First(colFLPmPlans).Cycle & " · referencia al Job Plan"
                              Width: =Parent.Width/4-30
                              Wrap: =true
                              X: =Parent.Width/2-6
                              Y: =134
                        - lblFLPlansWOTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#15803D")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="WORK ORDER / RESULT"
                              Width: =Parent.Width/4-30
                              X: =3*Parent.Width/4-18
                              Y: =50
                        - lblFLPlansWOValue:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =10
                              Text: =First(colFLWorkOrders).WorkOrderCode & " · " & First(colFLWorkOrders).TechnicalObjectCode
                              Width: =Parent.Width/4-30
                              Wrap: =true
                              X: =3*Parent.Width/4-18
                              Y: =76
                        - lblFLPlansWOHint:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =8
                              Text: =First(colFLExecutionResults).ResultCode & " · " & Text(First(colFLExecutionResults).MeasurementValue) & " " & First(colFLExecutionResults).MeasurementUnit
                              Width: =Parent.Width/4-30
                              Wrap: =true
                              X: =3*Parent.Width/4-18
                              Y: =134
                  - conFLPlansIdentity:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#BBF7D0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#F0FDF4")
                        Height: =146
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-48
                        X: =24
                        Y: =520
                      Children:
                        - lblFLPlansIdentityTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#15803D")
                              FontWeight: =FontWeight.Semibold
                              Size: =9
                              Text: ="TRAZABILIDAD POR TAG AUNQUE EXISTA AGRUPACIÓN"
                              Width: =Parent.Width-36
                              X: =18
                              Y: =16
                        - lblFLPlansIdentityText:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#14532D")
                              Size: =9
                              Text: ="La ruta puede agrupar varios objetos, pero cada Work Order y cada ExecutionResult conserva TechnicalObjectId. Así podemos saber qué ocurrió en P-101, cuánto costó y si el plan fue eficaz, aunque comparta Job Plan con otros equipos."
                              Width: =Parent.Width-260
                              Wrap: =true
                              X: =18
                              Y: =46
                        - btnFLPlansTrace:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#15803D")
                              BorderThickness: =1
                              Color: =ColorValue("#15803D")
                              Fill: =ColorValue("#FFFFFF")
                              Height: =36
                              OnSelect: =Navigate(scr_FL_Traceability,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: ="Ver trazabilidad completa"
                              Width: =190
                              X: =Parent.Width-208
                              Y: =50
                  - conFLPlansGrouping:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#FED7AA")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFF7ED")
                        Height: =Parent.Height-690
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-48
                        X: =24
                        Y: =678
                      Children:
                        - lblFLPlansGroupingTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#C2410C")
                              FontWeight: =FontWeight.Semibold
                              Size: =9
                              Text: ="OPTIMIZACIÓN SIN PROLIFERACIÓN DE PLANES"
                              Width: =Parent.Width-36
                              X: =18
                              Y: =14
                        - lblFLPlansGroupingText:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#7C2D12")
                              Size: =8
                              Text: ="Las reglas de agrupación por frecuencia, actividad, ubicación o ejecutor son configurables. El Functional Lab demuestra la capacidad; las reglas corporativas exactas se validarán posteriormente."
                              Width: =Parent.Width-36
                              Wrap: =true
                              X: =18
                              Y: =42
