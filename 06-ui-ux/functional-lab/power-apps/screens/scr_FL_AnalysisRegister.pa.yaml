Screens:
  scr_FL_AnalysisRegister:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: =Set(varFLNavKey,"Strategy")

    Children:
      - conFLRegRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLRegNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Strategy"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLRegNav.SelectedKey);
                    Switch(cmpFLRegNav.SelectedKey,"Home",Navigate(scr_FL_Home,ScreenTransition.None),"Assets",Navigate(scr_FL_FLH,ScreenTransition.None),"Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),"Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),"Governance",Navigate(scr_FL_Governance,ScreenTransition.None),"Settings",Navigate(scr_FL_Settings,ScreenTransition.None))
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLRegMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLRegNav.Width
                  X: =cmpFLRegNav.Width
                  Y: =0
                Children:
                  - lblFLRegEyebrow:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0284C7")
                        FontWeight: =FontWeight.Semibold
                        Size: =9
                        Text: ="ESTRATEGIA DE MANTENIMIENTO"
                        Width: =Parent.Width-48
                        X: =24
                        Y: =20
                  - lblFLRegTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#0F172A")
                        FontWeight: =FontWeight.Semibold
                        Size: =23
                        Text: =LookUp(colFLText,Key="SCREEN_CASES_TITLE",If(varFLLocale="en",EN,ES))
                        Width: =Parent.Width-48
                        X: =24
                        Y: =46
                  - lblFLRegSubtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AutoHeight: =true
                        Color: =ColorValue("#64748B")
                        Size: =10
                        Text: ="Consulta casos AMEF/RCM, su progreso, estado y responsabilidad actual."
                        Width: =Parent.Width-48
                        X: =24
                        Y: =82
                  - conFLRegSummary:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =92
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =Parent.Width-48
                        X: =24
                        Y: =120
                      Children:
                        - lblFLRegTotal:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =20
                              Text: =Text(CountRows(colFLAnalysisCases))
                              Width: =80
                              X: =18
                              Y: =20
                        - lblFLRegTotalHint:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =9
                              Text: ="casos"
                              Width: =80
                              X: =18
                              Y: =54
                        - lblFLRegReview:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0284C7")
                              FontWeight: =FontWeight.Semibold
                              Size: =20
                              Text: =Text(CountRows(Filter(colFLAnalysisCases,LifecycleStatus="InReview")))
                              Width: =80
                              X: =130
                              Y: =20
                        - lblFLRegReviewHint:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =9
                              Text: ="en revisión"
                              Width: =100
                              X: =130
                              Y: =54
                        - lblFLRegApproved:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#15803D")
                              FontWeight: =FontWeight.Semibold
                              Size: =20
                              Text: =Text(CountRows(Filter(colFLAnalysisCases,LifecycleStatus="Approved")))
                              Width: =80
                              X: =260
                              Y: =20
                        - lblFLRegApprovedHint:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =9
                              Text: ="aprobados"
                              Width: =100
                              X: =260
                              Y: =54
                        - btnFLRegOpenCurrent:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#0284C7")
                              BorderThickness: =1
                              Color: =Color.White
                              Fill: =ColorValue("#0284C7")
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              HoverFill: =ColorValue("#0369A1")
                              OnSelect: =Navigate(scr_FL_CaseOverview,ScreenTransition.None)
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =10
                              Text: ="Abrir P-101"
                              Width: =140
                              X: =Parent.Width-Self.Width-18
                              Y: =26
                  - conFLRegTable:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =Parent.Height-246
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-48
                        X: =24
                        Y: =226
                      Children:
                        - lblFLRegTableTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =14
                              Text: ="Casos de análisis"
                              Width: =Parent.Width-36
                              X: =18
                              Y: =16
                        - lblFLRegHeaderCase:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="CASO"
                              Width: =80
                              X: =18
                              Y: =50
                        - lblFLRegHeaderTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="OBJETO / TÍTULO"
                              Width: =Parent.Width*0.35
                              X: =100
                              Y: =50
                        - lblFLRegHeaderStage:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="ETAPA"
                              Width: =100
                              X: =Parent.Width*0.52
                              Y: =50
                        - lblFLRegHeaderStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="ESTADO"
                              Width: =100
                              X: =Parent.Width*0.66
                              Y: =50
                        - lblFLRegHeaderProgress:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: ="PROGRESO"
                              Width: =90
                              X: =Parent.Width*0.80
                              Y: =50
                        - galFLRegCases:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =Color.Transparent
                              Height: =Parent.Height-88
                              Items: =colFLAnalysisCases
                              ShowScrollbar: =true
                              TemplateFill: =Color.Transparent
                              TemplatePadding: =3
                              TemplateSize: =62
                              Width: =Parent.Width-24
                              X: =12
                              Y: =76
                            Children:
                              - lblFLRegCaseCode:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0284C7")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =10
                                    Text: =ThisItem.CaseCode
                                    Width: =70
                                    X: =8
                                    Y: =18
                              - lblFLRegCaseTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =10
                                    Text: =ThisItem.Title
                                    Width: =Parent.TemplateWidth*0.34
                                    Wrap: =false
                                    X: =88
                                    Y: =12
                              - lblFLRegCaseOwner:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: =ThisItem.OwnerRole
                                    Width: =Parent.TemplateWidth*0.34
                                    Wrap: =false
                                    X: =88
                                    Y: =34
                              - lblFLRegCaseStage:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#334155")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: =ThisItem.CurrentStageId
                                    Width: =90
                                    X: =Parent.TemplateWidth*0.51
                                    Y: =18
                              - lblFLRegCaseStatus:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =If(ThisItem.LifecycleStatus="Approved",ColorValue("#15803D"),If(ThisItem.LifecycleStatus="InReview",ColorValue("#0369A1"),ColorValue("#64748B")))
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: =ThisItem.LifecycleStatus
                                    Width: =100
                                    X: =Parent.TemplateWidth*0.65
                                    Y: =18
                              - lblFLRegCaseProgress:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#334155")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: =Text(ThisItem.ProgressPct) & "%"
                                    Width: =60
                                    X: =Parent.TemplateWidth*0.80
                                    Y: =18
                              - btnFLRegCaseOpen:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorValue("#E2E8F0")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Fill: =ColorValue("#FFFFFF")
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    HoverFill: =ColorValue("#F8FAFC")
                                    OnSelect: |-
                                      =
                                      If(
                                          ThisItem.CaseCode="P-101",
                                          Set(varFLActiveCaseId,ThisItem.AnalysisCaseId);
                                          Set(varFLActiveCaseCode,ThisItem.CaseCode);
                                          Set(varFLActiveCaseTitle,ThisItem.CaseCode & " · " & ThisItem.Title);
                                          Set(varFLCurrentStageId,ThisItem.CurrentStageId);
                                          Navigate(scr_FL_CaseOverview,ScreenTransition.None)
                                      )
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =9
                                    Text: =If(ThisItem.CaseCode="P-101","Abrir","Vista demo")
                                    Width: =90
                                    X: =Parent.TemplateWidth-Self.Width-8
                                    Y: =13
