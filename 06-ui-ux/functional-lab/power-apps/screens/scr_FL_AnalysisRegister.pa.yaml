Screens:
  scr_FL_AnalysisRegister:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: =Set(varFLNavKey,"Strategy")

    Children:
      - conFLAnalysisRegisterRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLAnalysisRegisterNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Strategy"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLAnalysisRegisterNav.SelectedKey);
                    Switch(
                        cmpFLAnalysisRegisterNav.SelectedKey,
                        "Home",Navigate(scr_FL_Home,ScreenTransition.None),
                        "Assets",Navigate(scr_FL_FLH,ScreenTransition.None),
                        "Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),
                        "Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),
                        "Governance",Navigate(scr_FL_Governance,ScreenTransition.None),
                        "Settings",Navigate(scr_FL_Settings,ScreenTransition.None)
                    )
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLAnalysisRegisterMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLAnalysisRegisterNav.Width
                  X: =cmpFLAnalysisRegisterNav.Width
                  Y: =0
                Children:
                  - cmpFLAnalysisRegisterHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="ESTRATEGIA DE MANTENIMIENTO"
                        CaseCode: ="REGISTRO"
                        CaseType: ="Casos contextuales"
                        Height: =132
                        JourneyHint: ="Cada caso referencia una revisión AMEF y una aplicación a activo"
                        JourneyPosition: ="CASOS"
                        ProgressCurrent: =0
                        ProgressTotal: =28
                        ReviewHint: ="Biblioteca separada"
                        ReviewState: ="Alineado"
                        Subtitle: ="Un caso ya no crea la ingeniería desde cero. Revisa cómo una revisión aprobada se aplica al activo y qué decisiones contextuales quedan pendientes."
                        Title: ="Registro de análisis"
                        Width: =Parent.Width
                        WorkspaceCode: ="ESTRATEGIA"
                        X: =0
                        Y: =0
                  - conFLAnalysisRegisterToolbar:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =54
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =Parent.Width-48
                        X: =24
                        Y: =144
                      Children:
                        - btnFLAnalysisRegisterLibrary:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#0284C7")
                              BorderThickness: =1
                              Color: =ColorValue("#0369A1")
                              Fill: =ColorValue("#F0F9FF")
                              Height: =32
                              OnSelect: =Navigate(scr_FL_FmeaLibrary,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Biblioteca AMEF"
                              Width: =145
                              X: =12
                              Y: =11
                        - btnFLAnalysisRegisterApplications:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#7C3AED")
                              BorderThickness: =1
                              Color: =ColorValue("#6D28D9")
                              Fill: =ColorValue("#F5F3FF")
                              Height: =32
                              OnSelect: =Navigate(scr_FL_AssetApplication,ScreenTransition.None)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Aplicaciones a activos"
                              Width: =170
                              X: =167
                              Y: =11
                        - lblFLAnalysisRegisterRule:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =8
                              Text: ="Biblioteca → aplicación → caso. El caso conserva contexto y decisiones; no duplica la revisión."
                              Width: =Parent.Width-365
                              Wrap: =true
                              X: =355
                              Y: =17
                  - conFLAnalysisRegisterList:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =Parent.Height-222
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-48
                        X: =24
                        Y: =210
                      Children:
                        - lblFLAnalysisRegisterTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =11
                              Text: ="Casos activos y aprobados"
                              Width: =Parent.Width-32
                              X: =16
                              Y: =14
                        - lblFLAnalysisRegisterHCase:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =7
                              Text: ="CASO / ACTIVO"
                              Width: =230
                              X: =16
                              Y: =47
                        - lblFLAnalysisRegisterHFmea:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =7
                              Text: ="REVISIÓN / APLICACIÓN"
                              Width: =180
                              X: =330
                              Y: =47
                        - lblFLAnalysisRegisterHCrit:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =7
                              Text: ="CRITICIDAD"
                              Width: =100
                              X: =530
                              Y: =47
                        - lblFLAnalysisRegisterHState:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              FontWeight: =FontWeight.Semibold
                              Size: =7
                              Text: ="ESTADO / PROGRESO"
                              Width: =130
                              X: =650
                              Y: =47
                        - galFLAnalysisRegister:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =Color.Transparent
                              Height: =Parent.Height-82
                              Items: =colFLAnalysisCases
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =72
                              Width: =Parent.Width-24
                              X: =12
                              Y: =72
                            Children:
                              - btnFLAnalysisRegisterRow:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =If(ThisItem.AnalysisCaseId=varFLActiveCaseId,ColorValue("#0284C7"),ColorValue("#E2E8F0"))
                                    BorderThickness: =1
                                    Color: =Color.Transparent
                                    Fill: =If(ThisItem.AnalysisCaseId=varFLActiveCaseId,ColorValue("#F0F9FF"),ColorValue("#FFFFFF"))
                                    Height: =Parent.TemplateHeight-6
                                    HoverFill: =ColorValue("#F8FAFC")
                                    OnSelect: |-
                                      =
                                      Set(varFLActiveCaseId,ThisItem.AnalysisCaseId);
                                      Set(varFLActiveCaseCode,ThisItem.CaseCode);
                                      Set(varFLActiveAssetCode,ThisItem.TechnicalObjectCode);
                                      Set(varFLActiveApplicationCode,ThisItem.ApplicationCode);
                                      Set(varFLActiveCriticality,ThisItem.Criticality);
                                      Set(varFLActiveFmeaRevisionCode,ThisItem.FmeaRevisionCode);
                                      Navigate(scr_FL_CaseOverview,ScreenTransition.None)
                                    PressedFill: =ColorValue("#E0F2FE")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                                    X: =0
                                    Y: =3
                              - lblFLAnalysisRegisterCase:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: =ThisItem.CaseCode & " · " & ThisItem.Title
                                    Width: =300
                                    Wrap: =false
                                    X: =14
                                    Y: =14
                              - lblFLAnalysisRegisterFmea:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    Size: =8
                                    Text: =ThisItem.FmeaRevisionCode & " · " & ThisItem.ApplicationCode
                                    Width: =185
                                    X: =318
                                    Y: =14
                              - lblFLAnalysisRegisterCrit:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#B45309")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: =ThisItem.Criticality
                                    Width: =100
                                    X: =518
                                    Y: =14
                              - lblFLAnalysisRegisterState:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    Size: =8
                                    Text: =ThisItem.LifecycleStatus & " · " & Text(ThisItem.ProgressPct) & "%"
                                    Width: =130
                                    X: =638
                                    Y: =14
