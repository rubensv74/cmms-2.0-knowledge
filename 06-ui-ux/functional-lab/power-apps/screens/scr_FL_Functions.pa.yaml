Screens:
  scr_FL_Functions:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: |-
        =
        Set(varFLNavKey,"Strategy");
        If(IsBlank(varFLFunctionOverrideReason),Set(varFLFunctionOverrideReason,""))

    Children:
      - conFLFunctionsRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLFunctionsNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Strategy"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLFunctionsNav.SelectedKey);
                    Switch(
                        cmpFLFunctionsNav.SelectedKey,
                        "Home",Navigate(scr_FL_Home,ScreenTransition.None),
                        "Assets",Navigate(scr_FL_FLH,ScreenTransition.None),
                        "Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),
                        "Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),
                        "Governance",Navigate(scr_FL_Governance,ScreenTransition.None),
                        "Settings",Navigate(scr_FL_Settings,ScreenTransition.None)
                    )
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLFunctionsMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLFunctionsNav.Width
                  X: =cmpFLFunctionsNav.Width
                  Y: =0
                Children:
                  - cmpFLFunctionsHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="APLICACIÓN AMEF"
                        CaseCode: =varFLActiveAssetCode
                        CaseType: =varFLActiveFmeaCode & " · " & varFLActiveFmeaRevisionCode
                        Height: =132
                        JourneyHint: ="FL-04 / FL-05 · revisar, no recrear"
                        JourneyPosition: ="04–05 / 28"
                        ProgressCurrent: =5
                        ProgressTotal: =28
                        ReviewHint: =varFLActiveApplicationCode
                        ReviewState: =If(varFLCaseDraft,"Borrador","Confirmado")
                        Subtitle: ="Las funciones y fallos funcionales proceden de la revisión AMEF. Aquí comprobamos si son válidos para P-101 y registramos solo las excepciones contextuales."
                        Title: ="Funciones y fallos funcionales"
                        Width: =Parent.Width
                        WorkspaceCode: ="ESTRATEGIA"
                        X: =0
                        Y: =0
                  - cmpFLFunctionsRail:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_ProcessRailPro
                      Properties:
                        ActiveStageId: =varFLCurrentStageId
                        CompactMode: =true
                        Height: =Parent.Height-cmpFLFunctionsHeader.Height-24
                        Items: =colFLStageExecutions
                        OnSelectStage: |-
                          =
                          Set(varFLCurrentStageId,cmpFLFunctionsRail.SelectedStageIdOut);
                          Switch(
                              cmpFLFunctionsRail.SelectedScreenKeyOut,
                              "Context",Navigate(scr_FL_Context,ScreenTransition.None),
                              "Functions",Navigate(scr_FL_Functions,ScreenTransition.None),
                              "FailureModes",Navigate(scr_FL_FailureModes,ScreenTransition.None),
                              "AMEF",Navigate(scr_FL_AMEF,ScreenTransition.None),
                              "RCM",Navigate(scr_FL_RCM,ScreenTransition.None),
                              "Economics",Navigate(scr_FL_Economics,ScreenTransition.None),
                              "Task",Navigate(scr_FL_Task,ScreenTransition.None),
                              "PlanPackage",Navigate(scr_FL_PlanPackage,ScreenTransition.None),
                              "Traceability",Navigate(scr_FL_Traceability,ScreenTransition.None),
                              "ReviewApproval",Navigate(scr_FL_ReviewApproval,ScreenTransition.None),
                              "Effectiveness",Navigate(scr_FL_Effectiveness,ScreenTransition.None)
                          )
                        ShowPhaseHeaders: =true
                        Width: =300
                        X: =24
                        Y: =cmpFLFunctionsHeader.Height+12
                  - conFLFunctionsWork:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height-cmpFLFunctionsHeader.Height-24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width-cmpFLFunctionsRail.Width-60
                        X: =cmpFLFunctionsRail.X+cmpFLFunctionsRail.Width+12
                        Y: =cmpFLFunctionsHeader.Height+12
                      Children:
                        - cmpFLFunctionsLineage:
                            Control: CanvasComponent
                            ComponentName: cmp_FL_LineagePanelPro
                            Properties:
                              ApplicationCode: =varFLActiveApplicationCode
                              AssetCode: =varFLActiveAssetCode
                              CriticalityLabel: =varFLActiveCriticality
                              ExecutionLabel: ="Sin handoff todavía"
                              Height: =126
                              LibraryCode: =varFLActiveFmeaCode
                              RevisionCode: =varFLActiveFmeaRevisionCode
                              Title: ="Origen de funciones y fallos"
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                        - conFLFunctionsInherited:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#BAE6FD")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =Parent.Height-138
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =(Parent.Width-12)*0.62
                              X: =0
                              Y: =138
                            Children:
                              - lblFLFunctionsInheritedTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0284C7")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="INGENIERÍA HEREDADA · SOLO LECTURA EN ESTE CASO"
                                    Width: =Parent.Width-32
                                    X: =16
                                    Y: =14
                              - galFLFunctionsInherited:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    BorderColor: =Color.Transparent
                                    Height: =Parent.Height-56
                                    Items: =Filter(colFLFmeaFunctions,FmeaRevisionId=varFLActiveFmeaRevisionId)
                                    ShowScrollbar: =false
                                    TemplatePadding: =0
                                    TemplateSize: =122
                                    Width: =Parent.Width-20
                                    X: =10
                                    Y: =46
                                  Children:
                                    - btnFLFunctionsInheritedRow:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =ColorValue("#E2E8F0")
                                          BorderThickness: =1
                                          Color: =Color.Transparent
                                          Fill: =ColorValue("#F8FAFC")
                                          Height: =Parent.TemplateHeight-6
                                          HoverFill: =ColorValue("#F1F5F9")
                                          OnSelect: =false
                                          PressedFill: =ColorValue("#E2E8F0")
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =""
                                          Width: =Parent.TemplateWidth
                                          X: =0
                                          Y: =3
                                    - lblFLFunctionsInheritedCode:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#0284C7")
                                          FontWeight: =FontWeight.Semibold
                                          Size: =8
                                          Text: =ThisItem.FunctionId
                                          Width: =Parent.TemplateWidth-24
                                          X: =12
                                          Y: =10
                                    - lblFLFunctionsInheritedStatement:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#0F172A")
                                          FontWeight: =FontWeight.Semibold
                                          Size: =9
                                          Text: =ThisItem.Statement
                                          Width: =Parent.TemplateWidth-24
                                          Wrap: =true
                                          X: =12
                                          Y: =31
                                    - lblFLFunctionsInheritedStandard:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#475569")
                                          Size: =8
                                          Text: ="Estándar · " & Coalesce(ThisItem.PerformanceStandard,"No aplica")
                                          Width: =Parent.TemplateWidth-24
                                          Wrap: =true
                                          X: =12
                                          Y: =57
                                    - lblFLFunctionsInheritedFailures:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#64748B")
                                          Size: =8
                                          Text: ="Fallos · " & Concat(Filter(colFLFmeaFunctionalFailures,FunctionId=ThisItem.FunctionId),FunctionalFailureId & " " & Statement," · ")
                                          Width: =Parent.TemplateWidth-24
                                          Wrap: =true
                                          X: =12
                                          Y: =82
                        - conFLFunctionsOverride:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#DDD6FE")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =Parent.Height-138
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =Parent.Width-conFLFunctionsInherited.Width-12
                              X: =conFLFunctionsInherited.Width+12
                              Y: =138
                            Children:
                              - lblFLFunctionsOverrideTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#7C3AED")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="EXCEPCIÓN CONTEXTUAL"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =16
                              - lblFLFunctionsOverrideText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    Size: =9
                                    Text: ="Si una función de la revisión R01 no representa correctamente P-101, no la editamos aquí. Registramos un override justificable o iniciamos una revisión de biblioteca."
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =44
                              - txtFLFunctionsOverrideReason:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =ColorValue("#DDD6FE")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Default: =varFLFunctionOverrideReason
                                    Fill: =ColorValue("#FAFAFF")
                                    Height: =86
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =
                                      Set(varFLFunctionOverrideReason,Trim(Self.Text));
                                      Set(varFLCaseDraft,true)
                                    PaddingLeft: =10
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =108
                              - lblFLFunctionsOverrideStatus:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =If(IsBlank(Trim(varFLFunctionOverrideReason)),ColorValue("#15803D"),ColorValue("#B45309"))
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: =If(IsBlank(Trim(varFLFunctionOverrideReason)),"Sin override · se hereda R01","Override contextual en borrador · requiere trazabilidad")
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =208
                              - btnFLFunctionsContinue:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorValue("#7C3AED")
                                    BorderThickness: =1
                                    Color: =Color.White
                                    Fill: =ColorValue("#7C3AED")
                                    Height: =36
                                    OnSelect: |-
                                      =
                                      UpdateIf(colFLStageExecutions,StageId="FL-04" || StageId="FL-05",{Status:"confirmed",IsCurrent:false});
                                      Set(varFLCurrentStageId,"FL-06");
                                      UpdateIf(colFLStageExecutions,StageId="FL-06",{IsCurrent:true});
                                      Navigate(scr_FL_FailureModes,ScreenTransition.None)
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =9
                                    Text: ="Continuar a modos y causas"
                                    Width: =190
                                    X: =18
                                    Y: =254
