Screens:
  scr_FL_FmeaRevision:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: =Set(varFLNavKey,"Strategy")

    Children:
      - conFLFmeaRevisionRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLFmeaRevisionNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Strategy"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveFmeaCode
                  CurrentCaseName: ="Revisión " & varFLActiveFmeaRevisionCode
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLFmeaRevisionNav.SelectedKey);
                    Switch(
                        cmpFLFmeaRevisionNav.SelectedKey,
                        "Home",Navigate(scr_FL_Home,ScreenTransition.None),
                        "Assets",Navigate(scr_FL_FLH,ScreenTransition.None),
                        "Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),
                        "Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),
                        "Governance",Navigate(scr_FL_Governance,ScreenTransition.None),
                        "Settings",Navigate(scr_FL_Settings,ScreenTransition.None)
                    )
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0

            - conFLFmeaRevisionMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLFmeaRevisionNav.Width
                  X: =cmpFLFmeaRevisionNav.Width
                  Y: =0
                Children:
                  - cmpFLFmeaRevisionHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="REVISIÓN AMEF"
                        CaseCode: =varFLActiveFmeaCode
                        CaseType: =LookUp(colFLFmeaDefinitions,FmeaDefinitionId=varFLActiveFmeaDefinitionId,EquipmentFamilyName)
                        Height: =132
                        JourneyHint: ="Ingeniería base reutilizable; no pertenece a un tag concreto"
                        JourneyPosition: =varFLActiveFmeaRevisionCode
                        ProgressCurrent: =0
                        ProgressTotal: =28
                        ReviewHint: ="RevisionStatus"
                        ReviewState: =LookUp(colFLFmeaRevisions,FmeaRevisionId=varFLActiveFmeaRevisionId,RevisionStatus)
                        Subtitle: ="Aquí se mantiene la fuente técnica común que después se aplicará a P-101, P-102 u otros activos compatibles."
                        Title: =LookUp(colFLFmeaDefinitions,FmeaDefinitionId=varFLActiveFmeaDefinitionId,Name) & " · " & varFLActiveFmeaRevisionCode
                        Width: =Parent.Width
                        WorkspaceCode: ="BIBLIOTECA"
                        X: =0
                        Y: =0

                  - conFLFmeaRevisionTop:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#E2E8F0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =96
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-48
                        X: =24
                        Y: =144
                      Children:
                        - lblFLFmeaRevisionFrozen:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#15803D")
                              FontWeight: =FontWeight.Semibold
                              Size: =8
                              Text: =If(LookUp(colFLFmeaRevisions,FmeaRevisionId=varFLActiveFmeaRevisionId,IsFrozen),"REVISIÓN APROBADA Y CONGELADA","REVISIÓN EN BORRADOR")
                              Width: =250
                              X: =18
                              Y: =16
                        - lblFLFmeaRevisionSummary:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0F172A")
                              FontWeight: =FontWeight.Semibold
                              Size: =10
                              Text: =Text(CountRows(Filter(colFLFmeaFunctions,FmeaRevisionId=varFLActiveFmeaRevisionId))) & " funciones · " & Text(CountRows(Filter(colFLFmeaFailureModes,FmeaRevisionId=varFLActiveFmeaRevisionId))) & " modos · " & Text(CountRows(Filter(colFLProposedTasks,FmeaRevisionId=varFLActiveFmeaRevisionId))) & " tareas propuestas"
                              Width: =Parent.Width-300
                              Wrap: =true
                              X: =18
                              Y: =45
                        - btnFLFmeaRevisionApplications:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorValue("#0284C7")
                              BorderThickness: =1
                              Color: =Color.White
                              Fill: =ColorValue("#0284C7")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              HoverFill: =ColorValue("#0369A1")
                              OnSelect: =Navigate(scr_FL_AssetApplication,ScreenTransition.None)
                              PressedFill: =ColorValue("#075985")
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Ver aplicaciones"
                              Width: =150
                              X: =Parent.Width-168
                              Y: =30

                  - conFLFmeaRevisionFunctions:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#BAE6FD")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =Parent.Height-264
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =(Parent.Width-60)*0.36
                        X: =24
                        Y: =252
                      Children:
                        - lblFLFmeaRevisionFunctionsTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#0284C7")
                              FontWeight: =FontWeight.Semibold
                              Size: =9
                              Text: ="FUNCIONES Y FALLOS FUNCIONALES"
                              Width: =Parent.Width-32
                              X: =16
                              Y: =14
                        - galFLFmeaRevisionFunctions:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =Color.Transparent
                              Height: =Parent.Height-56
                              Items: =Filter(colFLFmeaFunctions,FmeaRevisionId=varFLActiveFmeaRevisionId)
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =104
                              Width: =Parent.Width-20
                              X: =10
                              Y: =46
                            Children:
                              - btnFLFmeaRevisionFunctionRow:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorValue("#E2E8F0")
                                    BorderThickness: =1
                                    Color: =Color.Transparent
                                    Fill: =ColorValue("#F8FAFC")
                                    Height: =Parent.TemplateHeight-6
                                    HoverFill: =ColorValue("#F1F5F9")
                                    OnSelect: =false
                                    PressedFill: =ColorValue("#E2E8F0")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                                    X: =0
                                    Y: =3
                              - lblFLFmeaRevisionFunctionCode:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0284C7")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: =ThisItem.FunctionId
                                    Width: =Parent.TemplateWidth-24
                                    X: =12
                                    Y: =10
                              - lblFLFmeaRevisionFunctionText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: =ThisItem.Statement
                                    Width: =Parent.TemplateWidth-24
                                    Wrap: =true
                                    X: =12
                                    Y: =31
                              - lblFLFmeaRevisionFunctionStandard:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: =Coalesce(ThisItem.PerformanceStandard,"Sin estándar adicional")
                                    Width: =Parent.TemplateWidth-24
                                    Wrap: =true
                                    X: =12
                                    Y: =62

                  - conFLFmeaRevisionModes:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#DDD6FE")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =Parent.Height-264
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =(Parent.Width-60)*0.36
                        X: =conFLFmeaRevisionFunctions.X+conFLFmeaRevisionFunctions.Width+12
                        Y: =252
                      Children:
                        - lblFLFmeaRevisionModesTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#7C3AED")
                              FontWeight: =FontWeight.Semibold
                              Size: =9
                              Text: ="MODOS, CAUSAS Y EFECTOS"
                              Width: =Parent.Width-32
                              X: =16
                              Y: =14
                        - galFLFmeaRevisionModes:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =Color.Transparent
                              Height: =Parent.Height-56
                              Items: =Filter(colFLFmeaFailureModes,FmeaRevisionId=varFLActiveFmeaRevisionId)
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =126
                              Width: =Parent.Width-20
                              X: =10
                              Y: =46
                            Children:
                              - btnFLFmeaRevisionModeRow:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorValue("#E2E8F0")
                                    BorderThickness: =1
                                    Color: =Color.Transparent
                                    Fill: =ColorValue("#FAFAFF")
                                    Height: =Parent.TemplateHeight-6
                                    HoverFill: =ColorValue("#F5F3FF")
                                    OnSelect: =false
                                    PressedFill: =ColorValue("#EDE9FE")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                                    X: =0
                                    Y: =3
                              - lblFLFmeaRevisionModeCode:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#7C3AED")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: =ThisItem.Code
                                    Width: =Parent.TemplateWidth-24
                                    X: =12
                                    Y: =10
                              - lblFLFmeaRevisionModeName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: =ThisItem.Name
                                    Width: =Parent.TemplateWidth-24
                                    Wrap: =true
                                    X: =12
                                    Y: =30
                              - lblFLFmeaRevisionModeCause:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    Size: =8
                                    Text: |-
                                      ="Causas: " & Concat(Filter(colFLFmeaFailureCauses,FailureModeId=ThisItem.FailureModeId),Statement," · ")
                                    Width: =Parent.TemplateWidth-24
                                    Wrap: =true
                                    X: =12
                                    Y: =56
                              - lblFLFmeaRevisionModeEffect:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: =Coalesce(LookUp(colFLFmeaFailureEffects,FailureModeId=ThisItem.FailureModeId,OperationalEffect),"Efecto pendiente")
                                    Width: =Parent.TemplateWidth-24
                                    Wrap: =true
                                    X: =12
                                    Y: =87

                  - conFLFmeaRevisionTasks:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ColorValue("#BBF7D0")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue("#FFFFFF")
                        Height: =Parent.Height-264
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.Width-conFLFmeaRevisionModes.X-conFLFmeaRevisionModes.Width-36
                        X: =conFLFmeaRevisionModes.X+conFLFmeaRevisionModes.Width+12
                        Y: =252
                      Children:
                        - lblFLFmeaRevisionTasksTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#15803D")
                              FontWeight: =FontWeight.Semibold
                              Size: =9
                              Text: ="TAREAS PROPUESTAS"
                              Width: =Parent.Width-32
                              X: =16
                              Y: =14
                        - lblFLFmeaRevisionTasksHint:
                            Control: ModernText@1.0.0
                            Properties:
                              AutoHeight: =true
                              Color: =ColorValue("#64748B")
                              Size: =8
                              Text: ="Una tarea puede cubrir varios modos y un modo puede requerir varias tareas. La frecuencia final se ajusta al aplicar la revisión al activo."
                              Width: =Parent.Width-32
                              Wrap: =true
                              X: =16
                              Y: =36
                        - galFLFmeaRevisionTasks:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =Color.Transparent
                              Height: =Parent.Height-88
                              Items: =Filter(colFLProposedTasks,FmeaRevisionId=varFLActiveFmeaRevisionId)
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =116
                              Width: =Parent.Width-20
                              X: =10
                              Y: =78
                            Children:
                              - btnFLFmeaRevisionTaskRow:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorValue("#DCFCE7")
                                    BorderThickness: =1
                                    Color: =Color.Transparent
                                    Fill: =ColorValue("#F7FEE7")
                                    Height: =Parent.TemplateHeight-6
                                    HoverFill: =ColorValue("#ECFCCB")
                                    OnSelect: =false
                                    PressedFill: =ColorValue("#D9F99D")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                                    X: =0
                                    Y: =3
                              - lblFLFmeaRevisionTaskCode:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#15803D")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: =ThisItem.TaskCode
                                    Width: =Parent.TemplateWidth-24
                                    X: =12
                                    Y: =10
                              - lblFLFmeaRevisionTaskName:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: =ThisItem.Name
                                    Width: =Parent.TemplateWidth-24
                                    Wrap: =true
                                    X: =12
                                    Y: =30
                              - lblFLFmeaRevisionTaskCoverage:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    Size: =8
                                    Text: |-
                                      ="Cubre: " & Concat(Filter(colFLTaskFailureModeLinks,ProposedMaintenanceTaskId=ThisItem.ProposedMaintenanceTaskId),FailureModeId," · ")
                                    Width: =Parent.TemplateWidth-24
                                    Wrap: =true
                                    X: =12
                                    Y: =59
                              - lblFLFmeaRevisionTaskBase:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="Base " & Text(ThisItem.BaseIntervalValue) & " " & ThisItem.BaseIntervalUnit & " · Procedimiento " & If(ThisItem.ProcedureRequiredByDefault,"habitualmente requerido","opcional/no requerido")
                                    Width: =Parent.TemplateWidth-24
                                    Wrap: =true
                                    X: =12
                                    Y: =85