                                    Color: =ColorValue("#334155")
                                    Size: =10
                                    Text: =varFLExistingControls
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =46
                              - lblFLAMEFConfidence:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#166534")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: |-
                                      ="Confianza AMEF: " & varFLAMEFConfidence
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =100
                              - lblFLAMEFException:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#B45309")
                                    Size: =9
                                    Text: =varFLAMEFException
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =132
                              - cmpFLAMEFGate:
                                  Control: CanvasComponent
                                  ComponentName: cmp_FL_GatePanelPro
                                  Properties:
                                    CanContinue: =!IsBlank(varFLFailureEffectLocal) && !IsBlank(varFLFailureEffectSystem) && !IsBlank(varFLFailureEffectOperational) && varFLSeverity>0 && varFLOccurrence>0 && varFLDetection>0 && !IsBlank(varFLExistingControls)
                                    ContinueLabel: ="Confirmar AMEF"
                                    GateStatus: =If(!IsBlank(varFLFailureEffectLocal) && !IsBlank(varFLFailureEffectSystem) && !IsBlank(varFLFailureEffectOperational) && varFLSeverity>0 && varFLOccurrence>0 && varFLDetection>0 && !IsBlank(varFLExistingControls),"warning","blocked")
                                    GateTitle: ="Gate FL-11"
                                    Height: =110
                                    OnContinue: |-
                                      =
                                      UpdateIf(colFLStageExecutions,StageOrder>=7 && StageOrder<=11,{Status:"confirmed"});
                                      Set(varFLCaseDraft,false);
                                      Set(varFLCurrentStageId,"FL-12");
                                      Navigate(scr_FL_RCM,ScreenTransition.None)
                                    OutputLabel: ="AMEF preparado para decisión RCM"
                                    Reason: ="Existe una advertencia de calidad sobre el baseline de vibración, pero la evidencia permite continuar con trazabilidad."
                                    RequiredAction: ="Conservar la excepción y revisar el baseline cuando exista dato nuevo"
                                    ResponsibleRole: ="Ingeniería de Fiabilidad"
                                    Summary: ="AMEF preparado con advertencia"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =138
