Screens:
  scr_FL_AMEF:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: |-
        =
        Set(varFLNavKey,"Strategy");
        If(!(varFLCurrentStageId="FL-07" || varFLCurrentStageId="FL-08" || varFLCurrentStageId="FL-09" || varFLCurrentStageId="FL-10" || varFLCurrentStageId="FL-11"),Set(varFLCurrentStageId,"FL-07"));
        Set(varFLRiskScore,varFLSeverity*varFLOccurrence*varFLDetection)

    Children:
      - conFLAMEFRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmpFLAMEFNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Strategy"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLAMEFNav.SelectedKey);
                    Switch(cmpFLAMEFNav.SelectedKey,"Home",Navigate(scr_FL_Home,ScreenTransition.None),"Assets",Navigate(scr_FL_FLH,ScreenTransition.None),"Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),"Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),"Governance",Navigate(scr_FL_Governance,ScreenTransition.None),"Settings",Navigate(scr_FL_Settings,ScreenTransition.None))
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0
            - conFLAMEFMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLAMEFNav.Width
                  X: =cmpFLAMEFNav.Width
                  Y: =0
                Children:
                  - cmpFLAMEFHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="ANÁLISIS DE RIESGO"
                        CaseCode: =varFLActiveCaseCode
                        CaseType: =LookUp(colFLFailureModes,Code=varFLSelectedFailureMode,Name)
                        Height: =132
                        JourneyHint: =LookUp(colFLStageExecutions,StageId=varFLCurrentStageId,StageLabel)
                        JourneyPosition: =Text(LookUp(colFLStageExecutions,StageId=varFLCurrentStageId,StageOrder),"00") & " / 28"
                        ProgressCurrent: =LookUp(colFLStageExecutions,StageId=varFLCurrentStageId,StageOrder)
                        ProgressTotal: =28
                        ReviewHint: ="FL-07 a FL-11"
                        ReviewState: =If(varFLCaseDraft,"Borrador","En revisión")
                        Subtitle: ="Describe efectos, confirma consecuencias y aplica la valoración de riesgo antes de entrar en RCM."
                        Title: ="AMEF · Efectos y riesgo"
                        Width: =Parent.Width
                        WorkspaceCode: ="ESTRATEGIA"
                        X: =0
                        Y: =0
                  - cmpFLAMEFRail:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_ProcessRailPro
                      Properties:
                        ActiveStageId: =varFLCurrentStageId
                        CompactMode: =true
                        Height: =Parent.Height-cmpFLAMEFHeader.Height-24
                        Items: =colFLStageExecutions
                        OnSelectStage: |-
                          =
                          Set(varFLCurrentStageId,cmpFLAMEFRail.SelectedStageIdOut);
                          Switch(cmpFLAMEFRail.SelectedScreenKeyOut,"Context",Navigate(scr_FL_Context,ScreenTransition.None),"Functions",Navigate(scr_FL_Functions,ScreenTransition.None),"FailureModes",Navigate(scr_FL_FailureModes,ScreenTransition.None),"AMEF",Navigate(scr_FL_AMEF,ScreenTransition.None),"RCM",Navigate(scr_FL_RCM,ScreenTransition.None),"Economics",Navigate(scr_FL_Economics,ScreenTransition.None),"Task",Navigate(scr_FL_Task,ScreenTransition.None),"PlanPackage",Navigate(scr_FL_PlanPackage,ScreenTransition.None),"Traceability",Navigate(scr_FL_Traceability,ScreenTransition.None),"ReviewApproval",Navigate(scr_FL_ReviewApproval,ScreenTransition.None),"Effectiveness",Navigate(scr_FL_Effectiveness,ScreenTransition.None))
                        ShowPhaseHeaders: =true
                        Width: =300
                        X: =24
                        Y: =cmpFLAMEFHeader.Height+12
                  - conFLAMEFWork:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height-cmpFLAMEFHeader.Height-24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width-cmpFLAMEFRail.Width-60
                        X: =cmpFLAMEFRail.X+cmpFLAMEFRail.Width+12
                        Y: =cmpFLAMEFHeader.Height+12
                      Children:
                        - conFLAMEFMode:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#E2E8F0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =76
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - lblFLAMEFModeLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#7C3AED")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="MODO CONFIRMADO"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =12
                              - lblFLAMEFModeValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =13
                                    Text: =LookUp(colFLFailureModes,HumanSelected,Code & " · " & Name)
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =36
                        - conFLAMEFEffects:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#BAE6FD")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =288
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =(Parent.Width-12)*0.54
                              X: =0
                              Y: =88
                            Children:
                              - lblFLAMEFEffectsLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0284C7")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="FL-07 · EFECTOS DEL MODO DE FALLO"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =14
                              - lblFLAMEFLocalLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="Efecto local"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =42
                              - txtFLAMEFLocal:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =ColorValue("#BAE6FD")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Default: =varFLFailureEffectLocal
                                    Fill: =ColorValue("#F8FCFF")
                                    Height: =52
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =
                                      Set(varFLFailureEffectLocal,Trim(Self.Text));
                                      Set(varFLCaseDraft,true);
                                      UpdateIf(colFLStageExecutions,StageId="FL-07",{Status:"draft"})
                                    PaddingLeft: =10
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =62
                              - lblFLAMEFSystemLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="Efecto en sistema"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =124
                              - txtFLAMEFSystem:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =ColorValue("#BAE6FD")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Default: =varFLFailureEffectSystem
                                    Fill: =ColorValue("#F8FCFF")
                                    Height: =52
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =
                                      Set(varFLFailureEffectSystem,Trim(Self.Text));
                                      Set(varFLCaseDraft,true);
                                      UpdateIf(colFLStageExecutions,StageId="FL-07",{Status:"draft"})
                                    PaddingLeft: =10
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =144
                              - lblFLAMEFOperationalLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="Efecto operacional"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =206
                              - txtFLAMEFOperational:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =ColorValue("#BAE6FD")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Default: =varFLFailureEffectOperational
                                    Fill: =ColorValue("#F8FCFF")
                                    Height: =52
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =
                                      Set(varFLFailureEffectOperational,Trim(Self.Text));
                                      Set(varFLCaseDraft,true);
                                      UpdateIf(colFLStageExecutions,StageId="FL-07",{Status:"draft"})
                                    PaddingLeft: =10
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =226
                        - conFLAMEFRisk:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#E2E8F0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =288
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =Parent.Width-conFLAMEFEffects.Width-12
                              X: =conFLAMEFEffects.Width+12
                              Y: =88
                            Children:
                              - lblFLAMEFRiskLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#EA580C")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="FL-08 / 09 / 10 · RIESGO"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =14
                              - lblFLAMEFConsequence:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#334155")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =10
                                    Text: |-
                                      ="Consecuencia confirmada: " & varFLConsequenceClass
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =43
                              - lblFLAMEFS:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =18
                                    Text: =Text(varFLSeverity)
                                    Width: =64
                                    X: =18
                                    Y: =86
                              - lblFLAMEFSHint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="Severidad"
                                    Width: =64
                                    X: =18
                                    Y: =116
                              - lblFLAMEFO:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =18
                                    Text: =Text(varFLOccurrence)
                                    Width: =64
                                    X: =96
                                    Y: =86
                              - lblFLAMEFOHint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="Ocurrencia"
                                    Width: =70
                                    X: =93
                                    Y: =116
                              - lblFLAMEFD:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =18
                                    Text: =Text(varFLDetection)
                                    Width: =64
                                    X: =174
                                    Y: =86
                              - lblFLAMEFDHint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="Detección"
                                    Width: =64
                                    X: =174
                                    Y: =116
                              - conFLAMEFScore:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =ColorValue("#FED7AA")
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =ColorValue("#FFF7ED")
                                    Height: =72
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =150
                                  Children:
                                    - lblFLAMEFScoreLabel:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#C2410C")
                                          FontWeight: =FontWeight.Semibold
                                          Size: =8
