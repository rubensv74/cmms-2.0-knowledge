Screens:
  scr_FL_AMEF:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#0284C7")
      OnVisible: |-
        =
        Set(varFLNavKey,"Strategy");
        If(
            !(varFLCurrentStageId="FL-07" || varFLCurrentStageId="FL-08" || varFLCurrentStageId="FL-09" || varFLCurrentStageId="FL-10" || varFLCurrentStageId="FL-11"),
            Set(varFLCurrentStageId,"FL-07")
        );
        Set(varFLRiskScore,varFLSeverity*varFLOccurrence*varFLDetection)

    Children:
      - conFLAMEFRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0,0,0,0)
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width

          Children:
            - cmpFLAMEFNav:
                Control: CanvasComponent
                ComponentName: cmp_FL_SidebarPro
                Properties:
                  ActiveKey: ="Strategy"
                  AppTitle: ="CMMS 2.0"
                  AppSubtitle: ="Functional Lab"
                  CurrentCaseCode: =varFLActiveCaseCode
                  CurrentCaseName: =varFLActiveAssetName
                  EnvironmentLabel: ="LAB CONCEPTUAL"
                  Height: =Parent.Height
                  IsCollapsed: =varFLSidebarCollapsed
                  NavItems: =colFLV2NavItems
                  OnSelectItem: |-
                    =
                    Set(varFLNavKey,cmpFLAMEFNav.SelectedKey);
                    Switch(
                        cmpFLAMEFNav.SelectedKey,
                        "Home",Navigate(scr_FL_Home,ScreenTransition.None),
                        "Assets",Navigate(scr_FL_FLH,ScreenTransition.None),
                        "Strategy",Navigate(scr_FL_AnalysisRegister,ScreenTransition.None),
                        "Plans",Navigate(scr_FL_MaintenancePlans,ScreenTransition.None),
                        "Governance",Navigate(scr_FL_Governance,ScreenTransition.None),
                        "Settings",Navigate(scr_FL_Settings,ScreenTransition.None)
                    )
                  UserRole: =varFLCurrentRole
                  Width: =If(varFLSidebarCollapsed,76,220)
                  X: =0
                  Y: =0

            - conFLAMEFMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(0,0,0,0)
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#F6F8FB")
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-cmpFLAMEFNav.Width
                  X: =cmpFLAMEFNav.Width
                  Y: =0

                Children:
                  - cmpFLAMEFHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_PageHeaderPro
                      Properties:
                        Archetype: ="ANÁLISIS DE RIESGO"
                        CaseCode: =varFLActiveCaseCode
                        CaseType: =LookUp(colFLFailureModes,Code=varFLSelectedFailureMode,Name)
                        Height: =132
                        JourneyHint: =LookUp(colFLStageExecutions,StageId=varFLCurrentStageId,StageLabel)
                        JourneyPosition: =Text(LookUp(colFLStageExecutions,StageId=varFLCurrentStageId,StageOrder),"00") & " / 28"
                        ProgressCurrent: =LookUp(colFLStageExecutions,StageId=varFLCurrentStageId,StageOrder)
                        ProgressTotal: =28
                        ReviewHint: ="FL-07 a FL-11"
                        ReviewState: =If(varFLCaseDraft,"Borrador","En revisión")
                        Subtitle: ="Describe efectos, valora el riesgo y distingue claramente cálculo, recomendación y decisión humana."
                        Title: ="AMEF · Efectos y riesgo"
                        Width: =Parent.Width
                        WorkspaceCode: ="ESTRATEGIA"
                        X: =0
                        Y: =0

                  - cmpFLAMEFRail:
                      Control: CanvasComponent
                      ComponentName: cmp_FL_ProcessRailPro
                      Properties:
                        ActiveStageId: =varFLCurrentStageId
                        CompactMode: =true
                        Height: =Parent.Height-cmpFLAMEFHeader.Height-24
                        Items: =colFLStageExecutions
                        OnSelectStage: |-
                          =
                          Set(varFLCurrentStageId,cmpFLAMEFRail.SelectedStageIdOut);
                          Switch(
                              cmpFLAMEFRail.SelectedScreenKeyOut,
                              "Context",Navigate(scr_FL_Context,ScreenTransition.None),
                              "Functions",Navigate(scr_FL_Functions,ScreenTransition.None),
                              "FailureModes",Navigate(scr_FL_FailureModes,ScreenTransition.None),
                              "AMEF",Navigate(scr_FL_AMEF,ScreenTransition.None),
                              "RCM",Navigate(scr_FL_RCM,ScreenTransition.None),
                              "Economics",Navigate(scr_FL_Economics,ScreenTransition.None),
                              "Task",Navigate(scr_FL_Task,ScreenTransition.None),
                              "PlanPackage",Navigate(scr_FL_PlanPackage,ScreenTransition.None),
                              "Traceability",Navigate(scr_FL_Traceability,ScreenTransition.None),
                              "ReviewApproval",Navigate(scr_FL_ReviewApproval,ScreenTransition.None),
                              "Effectiveness",Navigate(scr_FL_Effectiveness,ScreenTransition.None)
                          )
                        ShowPhaseHeaders: =true
                        Width: =300
                        X: =24
                        Y: =cmpFLAMEFHeader.Height+12

                  - conFLAMEFWork:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(0,0,0,0)
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height-cmpFLAMEFHeader.Height-24
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width-cmpFLAMEFRail.Width-60
                        X: =cmpFLAMEFRail.X+cmpFLAMEFRail.Width+12
                        Y: =cmpFLAMEFHeader.Height+12

                      Children:
                        - conFLAMEFMode:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#E2E8F0")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =60
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - lblFLAMEFModeLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#7C3AED")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="MODO CONFIRMADO"
                                    Width: =Parent.Width-210
                                    X: =18
                                    Y: =10
                              - lblFLAMEFModeValue:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12
                                    Text: =LookUp(colFLFailureModes,HumanSelected,Code & " · " & Name)
                                    Width: =Parent.Width-210
                                    Wrap: =false
                                    X: =18
                                    Y: =31
                              - lblFLAMEFDetectionLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="DETECCIÓN · 1–10"
                                    Width: =105
                                    X: =Parent.Width-174
                                    Y: =8
                              - txtFLAMEFDetection:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =ColorValue("#CBD5E1")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Default: =Text(varFLDetection)
                                    Fill: =ColorValue("#F8FAFC")
                                    Font: =Font.'Segoe UI'
                                    Height: =30
                                    HoverBorderColor: =ColorValue("#0284C7")
                                    OnChange: |-
                                      =
                                      Set(varFLDetection,Max(1,Min(10,Value(Self.Text))));
                                      Set(varFLRiskScore,varFLSeverity*varFLOccurrence*varFLDetection);
                                      Set(varFLCaseDraft,true);
                                      UpdateIf(colFLStageExecutions,StageId="FL-09",{Status:"draft"})
                                    PaddingLeft: =8
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Width: =56
                                    X: =Parent.Width-70
                                    Y: =22

                        - conFLAMEFEffects:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ColorValue("#BAE6FD")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue("#FFFFFF")
                              Height: =320
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =(Parent.Width-12)*0.43
                              X: =0
                              Y: =72
                            Children:
                              - lblFLAMEFEffectsLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0284C7")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =9
                                    Text: ="FL-07 · EFECTOS DEL MODO DE FALLO"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =14
                              - lblFLAMEFEffectsHint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =8
                                    Text: ="Trabajo humano · describe qué ocurre localmente, en el sistema y en la operación."
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =36
                              - lblFLAMEFLocalLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="Efecto local"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =72
                              - txtFLAMEFLocal:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =ColorValue("#BAE6FD")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Default: =varFLFailureEffectLocal
                                    Fill: =ColorValue("#F8FCFF")
                                    Height: =56
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =
                                      Set(varFLFailureEffectLocal,Trim(Self.Text));
                                      Set(varFLCaseDraft,true);
                                      UpdateIf(colFLStageExecutions,StageId="FL-07",{Status:"draft"})
                                    PaddingLeft: =10
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =92
                              - lblFLAMEFSystemLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="Efecto en sistema"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =158
                              - txtFLAMEFSystem:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =ColorValue("#BAE6FD")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Default: =varFLFailureEffectSystem
                                    Fill: =ColorValue("#F8FCFF")
                                    Height: =56
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =
                                      Set(varFLFailureEffectSystem,Trim(Self.Text));
                                      Set(varFLCaseDraft,true);
                                      UpdateIf(colFLStageExecutions,StageId="FL-07",{Status:"draft"})
                                    PaddingLeft: =10
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =178
                              - lblFLAMEFOperationalLabel:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="Efecto operacional"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =244
                              - txtFLAMEFOperational:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =ColorValue("#BAE6FD")
                                    BorderThickness: =1
                                    Color: =ColorValue("#0F172A")
                                    Default: =varFLFailureEffectOperational
                                    Fill: =ColorValue("#F8FCFF")
                                    Height: =54
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =
                                      Set(varFLFailureEffectOperational,Trim(Self.Text));
                                      Set(varFLCaseDraft,true);
                                      UpdateIf(colFLStageExecutions,StageId="FL-07",{Status:"draft"})
                                    PaddingLeft: =10
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =264

                        - cmpFLAMEFRiskMatrix:
                            Control: CanvasComponent
                            ComponentName: cmp_FL_RiskMatrixPro
                            Properties:
                              CriticalOverride: =varFLCriticalOverride
                              DetectionValue: =varFLDetection
                              Height: =320
                              HighMax: =70
                              LowMax: =20
                              ModerateMax: =40
                              OccurrenceValue: =varFLOccurrence
                              OnSelectCell: |-
                                =
                                Set(varFLSeverity,cmpFLAMEFRiskMatrix.SelectedSeverityOut);
                                Set(varFLOccurrence,cmpFLAMEFRiskMatrix.SelectedOccurrenceOut);
                                Set(varFLRiskScore,varFLSeverity*varFLOccurrence*varFLDetection);
                                Set(varFLCurrentStageId,"FL-09");
                                Set(varFLCaseDraft,true);
                                UpdateIf(colFLStageExecutions,StageId="FL-09",{Status:"draft"})
                              RiskScore: =varFLRiskScore
                              ScaleNote: ="Matriz S×O de laboratorio · umbrales configurables y pendientes de validación corporativa"
                              SeverityValue: =varFLSeverity
                              Subtitle: ="Selecciona una celda para revisar Severidad y Ocurrencia. Detección participa en el NPR, no en la posición de la matriz."
                              Title: ="FL-09 · Matriz de criticidad"
                              Width: =Parent.Width-conFLAMEFEffects.Width-12
                              X: =conFLAMEFEffects.Width+12
                              Y: =72

                        - cmpFLAMEFDecision:
                            Control: CanvasComponent
                            ComponentName: cmp_FL_DecisionPanelPro
                            Properties:
                              CanConfirm: =true
                              CanOverride: =true
                              ConfirmLabel: ="Confirmar consecuencia"
                              ContextText: ="El sistema puede proponer una clasificación a partir de los efectos documentados; la autoridad sigue siendo humana."
                              DecisionReason: ="Los efectos principales afectan a disponibilidad y capacidad del proceso."
                              Height: =206
                              HumanDecisionValue: =varFLConsequenceClass
                              IsOverride: =false
                              OnConfirmDecision: |-
                                =
                                UpdateIf(colFLStageExecutions,StageId="FL-08",{Status:"confirmed"});
                                Set(varFLCurrentStageId,"FL-10");
                                Set(varFLCaseDraft,true)
                              OnOverrideDecision: =Set(varFLCaseDraft,true)
                              RecommendationExplanation: |-
                                ="Caso ilustrativo: no se ha identificado una consecuencia dominante de seguridad o medio ambiente."
                              RecommendationLabel: ="Clasificación recomendada"
                              RecommendationValue: ="Operacional"
                              RequiredRole: ="Ingeniería de Fiabilidad"
                              ShowDecision: =true
                              ShowRecommendation: =true
                              ShowSystemResult: =true
                              SystemResultLabel: ="NPR · cálculo"
                              SystemResultValue: =Text(varFLRiskScore)
                              Title: ="FL-08 / 10 · Consecuencia y prioridad"
                              Width: =Parent.Width*0.56
                              X: =0
                              Y: =404

                        - conFLAMEFGate:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(!IsBlank(Trim(varFLFailureEffectLocal)) && !IsBlank(Trim(varFLFailureEffectSystem)) && !IsBlank(Trim(varFLFailureEffectOperational)) && varFLSeverity>=1 && varFLSeverity<=10 && varFLOccurrence>=1 && varFLOccurrence<=10 && varFLDetection>=1 && varFLDetection<=10,ColorValue("#BBF7D0"),ColorValue("#FED7AA"))
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(!IsBlank(Trim(varFLFailureEffectLocal)) && !IsBlank(Trim(varFLFailureEffectSystem)) && !IsBlank(Trim(varFLFailureEffectOperational)) && varFLSeverity>=1 && varFLSeverity<=10 && varFLOccurrence>=1 && varFLOccurrence<=10 && varFLDetection>=1 && varFLDetection<=10,ColorValue("#F0FDF4"),ColorValue("#FFF7ED"))
                              Height: =206
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              Width: =Parent.Width-cmpFLAMEFDecision.Width-12
                              X: =cmpFLAMEFDecision.Width+12
                              Y: =404
                            Children:
                              - lblFLAMEFGateEyebrow:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="FL-11 · GATE AMEF"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =14
                              - lblFLAMEFGateState:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#0F172A")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =13
                                    Text: =If(!IsBlank(Trim(varFLFailureEffectLocal)) && !IsBlank(Trim(varFLFailureEffectSystem)) && !IsBlank(Trim(varFLFailureEffectOperational)) && varFLSeverity>=1 && varFLSeverity<=10 && varFLOccurrence>=1 && varFLOccurrence<=10 && varFLDetection>=1 && varFLDetection<=10,"Preparado para entrar en RCM","Revisión AMEF incompleta")
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =39
                              - lblFLAMEFGateReason:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =9
                                    Text: =If(IsBlank(Trim(varFLFailureEffectLocal)) || IsBlank(Trim(varFLFailureEffectSystem)) || IsBlank(Trim(varFLFailureEffectOperational)),"Completa los tres niveles de efecto.",If(varFLSeverity<1 || varFLSeverity>10 || varFLOccurrence<1 || varFLOccurrence>10 || varFLDetection<1 || varFLDetection>10,"S, O y D deben estar entre 1 y 10.","Efectos, criticidad, NPR y clasificación quedan disponibles para la decisión RCM."))
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =70
                              - lblFLAMEFGateOutput:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#475569")
                                    FontWeight: =FontWeight.Semibold
                                    Size: =8
                                    Text: ="OUTPUT → RiskAssessment + consecuencia confirmada"
                                    Width: =Parent.Width-36
                                    X: =18
                                    Y: =115
                              - btnFLAMEFContinue:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorValue("#0284C7")
                                    BorderThickness: =1
                                    Color: =Color.White
                                    DisplayMode: =If(!IsBlank(Trim(varFLFailureEffectLocal)) && !IsBlank(Trim(varFLFailureEffectSystem)) && !IsBlank(Trim(varFLFailureEffectOperational)) && varFLSeverity>=1 && varFLSeverity<=10 && varFLOccurrence>=1 && varFLOccurrence<=10 && varFLDetection>=1 && varFLDetection<=10,DisplayMode.Edit,DisplayMode.Disabled)
                                    Fill: =ColorValue("#0284C7")
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =36
                                    HoverFill: =ColorValue("#0369A1")
                                    OnSelect: |-
                                      =
                                      UpdateIf(colFLStageExecutions,StageId="FL-07" || StageId="FL-08" || StageId="FL-09" || StageId="FL-10" || StageId="FL-11",{Status:"confirmed",IsCurrent:false});
                                      Set(varFLCurrentStageId,"FL-12");
                                      UpdateIf(colFLStageExecutions,StageId="FL-12",{IsCurrent:true});
                                      Set(varFLCaseDraft,true);
                                      Navigate(scr_FL_RCM,ScreenTransition.None)
                                    PressedFill: =ColorValue("#075985")
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =9
                                    Text: ="Continuar a decisión RCM"
                                    Width: =190
                                    X: =Parent.Width-Self.Width-18
                                    Y: =Parent.Height-Self.Height-16
