                                          Width: =Parent.Width-28
                                          X: =14
                                          Y: =10
                                    - lblFLAMEFScoreValue:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#0F172A")
                                          FontWeight: =FontWeight.Semibold
                                          Size: =20
                                          Text: =Text(varFLRiskScore)
                                          Width: =80
                                          X: =14
                                          Y: =34
                                    - lblFLAMEFOverride:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =ColorValue("#64748B")
                                          Size: =9
                                          Text: |-
                                            ="Sobreclasificación crítica: " & varFLCriticalOverride
                                          Width: =Parent.Width-110
                                          X: =102
                                          Y: =39
                              - lblFLAMEFRiskHint:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ColorValue("#64748B")
                                    Size: =9
                                    Text: ="Los valores S/O/D requieren criterio y evidencia; el producto es un cálculo automático, no una decisión."
                                    Width: =Parent.Width-36
                                    Wrap: =true
                                    X: =18
                                    Y: =238
                        - cmpFLAMEFDecision:
                            Control: CanvasComponent
                            ComponentName: cmp_FL_DecisionPanelPro
                            Properties:
                              CanConfirm: =true
                              CanOverride: =true
                              ConfirmLabel: ="Confirmar consecuencia"
                              ContextText: ="El sistema interpreta los efectos documentados y propone una clase de consecuencia. La persona confirma la clasificación."
                              DecisionReason: ="Los efectos principales afectan a disponibilidad y capacidad del proceso."
                              Height: =254
                              HumanDecisionValue: =varFLConsequenceClass
                              IsOverride: =false
                              OnConfirmDecision: =UpdateIf(colFLStageExecutions,StageId="FL-08",{Status:"confirmed"});Set(varFLCaseDraft,true)
                              OnOverrideDecision: =Set(varFLCaseDraft,true)
                              RecommendationExplanation: ="No se ha identificado una consecuencia dominante de seguridad o medio ambiente en el caso ilustrativo."
                              RecommendationLabel: ="Clasificación recomendada"
                              RecommendationValue: ="Operacional"
                              RequiredRole: ="Ingeniería de Fiabilidad"
                              ShowDecision: =true
                              ShowRecommendation: =true
                              ShowSystemResult: =true
                              SystemResultLabel: ="NPR"
                              SystemResultValue: =Text(varFLRiskScore)
                              Title: ="Clasificar consecuencia y prioridad"
