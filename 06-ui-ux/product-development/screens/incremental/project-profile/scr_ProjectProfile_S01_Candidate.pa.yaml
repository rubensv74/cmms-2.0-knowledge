                              FillPortions: =0
                              Height: =36
                              LayoutMinHeight: =36
                              LayoutMinWidth: =44
                              RadiusBottomLeft: =18
                              RadiusBottomRight: =18
                              RadiusTopLeft: =18
                              RadiusTopRight: =18
                              Text: ="RS"
                              Width: =44
