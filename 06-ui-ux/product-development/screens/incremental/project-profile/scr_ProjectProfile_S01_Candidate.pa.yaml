Screens:
  scr_ProjectProfile_S01:
    Properties:
      Fill: =gblTheme.Canvas
      LoadingSpinnerColor: =gblTheme.Primary
      OnVisible: |-
        =Set(varPPSidebarCollapsed,false);
        Set(varPPNavKey,"project_setup");
        Set(varPPProjectCode,"P-001");
        Set(varPPProjectName,"SYNTHETIC DEMO PROJECT A");
        Set(varPPProjectId,"PRJ-001");
        Set(varPPDirty,false);
        Set(varPPStatus,"DRAFT")
    Children:
      - conPP_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =gblTheme.Canvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpPP_Sidebar:
                Control: CanvasComponent
                ComponentName: cmp_CMMS_SidebarPro_RC0
                Properties:
                  ActiveKey: =varPPNavKey
                  AppTitle: ="CMMS 2.0"
                  AppVersion: ="P01"
                  EnvironmentLabel: ="SYNTHETIC"
                  Height: =Parent.Height
                  IsCollapsed: =varPPSidebarCollapsed
                  NavItems: |-
                    =Table(
                        {Order:10, Key:"home", Label:"Home", ShortLabel:"H", IsVisible:true, IsEnabled:true, Tooltip:"Home"},
                        {Order:20, Key:"project_setup", Label:"Project Setup", ShortLabel:"PS", IsVisible:true, IsEnabled:true, Tooltip:"Project Setup"},
                        {Order:30, Key:"assets", Label:"Assets", ShortLabel:"AS", IsVisible:true, IsEnabled:false, Tooltip:"Future product area"},
                        {Order:40, Key:"libraries", Label:"Libraries", ShortLabel:"LI", IsVisible:true, IsEnabled:false, Tooltip:"Future product area"},
                        {Order:50, Key:"maintenance_engineering", Label:"Maintenance Engineering", ShortLabel:"ME", IsVisible:true, IsEnabled:false, Tooltip:"Future product area"},
                        {Order:60, Key:"plans", Label:"Plans", ShortLabel:"PL", IsVisible:true, IsEnabled:false, Tooltip:"Future product area"},
                        {Order:70, Key:"governance", Label:"Governance", ShortLabel:"GO", IsVisible:true, IsEnabled:false, Tooltip:"Future product area"},
                        {Order:80, Key:"administration", Label:"Administration", ShortLabel:"AD", IsVisible:true, IsEnabled:false, Tooltip:"Future product area"}
                    )
                  OnSelectItem: =Set(varPPNavKey,cmpPP_Sidebar.SelectedKey)
                  OnToggleCollapse: =Set(varPPSidebarCollapsed,!varPPSidebarCollapsed)
                  ProjectCode: =varPPProjectCode
                  ProjectName: =varPPProjectName
                  ShowProjectContext: =true
                  Width: =If(varPPSidebarCollapsed,72,248)
            - conPP_Main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblTheme.Canvas
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =16
                  LayoutMinWidth: =640
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conPP_TopBar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =gblTheme.Border
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =gblTheme.Surface
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =64
                        LayoutMinWidth: =320
                        PaddingBottom: =8
                        PaddingLeft: =18
                        PaddingRight: =18
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
