                                    DisplayMode: =If(varPPDirty,DisplayMode.Edit,DisplayMode.Disabled)
                                    FillPortions: =0
                                    Height: =36
                                    LayoutMinHeight: =36
                                    LayoutMinWidth: =90
                                    OnSelect: |-
                                      =Reset(txtPP_ProjectCode);
                                      Reset(txtPP_ProjectName);
                                      Reset(txtPP_Description);
                                      Reset(txtPP_BusinessUnit);
                                      Reset(txtPP_Site);
                                      Reset(txtPP_Country);
                                      Reset(txtPP_TimeZone);
                                      Reset(txtPP_Language);
                                      Reset(txtPP_Scope);
