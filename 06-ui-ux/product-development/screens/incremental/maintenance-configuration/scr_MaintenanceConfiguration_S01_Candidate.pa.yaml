                              EyebrowText: ="PROJECT SETUP"
                              Height: =108
                              PrimaryTextColor: =gblTheme.TextPrimary
                              SecondaryTextColor: =gblTheme.TextSecondary
                              ShowStatus: =true
                              StatusText: =If(varMCDirty,"UNSAVED CHANGES",varMCStatus)
                              StatusTone: =If(varMCDirty,"WARNING","INFO")
                              Subtitle: ="Define project maintenance behavior while preserving the source and governance of every setting."
                              SurfaceColor: =Color.Transparent
                              Title: ="Maintenance Configuration"
                              Width: =Parent.Width
                        - conMC_CommandBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
