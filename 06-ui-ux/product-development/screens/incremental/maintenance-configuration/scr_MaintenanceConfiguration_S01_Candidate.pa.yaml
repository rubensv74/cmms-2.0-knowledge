Screens:
  scr_MaintenanceConfiguration_S01:
    Properties:
      Fill: =gblTheme.Canvas
      LoadingSpinnerColor: =gblTheme.Primary
      OnVisible: |-
        =Set(varMCSidebarCollapsed,false);
        Set(varMCNavKey,"project_setup");
        Set(varMCProjectCode,"P-001");
        Set(varMCProjectName,"SYNTHETIC DEMO PROJECT A");
        Set(varMCProjectId,"PRJ-001");
        Set(varMCDirty,false);
        Set(varMCStatus,"DRAFT SAVED");
        Set(varMCSavedInheritance,"Corporate Default");
        Set(varMCSavedTaxonomy,"Allowed");
        Set(varMCSavedAssetOverrides,"Allowed");
        Set(varMCSavedAMEFBeforeRCM,"Required");
        Set(varMCSavedPublishApproval,"Required");
        Set(varMCSavedPromotionRequests,"Enabled");
        Set(varMCSavedReviewRole,"Maintenance Engineering Lead");
        Set(varMCSavedVersionPolicy,"New version for active changes")
    Children:
      - conMC_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =gblTheme.Canvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpMC_Sidebar:
                Control: CanvasComponent
                ComponentName: cmp_CMMS_SidebarPro_RC0
                Properties:
                  ActiveKey: =varMCNavKey
                  AppTitle: ="CMMS 2.0"
                  AppVersion: ="P01"
                  EnvironmentLabel: ="SYNTHETIC"
                  Height: =Parent.Height
                  IsCollapsed: =varMCSidebarCollapsed
                  NavItems: |-
                    =Table(
                        {Order:10,Key:"home",Label:"Home",ShortLabel:"H",IsVisible:true,IsEnabled:true,Tooltip:"Home"},
                        {Order:20,Key:"project_setup",Label:"Project Setup",ShortLabel:"PS",IsVisible:true,IsEnabled:true,Tooltip:"Project Setup"},
                        {Order:30,Key:"assets",Label:"Assets",ShortLabel:"AS",IsVisible:true,IsEnabled:false,Tooltip:"Future product area"},
                        {Order:40,Key:"libraries",Label:"Libraries",ShortLabel:"LI",IsVisible:true,IsEnabled:false,Tooltip:"Future product area"},
                        {Order:50,Key:"maintenance_engineering",Label:"Maintenance Engineering",ShortLabel:"ME",IsVisible:true,IsEnabled:false,Tooltip:"Future product area"},
                        {Order:60,Key:"plans",Label:"Plans",ShortLabel:"PL",IsVisible:true,IsEnabled:false,Tooltip:"Future product area"},
                        {Order:70,Key:"governance",Label:"Governance",ShortLabel:"GO",IsVisible:true,IsEnabled:false,Tooltip:"Future product area"},
                        {Order:80,Key:"administration",Label:"Administration",ShortLabel:"AD",IsVisible:true,IsEnabled:false,Tooltip:"Future product area"}
                    )
                  OnSelectItem: =Set(varMCNavKey,cmpMC_Sidebar.SelectedKey)
                  OnToggleCollapse: =Set(varMCSidebarCollapsed,!varMCSidebarCollapsed)
                  ProjectCode: =varMCProjectCode
                  ProjectName: =varMCProjectName
                  ShowProjectContext: =true
                  Width: =If(varMCSidebarCollapsed,72,248)
            - conMC_Main:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblTheme.Canvas
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =16
                  LayoutMinWidth: =640
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conMC_TopBar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
