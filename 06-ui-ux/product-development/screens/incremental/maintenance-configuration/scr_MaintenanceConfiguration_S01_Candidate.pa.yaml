                                      Reset(ddMC_Taxonomy);
                                      Reset(ddMC_AssetOverrides);
                                      Reset(ddMC_AMEFBeforeRCM);
                                      Reset(ddMC_PublishApproval);
                                      Reset(ddMC_PromotionRequests);
                                      Reset(ddMC_ReviewRole);
                                      Reset(ddMC_VersionPolicy);
                                      Set(varMCDirty,false)
