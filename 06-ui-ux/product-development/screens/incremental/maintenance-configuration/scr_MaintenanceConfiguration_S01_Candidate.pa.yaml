                        BorderColor: =gblTheme.Border
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =gblTheme.Surface
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =64
                        LayoutMinWidth: =320
                        PaddingBottom: =8
                        PaddingLeft: =18
                        PaddingRight: =18
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
