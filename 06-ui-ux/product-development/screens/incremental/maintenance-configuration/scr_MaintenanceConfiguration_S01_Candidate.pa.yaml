                              BorderColor: =gblTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =gblTheme.Surface
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =56
                              LayoutMinWidth: =320
                              PaddingBottom: =8
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =8
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
