                                      Set(varMCSavedTaxonomy,ddMC_Taxonomy.Selected.Value);
                                      Set(varMCSavedAssetOverrides,ddMC_AssetOverrides.Selected.Value);
                                      Set(varMCSavedAMEFBeforeRCM,ddMC_AMEFBeforeRCM.Selected.Value);
                                      Set(varMCSavedPublishApproval,ddMC_PublishApproval.Selected.Value);
                                      Set(varMCSavedPromotionRequests,ddMC_PromotionRequests.Selected.Value);
                                      Set(varMCSavedReviewRole,ddMC_ReviewRole.Selected.Value);
                                      Set(varMCSavedVersionPolicy,ddMC_VersionPolicy.Selected.Value);
                                      Set(varMCDirty,false);
                                      Set(varMCStatus,"DRAFT SAVED")
