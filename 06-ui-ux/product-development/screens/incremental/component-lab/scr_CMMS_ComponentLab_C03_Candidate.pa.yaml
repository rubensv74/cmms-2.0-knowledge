Screens:
  scr_CMMS_ComponentLab_C03:
    Properties:
      Fill: =ColorValue("#F6F8FB")
      LoadingSpinnerColor: =ColorValue("#1769E0")
    Children:
      - conCMMSC03_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F6F8FB")
            Height: =App.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =App.Width
          Children:
            - lblCMMSC03_Boundary:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =ColorValue("#F4D6A0")
                  BorderThickness: =1
                  Color: =ColorValue("#8A5200")
                  Fill: =ColorValue("#FFF8E8")
                  FillPortions: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =34
                  PaddingLeft: =14
                  Size: =8
                  Text: ="C03 STATE PANEL LAB · CONTROLLED UI STATES · NO PRODUCTION DATA"
                  Width: =Parent.Width-32
                  Wrap: =false
            - cmpCMMSC03_Header:
                Control: CanvasComponent
                ComponentName: cmp_CMMS_PageHeaderPro_RC0
                Properties:
                  AccentColor: =ColorValue("#1769E0")
                  EyebrowText: ="DESIGN SYSTEM"
                  FillPortions: =0
                  Height: =98
                  PrimaryTextColor: =ColorValue("#172033")
                  SecondaryTextColor: =ColorValue("#5C667A")
                  ShowStatus: =true
                  StatusText: ="RC0 · CANDIDATE"
                  StatusTone: ="WARNING"
                  Subtitle: ="Validate standard non-ready and ready states before any operational screen consumes them."
                  SurfaceColor: =Color.Transparent
                  Title: ="State Panel"
                  Width: =Parent.Width-32
            - conCMMSC03_Row1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =230
                  LayoutMinWidth: =1000
                  Width: =Parent.Width-32
                Children:
                  - cmpCMMSC03_Loading:
                      Control: CanvasComponent
                      ComponentName: cmp_CMMS_StatePanelPro_RC0
                      Properties:
                        ActionBusyText: ="Working..."
                        ActionText: ="Retry"
                        FillPortions: =1
                        Height: =230
                        IsActionBusy: =false
                        LayoutMinHeight: =230
                        LayoutMinWidth: =320
                        Message: ="The contract exists and the host is retrieving data. No stale values should be presented as current."
                        OnAction: =false
                        ShowAction: =false
                        State: ="LOADING"
                        Title: ="Loading"
                        Width: =Parent.Width
                  - cmpCMMSC03_Empty:
                      Control: CanvasComponent
                      ComponentName: cmp_CMMS_StatePanelPro_RC0
                      Properties:
                        ActionBusyText: ="Working..."
                        ActionText: ="Create first item"
                        FillPortions: =1
                        Height: =230
                        IsActionBusy: =false
                        LayoutMinHeight: =230
                        LayoutMinWidth: =320
                        Message: ="The request completed successfully, but there are no records in the current scope."
                        OnAction: =false
                        ShowAction: =false
                        State: ="EMPTY"
                        Title: ="No data in scope"
                        Width: =Parent.Width
                  - cmpCMMSC03_Error:
                      Control: CanvasComponent
                      ComponentName: cmp_CMMS_StatePanelPro_RC0
                      Properties:
                        ActionBusyText: ="Retrying..."
                        ActionText: ="Retry"
                        FillPortions: =1
                        Height: =230
                        IsActionBusy: =false
                        LayoutMinHeight: =230
                        LayoutMinWidth: =320
                        Message: ="The host could not complete the operation. The component exposes the failure without inventing fallback data."
                        OnAction: =false
                        ShowAction: =true
                        State: ="ERROR"
                        Title: ="Unable to load"
                        Width: =Parent.Width
            - conCMMSC03_Row2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =230
                  LayoutMinWidth: =1000
                  Width: =Parent.Width-32
                Children:
                  - cmpCMMSC03_Unavailable:
                      Control: CanvasComponent
                      ComponentName: cmp_CMMS_StatePanelPro_RC0
                      Properties:
                        ActionBusyText: ="Working..."
                        ActionText: ="Learn more"
                        FillPortions: =1
                        Height: =230
                        IsActionBusy: =false
                        LayoutMinHeight: =230
                        LayoutMinWidth: =320
                        Message: ="The product surface exists, but the governed capability or data contract has not been implemented yet."
                        OnAction: =false
                        ShowAction: =false
                        State: ="UNAVAILABLE"
                        Title: ="Capability unavailable"
                        Width: =Parent.Width
                  - cmpCMMSC03_NoContext:
                      Control: CanvasComponent
                      ComponentName: cmp_CMMS_StatePanelPro_RC0
                      Properties:
                        ActionBusyText: ="Working..."
                        ActionText: ="Select project"
                        FillPortions: =1
                        Height: =230
                        IsActionBusy: =false
                        LayoutMinHeight: =230
                        LayoutMinWidth: =320
                        Message: ="This surface requires an accepted project context before project-specific information can be shown."
                        OnAction: =false
                        ShowAction: =true
                        State: ="NO_CONTEXT"
                        Title: ="No project selected"
                        Width: =Parent.Width
                  - cmpCMMSC03_Ready:
                      Control: CanvasComponent
                      ComponentName: cmp_CMMS_StatePanelPro_RC0
                      Properties:
                        ActionBusyText: ="Working..."
                        ActionText: ="Continue"
                        FillPortions: =1
                        Height: =230
                        IsActionBusy: =false
                        LayoutMinHeight: =230
                        LayoutMinWidth: =320
                        Message: ="The host has a valid contract and the surface is ready to present its governed content."
                        OnAction: =false
                        ShowAction: =false
                        State: ="READY"
                        Title: ="Ready"
                        Width: =Parent.Width
