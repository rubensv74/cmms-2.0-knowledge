ComponentDefinitions:
  cmp_CMMS_ProjectContextPro:
    DefinitionType: CanvasComponent
    CustomProperties:
      ActorEmail:
        PropertyKind: Input
        DisplayName: ActorEmail
        Description: Functional user email displayed by the host context.
        DataType: Text
        Default: =""
      Caption:
        PropertyKind: Input
        DisplayName: Caption
        Description: Context caption.
        DataType: Text
        Default: ="PROJECT CONTEXT"
      CanChangeProject:
        PropertyKind: Input
        DisplayName: CanChangeProject
        Description: Whether the host allows requesting a project change.
        DataType: Boolean
        Default: =false
      IsBusy:
        PropertyKind: Input
        DisplayName: IsBusy
        Description: Loading state controlled by the host.
        DataType: Boolean
        Default: =false
      ProjectCode:
        PropertyKind: Input
        DisplayName: ProjectCode
        Description: Loaded project code.
        DataType: Text
        Default: =""
      ProjectName:
        PropertyKind: Input
        DisplayName: ProjectName
        Description: Loaded project name.
        DataType: Text
        Default: =""
      OnRequestProjectChange:
        PropertyKind: Event
        DisplayName: OnRequestProjectChange
        Description: Requests the host to open/change project context. Component does not load data directly.
        ReturnType: None
        Default: |+
          =
    Properties:
      Fill: =Color.Transparent
      Height: =56
      Width: =640
    Children:
      - conCMMSProjectContext_Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            AlignInContainer: =AlignInContainer.Stretch
            BorderColor: =ColorValue("#E2E8F0")
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =Color.White
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingBottom: =8
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =8
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Parent.Width
          Children:
            - lblCMMSProjectContext_Caption:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorValue("#64748B")
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Size: =8
                  Text: =cmp_CMMS_ProjectContextPro.Caption
                  Width: =112
            - lblCMMSProjectContext_Project:
                Control: Label@2.5.1
                Properties:
                  Color: =ColorValue("#0F172A")
                  Fill: =Color.Transparent
                  FillPortions: =1
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  Size: =10
                  Text: =If(cmp_CMMS_ProjectContextPro.IsBusy, "Loading project context…", If(IsBlank(cmp_CMMS_ProjectContextPro.ProjectCode), "No project selected", cmp_CMMS_ProjectContextPro.ProjectCode & If(IsBlank(cmp_CMMS_ProjectContextPro.ProjectName), "", " · " & cmp_CMMS_ProjectContextPro.ProjectName)))
                  Width: =Parent.Width
                  Wrap: =false
            - btnCMMSProjectContext_Change:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorValue("#CBD5E1")
                  BorderThickness: =1
                  Color: =ColorValue("#0F172A")
                  DisplayMode: =If(cmp_CMMS_ProjectContextPro.IsBusy, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =Color.White
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  HoverFill: =ColorValue("#F1F5F9")
                  OnSelect: =cmp_CMMS_ProjectContextPro.OnRequestProjectChange()
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =9
                  Text: ="Change"
                  Visible: =cmp_CMMS_ProjectContextPro.CanChangeProject
                  Width: =72
            - lblCMMSProjectContext_Actor:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =ColorValue("#475569")
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Font: =Font.'Segoe UI'
                  Height: =30
                  Size: =9
                  Text: =cmp_CMMS_ProjectContextPro.ActorEmail
                  Visible: =!IsBlank(cmp_CMMS_ProjectContextPro.ActorEmail)
                  Width: =220
                  Wrap: =false
